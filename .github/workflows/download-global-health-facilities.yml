name: Download global health facilities — Source 5

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/bootstrap-global-health-facilities.mjs
      - .github/workflows/download-global-health-facilities.yml
  workflow_dispatch:
    inputs:
      country_codes:
        description: Comma-separated ISO alpha-2 country codes
        required: false
        default: AF

permissions:
  contents: write

jobs:
  generate-source-five:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Check out international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Source 5 bootstrap syntax
        run: node --check scripts/bootstrap-global-health-facilities.mjs

      - name: Download and normalize facility batch
        env:
          COUNTRY_CODES: ${{ inputs.country_codes || 'AF' }}
          HEALTHSITES_API_KEY: ${{ secrets.HEALTHSITES_API_KEY }}
          SQL_CHUNK_SIZE: '50'
        run: |
          set -euo pipefail
          node scripts/bootstrap-global-health-facilities.mjs | tee /tmp/global-health-facilities.log
          cp /tmp/global-health-facilities.log data/generated/global-health-facilities/run.log

      - name: Publish reviewable SQL and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/global-health-facilities
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: generate Source 5 health facilities [skip ci]"
          git push origin HEAD:data/international-source-bootstrap

      - name: Upload Source 5 artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-health-facilities-source-5
          path: data/generated/global-health-facilities
          if-no-files-found: error
          retention-days: 7
