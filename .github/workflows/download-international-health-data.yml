name: Download international health data

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/bootstrap-world-bank-health-data.mjs
      - .github/workflows/download-international-health-data.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/bootstrap-world-bank-health-data.mjs
      - .github/workflows/download-international-health-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-normalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'data/international-source-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download World Bank health baseline
        run: |
          mkdir -p data/generated/international
          set +e
          node scripts/bootstrap-world-bank-health-data.mjs > data/generated/international/download.log 2>&1
          status=$?
          echo "$status" > data/generated/international/download.exit-code
          cat data/generated/international/download.log
          exit 0

      - name: Commit generated SQL, manifest, and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/international
          if git diff --cached --quiet; then
            echo "No generated-data changes"
            exit 0
          fi
          git commit -m "data: refresh World Bank international health baseline [skip ci]"
          git push origin HEAD:data/international-source-bootstrap
