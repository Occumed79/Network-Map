name: Build Healthsites PMTiles v2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-healthsites-pmtiles-v2.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: healthsites-pmtiles-build-v2
  cancel-in-progress: false

jobs:
  build:
    name: Convert Healthsites archive to PMTiles
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SOURCE_KEY: source/World.zip
      DESTINATION_KEY: tiles/healthsites.pmtiles
      R2_BUCKET: healthsites-data
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: 'true'

    steps:
      - name: Publish running status
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Healthsites PMTiles v2 build ${context.runId}`;
            const body = [
              `**Status:** in_progress`,
              `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `**Head SHA:** \`${context.sha}\``,
              `**Started:** ${new Date().toISOString()}`,
            ].join("\n\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });

      - name: Validate configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$RCLONE_CONFIG_R2_ENDPOINT" ]] || { echo "Missing R2_ENDPOINT secret"; exit 1; }
          [[ -n "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]] || { echo "Missing R2_ACCESS_KEY_ID secret"; exit 1; }
          [[ -n "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]] || { echo "Missing R2_SECRET_ACCESS_KEY secret"; exit 1; }

      - name: Reclaim runner disk space
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup || true
          df -h /

      - name: Install geospatial build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            gdal-bin \
            git \
            jq \
            libsqlite3-dev \
            unzip \
            zlib1g-dev

          curl --fail --show-error --silent --location https://rclone.org/install.sh -o /tmp/install-rclone.sh
          sudo bash /tmp/install-rclone.sh

          git clone --depth 1 https://github.com/felt/tippecanoe.git /tmp/tippecanoe
          make -C /tmp/tippecanoe -j2
          sudo make -C /tmp/tippecanoe install

          go install github.com/protomaps/go-pmtiles@v1.31.2
          mv "$HOME/go/bin/go-pmtiles" "$HOME/go/bin/pmtiles"

          rclone version
          ogr2ogr --version
          tippecanoe --version
          "$HOME/go/bin/pmtiles" version

      - name: Download archive from R2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/healthsites
          rclone copyto \
            "r2:${R2_BUCKET}/${SOURCE_KEY}" \
            /tmp/healthsites/World.zip \
            --s3-no-check-bucket \
            --multi-thread-streams 4 \
            --retries 5 \
            --low-level-retries 20 \
            --stats 30s \
            --stats-one-line
          test -s /tmp/healthsites/World.zip
          ls -lh /tmp/healthsites/World.zip
          df -h /

      - name: Inspect archive and locate primary shapefile
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          zipinfo -1 /tmp/healthsites/World.zip > /tmp/healthsites/archive-manifest.txt

          SHAPEFILE_PATH="$(python3 - <<'PY'
          import zipfile
          archive = '/tmp/healthsites/World.zip'
          with zipfile.ZipFile(archive) as zf:
              candidates = [entry for entry in zf.infolist() if entry.filename.lower().endswith('.shp')]
              if not candidates:
                  raise SystemExit('No .shp file found in archive')
              print(max(candidates, key=lambda entry: entry.file_size).filename)
          PY
          )"

          echo "Selected shapefile: ${SHAPEFILE_PATH}"
          echo "shapefile_path=${SHAPEFILE_PATH}" >> "$GITHUB_OUTPUT"
          VSI_SOURCE="/vsizip//tmp/healthsites/World.zip/${SHAPEFILE_PATH}"
          ogrinfo -ro -so "$VSI_SOURCE" > /tmp/healthsites/schema.txt
          cat /tmp/healthsites/schema.txt

      - name: Stream shapefile into vector tiles
        shell: bash
        env:
          SHAPEFILE_PATH: ${{ steps.inspect.outputs.shapefile_path }}
        run: |
          set -euo pipefail
          VSI_SOURCE="/vsizip//tmp/healthsites/World.zip/${SHAPEFILE_PATH}"
          MBTILES=/tmp/healthsites/healthsites.mbtiles
          PMTILES=/tmp/healthsites/healthsites.pmtiles

          ogr2ogr \
            -f GeoJSONSeq \
            /vsistdout/ \
            "$VSI_SOURCE" \
            -t_srs EPSG:4326 \
          | tippecanoe \
            --output="$MBTILES" \
            --layer=healthsites \
            --minimum-zoom=0 \
            --maximum-zoom=14 \
            --drop-densest-as-needed \
            --extend-zooms-if-still-dropping \
            --generate-ids \
            --force

          "$HOME/go/bin/pmtiles" convert "$MBTILES" "$PMTILES"
          rm -f "$MBTILES"
          test -s "$PMTILES"
          "$HOME/go/bin/pmtiles" verify "$PMTILES"
          ls -lh "$PMTILES"
          df -h /

      - name: Build metadata
        shell: bash
        env:
          SHAPEFILE_PATH: ${{ steps.inspect.outputs.shapefile_path }}
        run: |
          set -euo pipefail
          SOURCE_SIZE="$(stat -c '%s' /tmp/healthsites/World.zip)"
          TILE_SIZE="$(stat -c '%s' /tmp/healthsites/healthsites.pmtiles)"
          TILE_SHA256="$(sha256sum /tmp/healthsites/healthsites.pmtiles | awk '{print $1}')"
          FEATURE_COUNT="$(awk -F': ' '/Feature Count/ {print $2; exit}' /tmp/healthsites/schema.txt || true)"
          GENERATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          jq -n \
            --arg generatedAt "$GENERATED_AT" \
            --arg sourceKey "$SOURCE_KEY" \
            --arg destinationKey "$DESTINATION_KEY" \
            --arg shapefilePath "$SHAPEFILE_PATH" \
            --arg featureCount "${FEATURE_COUNT:-unknown}" \
            --arg sha256 "$TILE_SHA256" \
            --argjson sourceBytes "$SOURCE_SIZE" \
            --argjson tileBytes "$TILE_SIZE" \
            '{generatedAt:$generatedAt,sourceKey:$sourceKey,destinationKey:$destinationKey,shapefilePath:$shapefilePath,featureCount:$featureCount,sourceBytes:$sourceBytes,tileBytes:$tileBytes,sha256:$sha256,layer:"healthsites",format:"PMTiles"}' \
            > /tmp/healthsites/healthsites-metadata.json
          cat /tmp/healthsites/healthsites-metadata.json

      - name: Upload optimized map data to R2
        shell: bash
        run: |
          set -euo pipefail
          rclone copyto /tmp/healthsites/healthsites.pmtiles "r2:${R2_BUCKET}/${DESTINATION_KEY}" \
            --s3-no-check-bucket --s3-chunk-size 64Mi --s3-upload-concurrency 4 \
            --retries 5 --low-level-retries 20 --stats 30s --stats-one-line
          rclone copyto /tmp/healthsites/healthsites-metadata.json "r2:${R2_BUCKET}/metadata/healthsites-metadata.json" --s3-no-check-bucket
          rclone copyto /tmp/healthsites/schema.txt "r2:${R2_BUCKET}/metadata/healthsites-schema.txt" --s3-no-check-bucket
          rclone copyto /tmp/healthsites/archive-manifest.txt "r2:${R2_BUCKET}/metadata/healthsites-archive-manifest.txt" --s3-no-check-bucket

      - name: Verify PMTiles and metadata in R2
        shell: bash
        run: |
          set -euo pipefail
          rclone lsl "r2:${R2_BUCKET}/${DESTINATION_KEY}" --s3-no-check-bucket
          rclone lsl "r2:${R2_BUCKET}/metadata/healthsites-metadata.json" --s3-no-check-bucket
          rclone lsl "r2:${R2_BUCKET}/metadata/healthsites-schema.txt" --s3-no-check-bucket

      - name: Publish final status
        if: always()
        uses: actions/github-script@v7
        env:
          JOB_STATUS: ${{ job.status }}
        with:
          script: |
            const title = `Healthsites PMTiles v2 build ${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (!issue) return;
            const succeeded = process.env.JOB_STATUS === "success";
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue.number,
              state: succeeded ? "closed" : "open",
              ...(succeeded ? { state_reason: "completed" } : {}),
              body: [
                `**Status:** ${process.env.JOB_STATUS}`,
                `**Run:** https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Head SHA:** \`${context.sha}\``,
                `**Updated:** ${new Date().toISOString()}`,
              ].join("\n\n"),
            });