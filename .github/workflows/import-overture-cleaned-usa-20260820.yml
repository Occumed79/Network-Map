name: Import Overture candidate directly to Neon

on:
  push:
    branches:
      - overture-exact-import-20260830
    paths:
      - .github/workflows/import-overture-cleaned-usa-20260820.yml
      - scripts/import-overture-candidate-direct-neon.py

permissions:
  contents: read
  actions: read

concurrency:
  group: overture-direct-neon-import-20260830
  cancel-in-progress: false

jobs:
  import-overture-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download completed Overture candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: overture-candidate-sqlite
          path: /tmp/overture-candidate
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 33302987142

      - name: Install PostgreSQL client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client
          test -s /tmp/overture-candidate/overture_cleaned_usa.sqlite

      - name: Fix local TSV path for psql copy
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/import-overture-candidate-direct-neon.py')
          s=p.read_text()
          s=s.replace('fd, tsv_path = tempfile.mkstemp(prefix="overture_candidate_", suffix=".tsv")\nos.close(fd)', 'tsv_path = "/tmp/overture_candidate.tsv"')
          s=s.replace("\\copy overture_import FROM :'tsv_path'", "\\copy overture_import FROM '/tmp/overture_candidate.tsv'")
          p.write_text(s)
          PY

      - name: Import available Overture candidate rows directly to production Neon
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATABASE_URL" == postgres* ]] || { echo 'DATABASE_URL secret is missing' >&2; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          python scripts/import-overture-candidate-direct-neon.py /tmp/overture-candidate/overture_cleaned_usa.sqlite

      - name: Final production verification
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::$DATABASE_URL"
          psql "$DATABASE_URL" -Atqc "SELECT 'source_rows='||count(*) FROM public.provider_master_sources WHERE source_key='overture';"
          psql "$DATABASE_URL" -Atqc "SELECT 'providers='||count(DISTINCT master_provider_id) FROM public.provider_master_sources WHERE source_key='overture';"
          psql "$DATABASE_URL" -Atqc "SELECT 'map_visible='||count(DISTINCT v.id) FROM public.provider_master_map_view v JOIN public.provider_master_sources s ON s.master_provider_id=v.id WHERE s.source_key='overture';"
