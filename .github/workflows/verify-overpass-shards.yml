name: Verify Overture Neon Shards

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-overpass-shards.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVERPASS_DATABASE_URL: ${{ secrets.OVERPASS_DATABASE_URL }}
      OVERPASS_DATABASE_URL_2: ${{ secrets.OVERPASS_DATABASE_URL_2 }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client library
        run: npm install --no-save pg@8
      - name: Verify and enable canonical reads for Overture shards
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          async function inspectAndRepair(label, connectionString) {
            if (!connectionString) {
              throw new Error(`${label}: GitHub Actions secret is missing`);
            }

            const client = new Client({ connectionString, application_name: 'network-map-overpass-verifier' });
            await client.connect();
            try {
              const schema = await client.query(`
                SELECT
                  to_regclass('public.provider_master_map_view') IS NOT NULL AS has_map_view,
                  to_regclass('public.medical_providers') IS NOT NULL AS has_medical_providers,
                  to_regclass('public.provider_schema_state') IS NOT NULL AS has_schema_state
              `);
              const hasMapView = schema.rows[0]?.has_map_view === true;
              const hasMedicalProviders = schema.rows[0]?.has_medical_providers === true;
              const hasSchemaState = schema.rows[0]?.has_schema_state === true;
              if (!hasMapView) throw new Error(`${label}: provider_master_map_view is missing`);
              if (!hasMedicalProviders) throw new Error(`${label}: medical_providers is missing`);
              if (!hasSchemaState) throw new Error(`${label}: provider_schema_state is missing; refusing to invent migration state`);

              const mapCount = await client.query(`SELECT count(*)::bigint AS total FROM public.provider_master_map_view`);
              const medicalCount = await client.query(`SELECT count(*)::bigint AS total FROM public.medical_providers`);
              const stateBeforeResult = await client.query(`
                SELECT id, canonical_schema, canonical_read_enabled, migrated_eligible_rows,
                       migration_completed_at, verification_notes
                FROM public.provider_schema_state
                WHERE id = 1
              `);
              const stateBefore = stateBeforeResult.rows[0] || null;
              if (!stateBefore) throw new Error(`${label}: provider_schema_state row id=1 is missing`);

              const sourceCounts = await client.query(`
                SELECT lower(COALESCE(source_key, '')) AS source_key, count(*)::bigint AS total
                FROM public.provider_master_map_view
                GROUP BY 1
                ORDER BY total DESC
                LIMIT 10
              `);

              const mapTotal = Number(mapCount.rows[0]?.total || 0);
              const medicalTotal = Number(medicalCount.rows[0]?.total || 0);
              if (mapTotal <= 0) throw new Error(`${label}: provider_master_map_view is empty`);
              if (medicalTotal !== 0) {
                throw new Error(`${label}: legacy medical_providers contains ${medicalTotal} rows; refusing automatic canonical-read switch`);
              }

              let repaired = false;
              if (stateBefore.canonical_read_enabled !== true) {
                const repair = await client.query(`
                  UPDATE public.provider_schema_state
                  SET canonical_read_enabled = true,
                      migrated_eligible_rows = $1,
                      expected_eligible_rows = COALESCE(expected_eligible_rows, $1),
                      migration_completed_at = COALESCE(migration_completed_at, now()),
                      verification_notes = $2,
                      updated_at = now()
                  WHERE id = 1
                    AND canonical_read_enabled = false
                  RETURNING canonical_read_enabled
                `, [
                  mapTotal,
                  `Overture shard canonical reads enabled after verification: provider_master_map_view=${mapTotal}, medical_providers=0`,
                ]);
                repaired = repair.rowCount === 1;
              }

              const stateAfterResult = await client.query(`
                SELECT id, canonical_schema, canonical_read_enabled, migrated_eligible_rows,
                       expected_eligible_rows, migration_completed_at, verification_notes
                FROM public.provider_schema_state
                WHERE id = 1
              `);
              const stateAfter = stateAfterResult.rows[0] || null;
              if (stateAfter?.canonical_read_enabled !== true) {
                throw new Error(`${label}: canonical_read_enabled is still false after guarded repair`);
              }

              const mapCountAfter = await client.query(`SELECT count(*)::bigint AS total FROM public.provider_master_map_view`);
              const medicalCountAfter = await client.query(`SELECT count(*)::bigint AS total FROM public.medical_providers`);
              const mapTotalAfter = Number(mapCountAfter.rows[0]?.total || 0);
              const medicalTotalAfter = Number(medicalCountAfter.rows[0]?.total || 0);
              if (mapTotalAfter !== mapTotal || medicalTotalAfter !== medicalTotal) {
                throw new Error(`${label}: provider row counts changed during state repair`);
              }

              console.log(JSON.stringify({
                shard: label,
                connected: true,
                hasMapView,
                hasMedicalProviders,
                hasSchemaState,
                providerMasterMapViewCount: mapTotalAfter,
                medicalProvidersCount: medicalTotalAfter,
                stateBefore,
                stateAfter,
                canonicalReadRepaired: repaired,
                topSourceCounts: sourceCounts.rows.map((row) => ({ source_key: row.source_key, total: Number(row.total) })),
              }));
              return mapTotalAfter;
            } finally {
              await client.end();
            }
          }

          (async () => {
            const first = await inspectAndRepair('overpass-project-1', process.env.OVERPASS_DATABASE_URL);
            const second = await inspectAndRepair('overpass-project-2', process.env.OVERPASS_DATABASE_URL_2);
            const combined = first + second;
            console.log(JSON.stringify({ combinedProviderMasterMapViewCount: combined }));
            if (combined !== 483736) {
              throw new Error(`Combined Overture count changed: expected 483736, got ${combined}`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
