name: Sync Turkey MOH authorized healthcare facilities

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-turkey-health-tourism.yml"
      - "scripts/sync-turkey-health-tourism.mjs"
      - "scripts/promote-staged-government-registry.sql"
  schedule:
    - cron: "30 9 6 * *"

permissions:
  contents: read

concurrency:
  group: turkey-health-tourism-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and promote Turkey MOH authorized healthcare facilities
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TARGET_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client poppler-utils

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "HEALTHSITES_DATABASE_URL is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          test "$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT to_regclass('public.provider_master_map_view') IS NOT NULL")" = "t"

      - name: Fetch and normalize Turkey MOH authorized facilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/turkey-health-tourism
          node --max-old-space-size=4096 scripts/sync-turkey-health-tourism.mjs --output /tmp/turkey-health-tourism/provider.tsv
          test -s /tmp/turkey-health-tourism/provider.tsv
          expected=$(( $(wc -l < /tmp/turkey-health-tourism/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/turkey-health-tourism/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 100 )) || { echo "Only ${expected} map-renderable Turkey MOH authorized facilities; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 80 )) || { echo "Only ${distinct_master} Turkey canonical facilities; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"

      - name: Protect against unexpected registry collapse
        shell: bash
        run: |
          set -euo pipefail
          previous="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='tr_moh_health_tourism'" || echo 0)"
          previous="${previous:-0}"
          if (( previous >= 100 )); then
            minimum=$(( previous * 60 / 100 ))
            (( REGISTRY_EXPECTED >= minimum )) || {
              echo "Turkey MOH source shrank from ${previous} to ${REGISTRY_EXPECTED}; refusing replacement" >&2
              exit 1
            }
          fi

      - name: Stage Turkey rows
        shell: bash
        run: |
          set -euo pipefail
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS public.source5_import_staging (
              source_record_id text PRIMARY KEY,
              source_url text,
              name text NOT NULL,
              normalized_name text,
              address_line1 text,
              formatted_address text,
              city text,
              state_region text,
              postal_code text,
              country_code text NOT NULL,
              lat double precision NOT NULL,
              lng double precision NOT NULL,
              phone text,
              website text,
              email text,
              primary_provider_type text,
              capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
              quality_score numeric,
              master_key text NOT NULL
            );
            TRUNCATE public.source5_import_staging;
          "
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" \
            < /tmp/turkey-health-tourism/provider.tsv
          actual="$(psql "$TARGET_DATABASE_URL" -Atqc 'SELECT count(*) FROM public.source5_import_staging')"
          [[ "$actual" == "$REGISTRY_EXPECTED" ]] || { echo "Staging mismatch ${actual} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }

      - name: Promote Turkey into canonical registry
        shell: bash
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v expected="$REGISTRY_EXPECTED" \
            -v expected_master="$REGISTRY_EXPECTED_MASTER" \
            -v source_key="tr_moh_health_tourism" \
            -v country_code="TR" \
            -v source_prefix_pattern="tr-moh-tourism:%" \
            -v source_display_name="Turkey Ministry of Health — Authorized Health Tourism Facilities" \
            -v data_source_name="Turkey MOH Authorized Health Tourism Facilities" \
            -v source_notes="Official Ministry of Health Health Tourism Department authorized hospitals, medical centers, private practices and other healthcare facility lists, current 20 August 2026 edition; geocoded server-side" \
            -f scripts/promote-staged-government-registry.sql

      - name: Verify production Turkey source
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='tr_moh_health_tourism'")"
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_map_view WHERE source_key='tr_moh_health_tourism' AND country_code='TR' AND lat IS NOT NULL AND lng IS NOT NULL")"
          [[ "$source_count" == "$REGISTRY_EXPECTED" ]] || { echo "Turkey MOH lineage mismatch ${source_count} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }
          (( mapped_count >= 80 )) || { echo "Only ${mapped_count} Turkey MOH providers map-renderable" >&2; exit 1; }
          echo "Turkey MOH source records: ${source_count}"
          echo "Turkey MOH map-renderable providers: ${mapped_count}"
