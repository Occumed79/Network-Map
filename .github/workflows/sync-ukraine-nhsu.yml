name: Sync Ukraine NHSU healthcare service locations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-ukraine-nhsu.yml"
      - "scripts/sync-ukraine-nhsu.mjs"
      - "scripts/promote-staged-government-registry.sql"
  schedule:
    - cron: "50 12 * * 2"

permissions:
  contents: read

concurrency:
  group: ukraine-nhsu-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and promote official Ukraine NHSU active service locations
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "HEALTHSITES_DATABASE_URL is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          test "$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT to_regclass('public.provider_master_map_view') IS NOT NULL")" = "t"

      - name: Fetch and normalize Ukraine NHSU locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/ukraine-nhsu
          node --max-old-space-size=4096 scripts/sync-ukraine-nhsu.mjs --output /tmp/ukraine-nhsu/provider.tsv
          test -s /tmp/ukraine-nhsu/provider.tsv
          expected=$(( $(wc -l < /tmp/ukraine-nhsu/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/ukraine-nhsu/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 2000 )) || { echo "Only ${expected} geocoded Ukraine NHSU service locations; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 1500 )) || { echo "Only ${distinct_master} Ukraine canonical locations; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"

      - name: Protect against unexpected registry collapse
        shell: bash
        run: |
          set -euo pipefail
          previous="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='ua_nhsu_pmg'" || echo 0)"
          previous="${previous:-0}"
          if (( previous >= 2000 )); then
            minimum=$(( previous * 60 / 100 ))
            (( REGISTRY_EXPECTED >= minimum )) || {
              echo "Ukraine NHSU source shrank from ${previous} to ${REGISTRY_EXPECTED}; refusing automatic replacement" >&2
              exit 1
            }
          fi

      - name: Stage normalized Ukraine rows
        shell: bash
        run: |
          set -euo pipefail
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS public.source5_import_staging (
              source_record_id text PRIMARY KEY,
              source_url text,
              name text NOT NULL,
              normalized_name text,
              address_line1 text,
              formatted_address text,
              city text,
              state_region text,
              postal_code text,
              country_code text NOT NULL,
              lat double precision NOT NULL,
              lng double precision NOT NULL,
              phone text,
              website text,
              email text,
              primary_provider_type text,
              capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
              quality_score numeric,
              master_key text NOT NULL
            );
            TRUNCATE public.source5_import_staging;
          "
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" \
            < /tmp/ukraine-nhsu/provider.tsv
          actual="$(psql "$TARGET_DATABASE_URL" -Atqc 'SELECT count(*) FROM public.source5_import_staging')"
          [[ "$actual" == "$REGISTRY_EXPECTED" ]] || { echo "Staging mismatch ${actual} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }

      - name: Promote Ukraine into canonical registry
        shell: bash
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v expected="$REGISTRY_EXPECTED" \
            -v expected_master="$REGISTRY_EXPECTED_MASTER" \
            -v source_key="ua_nhsu_pmg" \
            -v country_code="UA" \
            -v source_prefix_pattern="ua-nhsu:%" \
            -v source_display_name="Ukraine NHSU — Active PMG Service Locations" \
            -v data_source_name="Ukraine NHSU PMG" \
            -v source_notes="Official National Health Service of Ukraine open-data resource of active healthcare service locations registered in the eHealth system for providers contracted under the Programme of Medical Guarantees" \
            -f scripts/promote-staged-government-registry.sql

      - name: Verify production Ukraine source
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='ua_nhsu_pmg'")"
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_map_view WHERE source_key='ua_nhsu_pmg' AND country_code='UA' AND lat IS NOT NULL AND lng IS NOT NULL")"
          [[ "$source_count" == "$REGISTRY_EXPECTED" ]] || { echo "Ukraine NHSU lineage mismatch ${source_count} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }
          (( mapped_count >= 1500 )) || { echo "Only ${mapped_count} Ukraine NHSU providers map-renderable" >&2; exit 1; }
          echo "Ukraine NHSU source records: ${source_count}"
          echo "Ukraine NHSU map-renderable providers: ${mapped_count}"
