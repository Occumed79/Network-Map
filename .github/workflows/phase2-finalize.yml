name: Finish Phase 2 repair formatting

on:
  push:
    branches:
      - agent/phase2-clean-repair
  pull_request:
    branches:
      - main
    types:
      - synchronize

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase2-clean-repair

      - name: Correct selectSql formatting
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('api-server/src/routes/providerExplorer.ts')
          text = path.read_text()
          text = text.replace(
              '  if (schema === "legacy") {\n  return `SELECT',
              '  if (schema === "legacy") {\n    return `SELECT',
              1,
          )
          text = text.replace(
              'NULL::text status`;\n}  return `SELECT p.id::text',
              'NULL::text status`;\n  }\n  return `SELECT p.id::text',
              1,
          )
          path.write_text(text)

          source = path.read_text()
          assert '  if (schema === "legacy") {\n    return `SELECT' in source
          assert 'NULL::text status`;\n  }\n  return `SELECT p.id::text' in source
          assert '}  return' not in source
          assert 'mp.created_at AS imported_at' not in source
          PY

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify focused tests and typecheck
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server test:provider-explorer
          pnpm --filter @workspace/occu-med-map test:p2-map
          pnpm run typecheck
          git checkout origin/main -- \
            lib/db/dist/index.d.ts \
            lib/db/dist/index.d.ts.map \
            lib/db/tsconfig.tsbuildinfo

      - name: Commit formatting correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/routes/providerExplorer.ts
          git commit -m "Finish surgical Provider Explorer repair"
          git push origin HEAD:agent/phase2-clean-repair
