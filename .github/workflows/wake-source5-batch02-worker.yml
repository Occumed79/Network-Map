name: Wake Source 5 batch 02 worker

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - .github/workflows/wake-source5-batch02-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out temporary data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Wait for production deployment and keep service awake
        shell: bash
        run: |
          set -euo pipefail
          expected="b866384c717ff65abcf54e1eaea756d2793af87b"
          mkdir -p data/status
          final_response=''
          final_commit=''
          for attempt in $(seq 1 60); do
            response="$(curl --fail --silent --show-error --max-time 90 https://network-map-tool-mqib.onrender.com/api/health || true)"
            commit="$(printf '%s' "$response" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "attempt=${attempt} commit=${commit:-unavailable}"
            final_response="$response"
            final_commit="$commit"
            if [ "$commit" = "$expected" ]; then
              for wake in $(seq 1 20); do
                curl --fail --silent --show-error --max-time 90 https://network-map-tool-mqib.onrender.com/api/health >/dev/null
                sleep 15
              done
              printf '%s\n' "$final_response" > data/status/source5-batch02-live-health.json
              printf 'expected_commit=%s\nobserved_commit=%s\nstatus=ready\n' "$expected" "$final_commit" > data/status/source5-batch02-live-deploy.txt
              exit 0
            fi
            sleep 15
          done
          printf '%s\n' "$final_response" > data/status/source5-batch02-live-health.json
          printf 'expected_commit=%s\nobserved_commit=%s\nstatus=timeout\n' "$expected" "$final_commit" > data/status/source5-batch02-live-deploy.txt
          exit 1

      - name: Publish live deployment status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/source5-batch02-live-health.json data/status/source5-batch02-live-deploy.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record Source 5 batch 02 live deployment status [skip ci]"
          git push origin HEAD:data/international-source-bootstrap
