name: One-shot Mapbox native readiness fix

on:
  push:
    paths:
      - .github/workflows/one-shot-mapbox-native-readiness-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Replace stale Indexed Providers readiness handle
        shell: python
        run: |
          from pathlib import Path

          path = Path('occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs')
          lines = path.read_text().splitlines()
          start = next((i for i, line in enumerate(lines) if 'await page.waitForFunction((input) => {' in line), None)
          if start is None:
              raise SystemExit('Indexed Providers readiness start not found')
          end = next((i for i in range(start, min(len(lines), start + 12)) if 'indexedToggle.elementHandle()' in lines[i]), None)
          if end is None:
              raise SystemExit('Indexed Providers readiness end not found')
          replacement = [
              '  await page.waitForFunction(() => {',
              '    const input = document.querySelector(\'input[aria-label="Indexed Providers"]\');',
              '    const row = input?.closest(".workflow-layer");',
              '    const text = String(row?.textContent || "");',
              '    return Boolean(input?.checked) && /2\\s+loaded/i.test(text);',
              '  }, null, { timeout: 15_000 });',
          ]
          lines[start:end + 1] = replacement
          path.write_text('\n'.join(lines) + '\n')
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated readiness fix
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs
          git commit -m "Stabilize Indexed Providers browser readiness"
          git push origin HEAD:nuclear/mapbox-native-runtime
