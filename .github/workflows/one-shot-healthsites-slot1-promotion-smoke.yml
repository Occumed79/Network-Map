name: One-shot reset Healthsites targets and launch final world import

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-slot1-promotion-smoke.yml'

permissions:
  actions: write
  contents: read

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HEALTHSITES_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}
      HEALTHSITES_DATABASE_URL_2: ${{ secrets.HEALTHSITES_DATABASE_URL_2 }}
      HEALTHSITES_DATABASE_URL_3: ${{ secrets.HEALTHSITES_DATABASE_URL_3 }}
      HEALTHSITES_DATABASE_URL_4: ${{ secrets.HEALTHSITES_DATABASE_URL_4 }}
      HEALTHSITES_DATABASE_URL_5: ${{ secrets.HEALTHSITES_DATABASE_URL_5 }}
      HEALTHSITES_DATABASE_URL_6: ${{ secrets.HEALTHSITES_DATABASE_URL_6 }}
      HEALTHSITES_DATABASE_URL_7: ${{ secrets.HEALTHSITES_DATABASE_URL_7 }}
      HEALTHSITES_DATABASE_URL_8: ${{ secrets.HEALTHSITES_DATABASE_URL_8 }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client

      - name: Reset all eight provider projects to a physically clean state
        shell: bash
        run: |
          set -euo pipefail
          for slot in $(seq 1 8); do
            if [[ "$slot" == "1" ]]; then
              target_url="$HEALTHSITES_DATABASE_URL"
            else
              variable="HEALTHSITES_DATABASE_URL_${slot}"
              target_url="${!variable}"
            fi
            echo "::add-mask::${target_url}"
            echo "===== FINAL RESET SLOT ${slot} ====="
            psql "$target_url" -X -v ON_ERROR_STOP=1 -c "
              TRUNCATE TABLE
                public.provider_master_types,
                public.provider_master_sources,
                public.provider_stage_records,
                public.provider_raw_records,
                public.medical_providers,
                public.provider_master,
                public.source5_import_staging;
            "
            size_bytes="$(psql "$target_url" -Atqc "SELECT pg_database_size(current_database())")"
            provider_rows="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.provider_master")"
            staging_rows="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.source5_import_staging")"
            echo "slot=${slot} db_bytes=${size_bytes} provider_rows=${provider_rows} staging_rows=${staging_rows}"
            [[ "$provider_rows" == "0" ]]
            [[ "$staging_rows" == "0" ]]
            [[ "$size_bytes" -lt 100000000 ]]
          done

      - name: Launch final optimized all-country import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-healthsites-archive-to-provider-projects.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f project_count=8 \
            -f confirmation=IMPORT_ALL_COUNTRIES
