name: One-shot Healthsites slot 1 storage probe

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-slot1-promotion-smoke.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HEALTHSITES_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client

      - name: Measure slot 1 table footprint
        shell: bash
        run: |
          set -euo pipefail
          echo "::add-mask::${HEALTHSITES_DATABASE_URL}"
          psql "$HEALTHSITES_DATABASE_URL" -X -v ON_ERROR_STOP=1 -P pager=off -c "
            SELECT pg_size_pretty(pg_database_size(current_database())) AS database_size;
            SELECT c.relname,
                   pg_size_pretty(pg_relation_size(c.oid)) AS heap,
                   pg_size_pretty(pg_indexes_size(c.oid)) AS indexes,
                   pg_size_pretty(pg_total_relation_size(c.oid)) AS total,
                   COALESCE(s.n_live_tup::bigint,0) AS estimated_rows
            FROM pg_class c
            JOIN pg_namespace n ON n.oid=c.relnamespace
            LEFT JOIN pg_stat_user_tables s ON s.relid=c.oid
            WHERE n.nspname='public' AND c.relkind='r'
            ORDER BY pg_total_relation_size(c.oid) DESC
            LIMIT 25;
            SELECT count(*) AS staging_rows FROM public.source5_import_staging;
          "
