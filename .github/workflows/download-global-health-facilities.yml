name: Package Source 5 repair datasets

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/download-global-health-facilities.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-source-five:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'data/international-source-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out complete temporary data branch history
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 0

      - name: Extract committed Albania, Andorra, and Angola datasets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/source5-repair
          mkdir -p /tmp/source5-repair/AL /tmp/source5-repair/AD /tmp/source5-repair/AO
          git archive 8da777f340b58ef705e5866674eb12afde71023b data/generated/global-health-facilities | tar -xf - -C /tmp/source5-repair/AL
          git archive 03ec1b8c34ecb1dfaa6e25bd7d1567d8b2014f92 data/generated/global-health-facilities | tar -xf - -C /tmp/source5-repair/AD
          git archive e03f8f7bd825f383430a108394cb5ea75b117e0b data/generated/global-health-facilities | tar -xf - -C /tmp/source5-repair/AO
          test "$(jq -r '.countries_requested | join(",")' /tmp/source5-repair/AL/data/generated/global-health-facilities/manifest.json)" = "AL"
          test "$(jq -r '.countries_requested | join(",")' /tmp/source5-repair/AD/data/generated/global-health-facilities/manifest.json)" = "AD"
          test "$(jq -r '.countries_requested | join(",")' /tmp/source5-repair/AO/data/generated/global-health-facilities/manifest.json)" = "AO"
          mkdir -p source5-repair-artifact
          cp -R /tmp/source5-repair/AL source5-repair-artifact/
          cp -R /tmp/source5-repair/AD source5-repair-artifact/
          cp -R /tmp/source5-repair/AO source5-repair-artifact/

      - name: Upload direct-import dataset
        uses: actions/upload-artifact@v4
        with:
          name: source5-al-ad-ao-direct-import
          path: source5-repair-artifact
          if-no-files-found: error
          retention-days: 7
