name: One-shot provider field renderer audit

on:
  push:
    paths:
      - .github/workflows/one-shot-provider-field-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
      - name: Dump provider field builder
        run: |
          grep -n -A 220 -B 30 -E 'function createProviderFieldLayer|const createProviderFieldLayer' occu-med-map/src/App.tsx || true
