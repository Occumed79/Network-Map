name: Sync Finland Suomi.fi healthcare service locations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-finland-ptv.yml"

permissions:
  contents: read

concurrency:
  group: finland-ptv-healthcare-provider-sync
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect live Suomi.fi ServiceLocation payload
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Inspect PTV payload shape
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const base = "https://api.palvelutietovaranto.suomi.fi/api/v11";
          const pageResponse = await fetch(`${base}/ServiceChannel/type/ServiceLocation?page=1`);
          if (!pageResponse.ok) throw new Error(`ID page HTTP ${pageResponse.status}`);
          const page = await pageResponse.json();
          const ids = (page.itemList || []).slice(0, 3).map((x) => x.id).filter(Boolean);
          console.log("PTV_ID_PAGE", JSON.stringify({ keys: Object.keys(page), pageNumber: page.pageNumber, pageCount: page.pageCount, itemCount: page.itemList?.length, ids }, null, 2));
          if (!ids.length) throw new Error("No ServiceLocation IDs returned");

          const params = new URLSearchParams({ guids: ids.join(","), showHeader: "false" });
          const listResponse = await fetch(`${base}/ServiceChannel/list?${params.toString()}`);
          if (!listResponse.ok) throw new Error(`List HTTP ${listResponse.status}`);
          const rows = await listResponse.json();
          console.log("PTV_LIST_IS_ARRAY", Array.isArray(rows), "COUNT", Array.isArray(rows) ? rows.length : null);
          for (const [index, wrapper] of (Array.isArray(rows) ? rows.slice(0, 3) : []).entries()) {
            const location = wrapper?.locationChannel;
            console.log(`PTV_WRAPPER_${index}`, JSON.stringify({
              wrapperKeys: Object.keys(wrapper || {}),
              hasLocationChannel: Boolean(location),
              locationKeys: Object.keys(location || {}),
              id: location?.id,
              channelId: location?.channelId,
              serviceChannelType: location?.serviceChannelType,
              serviceChannelNames: location?.serviceChannelNames,
              serviceChannelDescriptions: location?.serviceChannelDescriptions,
              services: location?.services,
              ontologyTerms: location?.ontologyTerms,
              addresses: location?.addresses,
            }, null, 2));
          }
          NODE
