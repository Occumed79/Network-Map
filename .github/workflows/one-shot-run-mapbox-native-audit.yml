name: One-shot run Mapbox native migration audit

on:
  push:
    paths:
      - .github/workflows/one-shot-run-mapbox-native-audit.yml

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
      - name: Audit Leaflet and Mapbox runtime ownership
        shell: python
        run: |
          from pathlib import Path
          import re
          from collections import Counter, defaultdict

          root = Path('occu-med-map')
          source_files = [p for p in root.rglob('*') if p.suffix in {'.ts', '.tsx'} and 'node_modules' not in p.parts]
          leaflet_files = []
          api_counts = Counter()
          api_files = defaultdict(set)
          for path in source_files:
              text = path.read_text(encoding='utf-8', errors='ignore')
              if re.search(r"from\s+['\"]leaflet['\"]", text):
                  leaflet_files.append(path)
                  for name in re.findall(r'\bL\.([A-Za-z_$][\w$]*)', text):
                      api_counts[name] += 1
                      api_files[name].add(str(path))

          print('=== LEAFLET IMPORT FILES ===')
          for path in sorted(leaflet_files):
              text = path.read_text(encoding='utf-8', errors='ignore')
              print(f'{path} :: lines={text.count(chr(10))+1}')

          print('\n=== LEAFLET API SURFACE ===')
          for name, count in api_counts.most_common():
              files = ', '.join(sorted(api_files[name]))
              print(f'{name}: {count} :: {files}')

          print('\n=== APP OWNERSHIP ===')
          app = Path('occu-med-map/src/App.tsx').read_text(encoding='utf-8', errors='ignore')
          for term in ['mapRef.current','L.layerGroup','L.circleMarker','L.marker','L.circle(','L.geoJSON','fitBounds','getBounds','setView','project(','unproject(','bindPopup','bindTooltip','providerExplorer','density','radius','doLiveSearch']:
              print(f'{term}: {app.count(term)}')

          print('\n=== APP MAP METHOD SURFACE ===')
          methods = Counter(re.findall(r'\bmap\.([A-Za-z_$][\w$]*)\s*\(', app))
          for name,count in methods.most_common():
              print(f'{name}: {count}')

          print('\n=== APP LAYER METHOD SURFACE ===')
          likely = Counter()
          for name in ['addTo','addLayer','removeLayer','clearLayers','eachLayer','bindPopup','bindTooltip','openPopup','closePopup','getPopup','getTooltip','getLatLng','setLatLng','setStyle','bringToFront','on','off','once','remove','addData','getBounds','getRadius','getLatLngs','toGeoJSON']:
              likely[name] = len(re.findall(rf'\.{name}\s*\(', app))
          for name,count in likely.most_common():
              if count: print(f'{name}: {count}')

          print('\n=== MAP CONSTRUCTION OPTIONS ===')
          for match in re.finditer(r'L\.map\((.*?)\)\s*;', app, re.S):
              snippet = match.group(0)
              print(snippet[:1500])
