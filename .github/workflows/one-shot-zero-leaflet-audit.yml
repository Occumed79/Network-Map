name: One-shot native U.S. diagnostics diagnosis

on:
  push:
    paths:
      - .github/workflows/one-shot-zero-leaflet-audit.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Temporarily let TypeScript expose the last stateGeoRef
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/scripts/migrate-us-diagnostics-native.py')
          text = path.read_text()
          target = "for forbidden in ['stateGeoRef','cityLayerRef','customPinRef','tzLayerRef','popDensityLayerRef','savedRadiusLayerRef','labelLayerRef','buildStateLabels(']:"
          replacement = "for forbidden in ['cityLayerRef','customPinRef','tzLayerRef','popDensityLayerRef','savedRadiusLayerRef','labelLayerRef','buildStateLabels(']:"
          if target not in text:
              raise SystemExit('U.S. diagnostics self-check target missing')
          path.write_text(text.replace(target, replacement, 1))
      - name: Apply U.S. diagnostics migration in workspace
        run: python occu-med-map/scripts/migrate-us-diagnostics-native.py
      - name: Print residual stateGeoRef context
        run: grep -n -C 4 'stateGeoRef' occu-med-map/src/App.tsx || true
      - run: pnpm install --frozen-lockfile
      - name: Typecheck transformed frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
