name: One-shot Mapbox native compatibility fix

on:
  push:
    paths:
      - .github/workflows/one-shot-mapbox-native-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply tool and geographic interaction fixes
        run: python occu-med-map/scripts/apply-mapbox-native-tool-fixes.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: Map synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Mapbox migration lifecycle
        run: pnpm --filter @workspace/occu-med-map test:leaflet-map-lifecycle-hardening
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated tool fixes
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/src/mapboxNativeCompat.ts occu-med-map/src/App.tsx occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs
          git commit -m "Fix Mapbox native tool and geographic interactions"
          git push origin HEAD:nuclear/mapbox-native-runtime
