name: Sync Czechia NRPZS healthcare providers

on:
  workflow_dispatch:
  schedule:
    - cron: "35 10 2 * *"

permissions:
  contents: read

concurrency:
  group: czechia-nrpzs-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download and promote official NRPZS registry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TARGET_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}
      NRPZS_CSV_URL: https://datanzis.uzis.gov.cz/data/NR-01-NRPZS/NR-01-06/Otevrena-data-NR-01-06-nrpzs-mista-poskytovani-zdravotnich-sluzeb.csv

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl postgresql-client

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "HEALTHSITES_DATABASE_URL is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          test "$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT to_regclass('public.provider_master_map_view') IS NOT NULL")" = "t"

      - name: Download official NRPZS CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nrpzs
          curl --fail --location --retry 4 --retry-all-errors "$NRPZS_CSV_URL" --output /tmp/nrpzs/nrpzs.csv
          test -s /tmp/nrpzs/nrpzs.csv
          size="$(stat -c%s /tmp/nrpzs/nrpzs.csv)"
          (( size >= 5000000 )) || { echo "NRPZS download is unexpectedly small: ${size} bytes" >&2; exit 1; }

      - name: Normalize geocoded healthcare locations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize-czechia-nrpzs.py --input /tmp/nrpzs/nrpzs.csv --output /tmp/nrpzs/provider.tsv
          test -s /tmp/nrpzs/provider.tsv
          expected=$(( $(wc -l < /tmp/nrpzs/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/nrpzs/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 10000 )) || { echo "Only ${expected} geocoded NRPZS locations; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 8000 )) || { echo "Only ${distinct_master} NRPZS canonical locations; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"

      - name: Stage normalized NRPZS rows
        shell: bash
        run: |
          set -euo pipefail
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS public.source5_import_staging (
              source_record_id text PRIMARY KEY,
              source_url text,
              name text NOT NULL,
              normalized_name text,
              address_line1 text,
              formatted_address text,
              city text,
              state_region text,
              postal_code text,
              country_code text NOT NULL,
              lat double precision NOT NULL,
              lng double precision NOT NULL,
              phone text,
              website text,
              email text,
              primary_provider_type text,
              capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
              quality_score numeric,
              master_key text NOT NULL
            );
            TRUNCATE public.source5_import_staging;
          "
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" \
            < /tmp/nrpzs/provider.tsv
          actual="$(psql "$TARGET_DATABASE_URL" -Atqc 'SELECT count(*) FROM public.source5_import_staging')"
          [[ "$actual" == "$REGISTRY_EXPECTED" ]] || { echo "Staging mismatch ${actual} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }

      - name: Promote NRPZS into canonical registry
        shell: bash
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v expected="$REGISTRY_EXPECTED" \
            -v expected_master="$REGISTRY_EXPECTED_MASTER" \
            -v source_key="cz_nrpzs" \
            -v country_code="CZ" \
            -v source_prefix_pattern="nrpzs:%" \
            -v source_display_name="Czechia NRPZS — National Register of Health Service Providers" \
            -v data_source_name="Czechia NRPZS" \
            -v source_notes="Official UZIS Czech Republic national healthcare service-location registry synchronized from the current monthly open CSV" \
            -f scripts/promote-staged-government-registry.sql

      - name: Verify production Czechia source
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='cz_nrpzs'")"
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_map_view WHERE source_key='cz_nrpzs' AND country_code='CZ' AND lat IS NOT NULL AND lng IS NOT NULL")"
          [[ "$source_count" == "$REGISTRY_EXPECTED" ]] || { echo "NRPZS lineage mismatch ${source_count} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }
          (( mapped_count >= 8000 )) || { echo "Only ${mapped_count} NRPZS providers map-renderable" >&2; exit 1; }
          echo "Czechia NRPZS source records: ${source_count}"
          echo "Czechia NRPZS map-renderable providers: ${mapped_count}"
