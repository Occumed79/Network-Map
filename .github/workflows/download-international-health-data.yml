name: Download international health data

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/bootstrap-who-workforce-data.mjs
      - scripts/discover-who-hhfa-sara-reports.mjs
      - .github/workflows/download-international-health-data.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  download-and-normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and normalize WHO GHO and NHWA workforce data
        run: |
          set +e
          node scripts/bootstrap-who-workforce-data.mjs > /tmp/who-workforce-download.log 2>&1
          status=$?
          mkdir -p data/generated/who-workforce
          cp /tmp/who-workforce-download.log data/generated/who-workforce/download.log
          echo "$status" > data/generated/who-workforce/download.exit-code
          cat /tmp/who-workforce-download.log
          exit 0

      - name: Import WHO workforce data into verified Map Neon database
        env:
          DATABASE_URL_CANDIDATE: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_CANDIDATE: ${{ secrets.NEON_DATABASE_URL }}
          POSTGRES_URL_CANDIDATE: ${{ secrets.POSTGRES_URL }}
          POSTGRES_DATABASE_URL_CANDIDATE: ${{ secrets.POSTGRES_DATABASE_URL }}
        run: |
          set -euo pipefail
          who_dir="data/generated/who-workforce"
          db_url=""
          secret_name=""

          for candidate_name in DATABASE_URL_CANDIDATE NEON_DATABASE_URL_CANDIDATE POSTGRES_URL_CANDIDATE POSTGRES_DATABASE_URL_CANDIDATE; do
            candidate_value="${!candidate_name:-}"
            if [ -n "$candidate_value" ]; then
              db_url="$candidate_value"
              secret_name="$candidate_name"
              break
            fi
          done

          if [ -z "$db_url" ]; then
            echo "NO_DATABASE_SECRET" > "$who_dir/import-status.txt"
            echo "No supported repository database secret was available." > "$who_dir/import-details.txt"
            exit 0
          fi

          identity="$(psql "$db_url" -v ON_ERROR_STOP=1 -Atc "SELECT current_database() || '|' || COALESCE(to_regclass('public.medical_providers')::text,'') || '|' || COALESCE(to_regclass('public.international_health_indicators')::text,'');")"
          echo "$identity" > "$who_dir/database-identity.txt"

          IFS='|' read -r database_name medical_table international_table <<< "$identity"
          if [ "$database_name" != "neondb" ] || [ "$medical_table" != "medical_providers" ] || [ "$international_table" != "international_health_indicators" ]; then
            echo "DATABASE_IDENTITY_REJECTED" > "$who_dir/import-status.txt"
            echo "The available secret did not point to the verified Network Map database." > "$who_dir/import-details.txt"
            exit 0
          fi

          if [ "$(cat "$who_dir/download.exit-code")" != "0" ]; then
            echo "DOWNLOAD_FAILED" > "$who_dir/import-status.txt"
            exit 0
          fi

          shopt -s nullglob
          who_files=("$who_dir"/who_workforce_*.sql)
          if [ "${#who_files[@]}" -eq 0 ]; then
            echo "NO_SQL_FILES" > "$who_dir/import-status.txt"
            exit 0
          fi

          for sql_file in "${who_files[@]}"; do
            psql "$db_url" -v ON_ERROR_STOP=1 -f "$sql_file"
          done

          psql "$db_url" -v ON_ERROR_STOP=1 -Atc "SELECT indicator_code || '|' || count(*) FROM public.international_health_indicators WHERE source_name='WHO Global Health Observatory / National Health Workforce Accounts' GROUP BY indicator_code ORDER BY indicator_code;" > "$who_dir/import-counts.txt"
          echo "IMPORTED" > "$who_dir/import-status.txt"
          echo "Imported using verified repository secret $secret_name." > "$who_dir/import-details.txt"

      - name: Publish import status to the data branch
        if: always()
        run: |
          set -euo pipefail
          status_dir="data/status"
          source_dir="data/generated/who-workforce"
          mkdir -p "$status_dir"
          cp "$source_dir/import-status.txt" "$status_dir/who-workforce-import-status.txt" 2>/dev/null || echo "STATUS_NOT_WRITTEN" > "$status_dir/who-workforce-import-status.txt"
          cp "$source_dir/import-details.txt" "$status_dir/who-workforce-import-details.txt" 2>/dev/null || true
          cp "$source_dir/import-counts.txt" "$status_dir/who-workforce-import-counts.txt" 2>/dev/null || true
          cp "$source_dir/manifest.json" "$status_dir/who-workforce-manifest.json" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$status_dir"
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: publish WHO workforce import status [skip ci]"
          git push origin HEAD:data/international-source-bootstrap

      - name: Upload WHO workforce diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-workforce-import
          path: data/generated/who-workforce
          if-no-files-found: error
          retention-days: 7

  discover-hhfa-sara:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Inventory WHO HHFA and SARA archive
        run: |
          set +e
          node scripts/discover-who-hhfa-sara-reports.mjs > /tmp/hhfa-sara.log 2>&1
          status=$?
          mkdir -p data/generated/who-hhfa-sara
          cp /tmp/hhfa-sara.log data/generated/who-hhfa-sara/run.log
          echo "$status" > data/generated/who-hhfa-sara/run.exit-code
          cat /tmp/hhfa-sara.log
          exit 0

      - name: Upload WHO HHFA and SARA discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-hhfa-sara-discovery
          path: data/generated/who-hhfa-sara
          if-no-files-found: error
          retention-days: 7
