name: Validate
on: [push, pull_request]
permissions: { contents: read }
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Typecheck API
        run: |
          set -o pipefail
          pnpm --filter @workspace/api-server typecheck 2>&1 | tee api-typecheck.log
      - name: Upload API typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: api-typecheck-diagnostics, path: api-typecheck.log, if-no-files-found: ignore, retention-days: 3 }
      - name: Provider search authority
        run: pnpm --filter @workspace/api-server test:provider-search-authority
      - name: Provider integrity
        run: pnpm --filter @workspace/api-server test:provider-integrity
      - name: Upload lifecycle
        run: pnpm --filter @workspace/api-server test:provider-upload-lifecycle
      - name: API security
        run: pnpm --filter @workspace/api-server test:api-security
      - name: Database lifecycle/schema drift
        run: pnpm --filter @workspace/api-server test:database-lifecycle
      - name: External-source resilience
        run: pnpm --filter @workspace/api-server test:external-source-resilience
      - name: Provider Explorer API
        run: pnpm --filter @workspace/api-server test:provider-explorer
      - name: Provider Explorer UI
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: Map synchronization
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Sidebar workspace
        run: pnpm --filter @workspace/occu-med-map test:sidebar-workspace-hardening
      - name: General UI
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Request pipeline
        run: pnpm --filter @workspace/occu-med-map test:network-request-hardening
      - name: Leaflet lifecycle
        run: pnpm --filter @workspace/occu-med-map test:leaflet-map-lifecycle-hardening
      - name: Mapbox lifecycle
        run: pnpm --filter @workspace/occu-med-map test:mapbox-lifecycle-hardening
      - name: Mapbox source pipeline
        run: pnpm --filter @workspace/occu-med-map test:mapbox-source-pipeline-hardening
      - name: Large-map rendering/memory
        run: pnpm --filter @workspace/occu-med-map test:large-map-performance
      - name: P1 data stabilization
        run: pnpm --filter @workspace/api-server test:p1-data
      - name: P2 map
        run: pnpm --filter @workspace/occu-med-map test:p2-map
      - name: P3 NPI
        run: pnpm --filter @workspace/api-server test:p3-npi
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Build API
        run: pnpm --filter @workspace/api-server build
