name: Patch Source 5 duplicate-master reconciliation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/patch-source5-worker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/source5-duplicate-master-reconciliation'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/source5-duplicate-master-reconciliation
          fetch-depth: 1

      - name: Apply targeted worker fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('api-server/src/lib/source5BatchImportWorker.ts')
          text = path.read_text()

          old = '''function isComplete(counts: CountryCounts, expected: number): boolean {
            return Number(counts.raw_records) === expected
              && Number(counts.stage_records) === expected
              && Number(counts.master_records) === expected
              && Number(counts.lineage_records) === expected
              && Number(counts.legacy_records) === expected
              && Number(counts.invalid_records) === 0
              && Number(counts.invalid_type_links) === 0;
          }'''
          new = '''function isComplete(
            counts: CountryCounts,
            expectedSourceRecords: number,
            expectedMasterRecords = expectedSourceRecords,
          ): boolean {
            return Number(counts.raw_records) === expectedSourceRecords
              && Number(counts.stage_records) === expectedSourceRecords
              && Number(counts.master_records) === expectedMasterRecords
              && Number(counts.lineage_records) === expectedSourceRecords
              && Number(counts.legacy_records) === expectedSourceRecords
              && Number(counts.invalid_records) === 0
              && Number(counts.invalid_type_links) === 0;
          }'''
          if old not in text:
              raise SystemExit('isComplete target block not found')
          text = text.replace(old, new, 1)

          old = '''async function replaceAndPromoteCountry(client: PoolClient, job: ImportJob): Promise<CountryCounts> {
            const code = job.country_code.toUpperCase();
            await client.query("BEGIN");'''
          new = '''async function replaceAndPromoteCountry(client: PoolClient, job: ImportJob): Promise<CountryCounts> {
            const code = job.country_code.toUpperCase();
            const expectedMasterResult = await client.query<{ count: string }>(
              "SELECT COUNT(DISTINCT master_key) AS count FROM public.source5_import_staging",
            );
            const expectedMasterRecords = Number(expectedMasterResult.rows[0]?.count ?? 0);
            if (!Number.isInteger(expectedMasterRecords) || expectedMasterRecords <= 0) {
              throw new Error(`Unable to determine expected master-provider count for ${code}`);
            }
            await client.query("BEGIN");'''
          if old not in text:
              raise SystemExit('replaceAndPromoteCountry target block not found')
          text = text.replace(old, new, 1)

          old = '''  const counts = await getCountryCounts(client, code);
            if (!isComplete(counts, job.expected_rows)) {
              throw new Error(`Production reconciliation failed for ${code}: ${JSON.stringify(counts)}`);
            }'''
          new = '''  const counts = await getCountryCounts(client, code);
            if (!isComplete(counts, job.expected_rows, expectedMasterRecords)) {
              throw new Error(
                `Production reconciliation failed for ${code}: ${JSON.stringify({ counts, expectedMasterRecords })}`,
              );
            }'''
          if old not in text:
              raise SystemExit('final reconciliation target block not found')
          text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          rm .github/workflows/patch-source5-worker.yml
          git diff --check

      - name: Commit worker fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api-server/src/lib/source5BatchImportWorker.ts .github/workflows/patch-source5-worker.yml
          git commit -m "Fix Source 5 reconciliation for duplicate master locations"
          git push origin HEAD:fix/source5-duplicate-master-reconciliation
