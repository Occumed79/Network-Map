name: Finalize UI ownership pass

on:
  push:
    branches:
      - hardening/ui-ownership-consolidation-v2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-ui-ownership-pass
  cancel-in-progress: true

jobs:
  finalize-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[ui-ownership-final-validated]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: hardening/ui-ownership-consolidation-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final ownership guard updates
        working-directory: occu-med-map
        run: node scripts/finalize-ui-ownership-pass.mjs

      - name: Run source ownership checks
        run: |
          node occu-med-map/scripts/ui-style-ownership-smoke.ts
          pnpm --filter @workspace/occu-med-map typecheck
          pnpm --filter @workspace/occu-med-map test:runtime-ownership
          pnpm --filter @workspace/occu-med-map test:sidebar-workspace-hardening
          pnpm --filter @workspace/occu-med-map test:general-ui-hardening

      - name: Run map and request regression checks
        run: |
          pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
          pnpm --filter @workspace/occu-med-map test:network-request-hardening
          pnpm --filter @workspace/occu-med-map test:leaflet-map-lifecycle-hardening
          pnpm --filter @workspace/occu-med-map test:mapbox-lifecycle-hardening
          pnpm --filter @workspace/occu-med-map test:mapbox-source-pipeline-hardening

      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build

      - name: Install Chromium
        run: pnpm --filter @workspace/occu-med-map exec playwright install --with-deps chromium

      - name: Run rendered browser acceptance
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter @workspace/occu-med-map exec vite --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/network-map-vite.log 2>&1 &
          VITE_PID=$!
          cleanup() { kill "$VITE_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..50}; do
            if curl --fail --silent --show-error --max-time 5 http://127.0.0.1:4173/ > /dev/null; then break; fi
            if ! kill -0 "$VITE_PID" 2>/dev/null; then cat /tmp/network-map-vite.log; exit 1; fi
            if [[ "$attempt" == "50" ]]; then cat /tmp/network-map-vite.log; exit 1; fi
            sleep 1
          done
          NETWORK_MAP_CI_UI_URL=http://127.0.0.1:4173 node occu-med-map/scripts/ci-ui-acceptance.mjs
          NETWORK_MAP_CI_UI_URL=http://127.0.0.1:4173 node occu-med-map/scripts/ci-ui-deep-workflow-acceptance.mjs

      - name: Commit validated finalization marker
        shell: bash
        run: |
          rm -f occu-med-map/scripts/finalize-ui-ownership-pass.mjs
          rm -f .github/workflows/finalize-ui-ownership-pass.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize UI ownership pass [ui-ownership-final-validated]"
          git push origin HEAD:hardening/ui-ownership-consolidation-v2
