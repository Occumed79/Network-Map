name: Sync European dedicated registries

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/actions/resolve-registry-database/action.yml"
      - ".github/workflows/sync-europe-dedicated-registries.yml"
      - "scripts/sync-andorra-cass.py"
      - "scripts/sync-armenia-uhif.mjs"
      - "scripts/sync-azerbaijan-tabib.mjs"
      - "scripts/sync-bosnia-domestic-healthcare.py"
      - "scripts/sync-denmark-sor.py"
      - "scripts/sync-france-finess.mjs"
      - "scripts/sync-france-finess.py"
      - "scripts/sync-kosovo-healthcare.py"
      - "scripts/sync-liechtenstein-lkv.mjs"
      - "scripts/sync-north-macedonia-health-centers.mjs"
      - "scripts/sync-northern-ireland-primary-care.mjs"
      - "scripts/sync-san-marino-authorized.mjs"
      - "scripts/sync-turkey-health-tourism.mjs"
      - "scripts/sync-uk-healthcare.mjs"
      - "scripts/sync-ukraine-nhsu.mjs"
      - "scripts/extract-iceland-operator-registry.mjs"
      - "scripts/geocode-iceland-operator-registry.py"
      - "scripts/sync-georgia-geostat.mjs"
      - "scripts/sync-greenland-peqqik.py"
      - "scripts/import-official-registry.sh"
      - "scripts/official-registry-schema.sql"
  schedule:
    - cron: "15 10 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: europe-dedicated-registry-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync ${{ matrix.country_name }} registry
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - { source: denmark-sor-healthcare, country: DK, country_name: Denmark, source_key: dk_sor_healthcare, cadence: daily, minimum: 1000 }
          - { source: france-finess, country: FR, country_name: France, source_key: fr_finess, cadence: daily, minimum: 10000 }
          - { source: england-cqc, country: GB, country_name: England, source_key: gb_cqc_healthcare, cadence: weekly, minimum: 5000 }
          - { source: northern-ireland-gp, country: GB, country_name: Northern-Ireland, source_key: gb_ni_gp, cadence: weekly, minimum: 200 }
          - { source: ukraine-nhsu, country: UA, country_name: Ukraine, source_key: ua_nhsu_pmg, cadence: weekly, minimum: 2000 }
          - { source: andorra-cass, country: AD, country_name: Andorra, source_key: ad_cass_healthcare, cadence: weekly, minimum: 15 }
          - { source: armenia-uhif, country: AM, country_name: Armenia, source_key: am_uhif_healthcare, cadence: weekly, minimum: 500 }
          - { source: bosnia-domestic, country: BA, country_name: Bosnia-and-Herzegovina, source_key: ba_domestic_healthcare, cadence: weekly, minimum: 55 }
          - { source: iceland-doh, country: IS, country_name: Iceland, source_key: is_doh_healthcare_operators, cadence: weekly, minimum: 200 }
          - { source: kosovo-moh-private, country: XK, country_name: Kosovo, source_key: xk_moh_private_licensed, cadence: monthly, minimum: 40 }
          - { source: azerbaijan-tabib, country: AZ, country_name: Azerbaijan, source_key: az_tabib_healthcare, cadence: monthly, minimum: 100 }
          - { source: liechtenstein-lkv, country: LI, country_name: Liechtenstein, source_key: li_lkv_okp, cadence: monthly, minimum: 25 }
          - { source: san-marino-authorized, country: SM, country_name: San-Marino, source_key: sm_authorized_healthcare, cadence: monthly, minimum: 12 }
          - { source: turkey-moh-health-tourism, country: TR, country_name: Türkiye, source_key: tr_moh_health_tourism, cadence: monthly, minimum: 100 }
          - { source: north-macedonia-moh, country: MK, country_name: North-Macedonia, source_key: mk_moh_health_centers, cadence: monthly, minimum: 20 }
          - { source: georgia-hmis, country: GE, country_name: Georgia, source_key: ge_geostat_healthcare, cadence: weekly, minimum: 200 }
          - { source: greenland-healthcare, country: GL, country_name: Greenland, source_key: gl_healthcare, cadence: weekly, minimum: 35 }
    steps:
      - name: Decide whether this source is due
        shell: bash
        run: |
          set -euo pipefail
          run=true
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            case "${{ matrix.cadence }}" in
              daily) ;;
              weekly) [[ "$(date -u +%u)" == "7" ]] || run=false ;;
              monthly) [[ "$(date -u +%d)" == "03" ]] || run=false ;;
            esac
          fi
          echo "RUN_SYNC=${run}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: env.RUN_SYNC == 'true'
        with:
          persist-credentials: false
      - name: Resolve dedicated registry database
        if: env.RUN_SYNC == 'true'
        uses: ./.github/actions/resolve-registry-database
        with:
          source: ${{ matrix.source }}
      - uses: actions/setup-node@v4
        if: env.RUN_SYNC == 'true'
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        if: env.RUN_SYNC == 'true'
        with:
          python-version: "3.12"

      - name: Install registry dependencies
        if: env.RUN_SYNC == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check beautifulsoup4 ijson openpyxl pandas pyproj requests xlrd
          npm install --no-save playwright@1.55.0
          if [[ "${{ matrix.source }}" == "armenia-uhif" || "${{ matrix.source }}" == "iceland-doh" || "${{ matrix.source }}" == "georgia-hmis" ]]; then
            npx playwright install --with-deps chromium >/dev/null
          fi
          sudo apt-get update
          sudo apt-get install --yes poppler-utils postgresql-client

      - name: Normalize official registry
        if: env.RUN_SYNC == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database connection is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          mkdir -p /tmp/europe-registry
          output=/tmp/europe-registry/provider.tsv
          case "${{ matrix.source }}" in
            denmark-sor-healthcare) python scripts/sync-denmark-sor.py --output "$output" ;;
            france-finess) python scripts/sync-france-finess.py --output "$output" ;;
            england-cqc) node --max-old-space-size=4096 scripts/sync-uk-healthcare.mjs --source england-cqc --output "$output" ;;
            northern-ireland-gp) node scripts/sync-northern-ireland-primary-care.mjs --output "$output" ;;
            ukraine-nhsu) node --max-old-space-size=4096 scripts/sync-ukraine-nhsu.mjs --output "$output" ;;
            andorra-cass) python scripts/sync-andorra-cass.py --output "$output" ;;
            armenia-uhif) node scripts/sync-armenia-uhif.mjs --output "$output" ;;
            bosnia-domestic) python scripts/sync-bosnia-domestic-healthcare.py --output "$output" ;;
            kosovo-moh-private) python scripts/sync-kosovo-healthcare.py --output "$output" ;;
            azerbaijan-tabib) node --max-old-space-size=4096 scripts/sync-azerbaijan-tabib.mjs --output "$output" ;;
            liechtenstein-lkv) node scripts/sync-liechtenstein-lkv.mjs --output "$output" ;;
            san-marino-authorized) node scripts/sync-san-marino-authorized.mjs --output "$output" ;;
            turkey-moh-health-tourism) node --max-old-space-size=4096 scripts/sync-turkey-health-tourism.mjs --output "$output" ;;
            north-macedonia-moh) node scripts/sync-north-macedonia-health-centers.mjs --output "$output" ;;
            georgia-hmis) node --max-old-space-size=4096 scripts/sync-georgia-geostat.mjs --output "$output" ;;
            greenland-healthcare) python scripts/sync-greenland-peqqik.py --output "$output" ;;
            iceland-doh)
              node scripts/extract-iceland-operator-registry.mjs --output /tmp/europe-registry/iceland.tsv --summary /tmp/europe-registry/iceland-summary.json
              python scripts/geocode-iceland-operator-registry.py --input /tmp/europe-registry/iceland.tsv --output "$output" --skipped /tmp/europe-registry/iceland-skipped.json --workers 10
              ;;
          esac
          test -s "$output"
          expected=$(( $(wc -l < "$output") - 1 ))
          (( expected >= ${{ matrix.minimum }} )) || { echo "Only ${expected} rows; minimum is ${{ matrix.minimum }}" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"

      - name: Import compact dedicated registry
        if: env.RUN_SYNC == 'true'
        shell: bash
        env:
          REGISTRY_TSV: /tmp/europe-registry/provider.tsv
          REGISTRY_EXPECTED: ${{ env.REGISTRY_EXPECTED }}
          REGISTRY_SOURCE_KEY: ${{ matrix.source_key }}
          REGISTRY_COUNTRY_CODE: ${{ matrix.country }}
        run: scripts/import-official-registry.sh
