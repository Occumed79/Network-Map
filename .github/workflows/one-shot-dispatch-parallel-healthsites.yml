name: One-shot dispatch optimized Healthsites import

on:
  push:
    paths:
      - '.github/workflows/one-shot-dispatch-parallel-healthsites.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch optimized all-country import from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run import-healthsites-archive-to-provider-projects.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f project_count=8 \
            -f confirmation=IMPORT_ALL_COUNTRIES
