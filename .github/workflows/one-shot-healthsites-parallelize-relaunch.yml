name: One-shot parallelize and relaunch Healthsites import

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-parallelize-relaunch.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel serial import run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/31861298076/cancel" || true
          for attempt in $(seq 1 30); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31861298076" --jq .status)"
            echo "Serial import status: ${status}"
            [[ "$status" == "completed" ]] && break
            sleep 2
          done

      - name: Parallelize independent provider project promotions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/import-healthsites-archive-to-provider-projects.yml')
          text = path.read_text()
          step_anchor = '      - name: Load and promote every provider project\n'
          anchor_pos = text.index(step_anchor)
          start_marker = '          for slot in $(seq 1 "$PROJECT_COUNT"); do\n'
          start = text.index(start_marker, anchor_pos)
          end_marker = '          imported="$(jq \'[.projects[].rows] | add\' "$manifest")"\n'
          end = text.index(end_marker, start)

          parallel = r'''          process_slot() {
            local slot="$1"
            local target_url variable file expected expected_master missing actual
            if [[ "$slot" == "1" ]]; then
              target_url="$HEALTHSITES_DATABASE_URL"
            else
              variable="HEALTHSITES_DATABASE_URL_${slot}"
              target_url="${!variable}"
            fi
            echo "::add-mask::${target_url}"
            file="/tmp/healthsites/provider-projects/healthsites_provider_project_${slot}.tsv"
            expected="$(jq -r ".projects[] | select(.slot == ${slot}) | .rows" "$manifest")"
            expected_master="$(jq -r ".projects[] | select(.slot == ${slot}) | .distinct_master_keys" "$manifest")"
            test -s "$file"

            missing="$(psql "$target_url" -Atqc "
              WITH required(name) AS (VALUES
                ('provider_raw_records'),
                ('provider_stage_records'),
                ('provider_master'),
                ('provider_master_sources'),
                ('provider_master_types'),
                ('provider_type_catalog'),
                ('medical_providers'),
                ('provider_master_map_view')
              )
              SELECT string_agg(name, ', ' ORDER BY name)
              FROM required
              WHERE to_regclass('public.' || name) IS NULL
            ")"
            [[ -z "$missing" ]] || { echo "Provider project ${slot} is not initialized. Missing: ${missing}" >&2; return 1; }

            psql "$target_url" -v ON_ERROR_STOP=1 -c "
              CREATE TABLE IF NOT EXISTS public.source5_import_staging (
                source_record_id text PRIMARY KEY,
                source_url text,
                name text NOT NULL,
                normalized_name text,
                address_line1 text,
                formatted_address text,
                city text,
                state_region text,
                postal_code text,
                country_code text NOT NULL,
                lat double precision NOT NULL,
                lng double precision NOT NULL,
                phone text,
                website text,
                email text,
                primary_provider_type text,
                capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
                quality_score numeric,
                master_key text NOT NULL
              );
              TRUNCATE public.source5_import_staging;
            "

            if ! psql "$target_url" -v ON_ERROR_STOP=1 -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" < "$file"; then
              psql "$target_url" -c 'TRUNCATE public.source5_import_staging' || true
              return 1
            fi

            if ! psql "$target_url" \
              -v ON_ERROR_STOP=1 \
              -v expected="$expected" \
              -v expected_master="$expected_master" \
              -f scripts/promote-healthsites-world.sql; then
              psql "$target_url" -c 'TRUNCATE public.source5_import_staging' || true
              return 1
            fi

            actual="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.medical_providers WHERE data_source='Healthsites / OpenStreetMap'")"
            [[ "$actual" == "$expected" ]] || { echo "Provider project ${slot} verification failed: ${actual} vs ${expected}" >&2; return 1; }
            echo "Provider project ${slot}: promoted ${actual} Healthsites facilities"
            printf '%s\n' "- Provider project ${slot}: ${actual} facilities" > "/tmp/healthsites/provider-project-${slot}.summary"
          }

          declare -a pids=()
          declare -a slots=()
          for slot in $(seq 1 "$PROJECT_COUNT"); do
            process_slot "$slot" > "/tmp/healthsites/provider-project-${slot}.log" 2>&1 &
            pids+=("$!")
            slots+=("$slot")
          done

          failed=0
          for i in "${!pids[@]}"; do
            slot="${slots[$i]}"
            if wait "${pids[$i]}"; then
              cat "/tmp/healthsites/provider-project-${slot}.log"
            else
              echo "Provider project ${slot} promotion failed" >&2
              cat "/tmp/healthsites/provider-project-${slot}.log" >&2
              failed=1
            fi
          done
          [[ "$failed" == "0" ]] || exit 1

          for slot in $(seq 1 "$PROJECT_COUNT"); do
            cat "/tmp/healthsites/provider-project-${slot}.summary" >> "$GITHUB_STEP_SUMMARY"
          done

'''
          text = text[:start] + parallel + text[end:]
          path.write_text(text)
          PY

          rm -f .github/workflows/one-shot-healthsites-parallelize-relaunch.yml
          git diff --check
          grep -n "process_slot\|declare -a pids\|Provider project .* promotion failed" .github/workflows/import-healthsites-archive-to-provider-projects.yml

      - name: Commit parallel promotion workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parallelize Healthsites provider project promotions"
          git push origin HEAD:main

      - name: Relaunch optimized all-country import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-healthsites-archive-to-provider-projects.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f project_count=8 \
            -f confirmation=IMPORT_ALL_COUNTRIES
