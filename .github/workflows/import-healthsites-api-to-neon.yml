name: Import all Healthsites facilities to Neon

on:
  # One-time automatic launch. Remove this push trigger after the world import succeeds.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-healthsites-api-to-neon.yml"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type IMPORT_ALL to replace the Healthsites source globally"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: healthsites-api-neon-import
  # A newer reviewed importer supersedes an older pre-promotion download safely.
  cancel-in-progress: true

jobs:
  import:
    name: Import all Healthsites facilities
    if: ${{ github.event_name == 'push' || inputs.confirmation == 'IMPORT_ALL' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      HEALTHSITES_API_KEY: ${{ secrets.HEALTHSITES_API_KEY }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAX_HEALTHSITES_PAGES: "5000"
      SQL_CHUNK_SIZE: "500"

    steps:
      - name: Check out the world importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$HEALTHSITES_API_KEY" ]]; then
            echo "HEALTHSITES_API_KEY is not configured" >&2
            exit 1
          fi
          if [[ -z "$DATABASE_URL" || "$DATABASE_URL" != postgres* ]]; then
            echo "DATABASE_URL is missing or is not a PostgreSQL URL" >&2
            exit 1
          fi

      - name: Verify Neon and prepare isolated staging
        shell: bash
        run: |
          set -euo pipefail
          database_name="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc 'select current_database()')"
          if [[ "$database_name" != "neondb" ]]; then
            echo "Refusing to import into unexpected database: $database_name" >&2
            exit 1
          fi
          missing="$(psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -Atc "
            with required(name) as (
              values
                ('provider_source_catalog'),
                ('provider_raw_records'),
                ('provider_stage_records'),
                ('provider_master'),
                ('provider_master_sources'),
                ('provider_master_types'),
                ('provider_type_catalog'),
                ('medical_providers')
            )
            select string_agg(name, ', ' order by name)
            from required
            where to_regclass('public.' || name) is null;
          ")"
          if [[ -n "$missing" ]]; then
            echo "Destination schema is missing required tables: $missing" >&2
            exit 1
          fi
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE TABLE IF NOT EXISTS public.source5_import_staging (
            source_record_id text PRIMARY KEY,
            source_url text,
            name text NOT NULL,
            normalized_name text,
            address_line1 text,
            formatted_address text,
            city text,
            state_region text,
            postal_code text,
            country_code text NOT NULL,
            lat double precision NOT NULL,
            lng double precision NOT NULL,
            phone text,
            website text,
            email text,
            primary_provider_type text,
            capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
            quality_score numeric,
            master_key text NOT NULL
          );
          TRUNCATE public.source5_import_staging;
          SQL

      - name: Download and normalize the complete Healthsites feed
        run: node scripts/bootstrap-healthsites-world.mjs

      - name: Validate the complete world manifest
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync('data/generated/global-health-facilities/manifest.json', 'utf8'));
          if (manifest.source !== 'Healthsites.io API v3' || manifest.scope !== 'world') {
            throw new Error('Manifest is not a full-world Healthsites API import');
          }
          if (!Number.isInteger(manifest.total_rows) || manifest.total_rows < 50000) {
            throw new Error(`World feed is unexpectedly small: ${manifest.total_rows}`);
          }
          if (!Number.isInteger(manifest.distinct_master_keys) || manifest.distinct_master_keys <= 0 || manifest.distinct_master_keys > manifest.total_rows) {
            throw new Error('Invalid distinct master-key count');
          }
          if (!Number.isInteger(manifest.api_pages_fetched) || manifest.api_pages_fetched < 2) {
            throw new Error('The API download did not traverse multiple pages');
          }
          const q = manifest.geographic_quadrants || {};
          for (const name of ['north_west', 'north_east', 'south_west', 'south_east']) {
            if (!Number.isInteger(q[name]) || q[name] <= 0) {
              throw new Error(`Global coverage check failed for ${name}`);
            }
          }
          const sqlRows = (manifest.sql_files || []).reduce((sum, entry) => sum + Number(entry.rows || 0), 0);
          if (sqlRows !== manifest.total_rows || !manifest.sql_files.length) {
            throw new Error(`Generated SQL row mismatch: ${sqlRows} vs ${manifest.total_rows}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `EXPECTED_ROWS=${manifest.total_rows}\nEXPECTED_MASTERS=${manifest.distinct_master_keys}\n`);
          console.log(`Validated ${manifest.total_rows.toLocaleString()} facilities across all four world quadrants`);
          NODE

      - name: Load the complete world dataset into staging
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(data/generated/global-health-facilities/healthsites_world_*.sql)
          if (( ${#files[@]} == 0 )); then
            echo "No staging SQL files were generated" >&2
            exit 1
          fi
          for file in "${files[@]}"; do
            echo "Staging $(basename "$file")"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 --file "$file" >/dev/null
          done
          read -r staged sources masters invalid <<< "$(
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' ' -c "
              select count(*), count(distinct source_record_id), count(distinct master_key),
                     count(*) filter (where source_record_id not like 'healthsites:%'
                       or name is null or btrim(name)=''
                       or lat not between -90 and 90 or lng not between -180 and 180)
              from public.source5_import_staging;
            "
          )"
          if [[ "$staged" != "$EXPECTED_ROWS" || "$sources" != "$EXPECTED_ROWS" || "$masters" != "$EXPECTED_MASTERS" || "$invalid" != "0" ]]; then
            echo "Staging reconciliation failed: staged=$staged sources=$sources masters=$masters invalid=$invalid" >&2
            exit 1
          fi

      - name: Transactionally replace the Healthsites source
        shell: bash
        run: |
          set -euo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -v expected="$EXPECTED_ROWS" \
            -v expected_master="$EXPECTED_MASTERS" \
            --file scripts/promote-healthsites-world.sql

      - name: Publish verified totals
        shell: bash
        run: |
          set -euo pipefail
          read -r raw_count stage_count lineage_count master_count legacy_count <<< "$(
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -At -F ' ' -c "
              select
                (select count(distinct source_record_id) from public.provider_raw_records where source_key='healthsites_osm'),
                (select count(*) from public.provider_stage_records where source_key='healthsites_osm'),
                (select count(*) from public.provider_master_sources where source_key='healthsites_osm'),
                (select count(distinct master_provider_id) from public.provider_master_sources where source_key='healthsites_osm'),
                (select count(*) from public.medical_providers where data_source='Healthsites / OpenStreetMap');
            "
          )"
          {
            echo "## Global Healthsites → Neon import complete"
            echo ""
            echo "- Scope: all countries / complete API feed"
            echo "- API facilities: $EXPECTED_ROWS"
            echo "- Raw / staged / lineage / Indexed Providers: $raw_count / $stage_count / $lineage_count / $legacy_count"
            echo "- Distinct master providers: $master_count"
            echo "- Existing Source 5 data replaced atomically: yes"
            echo "- Render service used for import: no"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clear staging after a failed pre-promotion run
        if: ${{ failure() }}
        shell: bash
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'TRUNCATE public.source5_import_staging' || true
