name: One-shot provider native render lifecycle fix

on:
  push:
    paths:
      - .github/workflows/one-shot-provider-native-render-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply provider render lifecycle fix
        run: python occu-med-map/scripts/apply-provider-native-render-lifecycle-fix.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: Map synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Mapbox migration lifecycle
        run: pnpm --filter @workspace/occu-med-map test:leaflet-map-lifecycle-hardening
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated provider render fix
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/src/App.tsx
          git commit -m "Fix provider rendering on native Mapbox viewport"
          git push origin HEAD:nuclear/mapbox-native-runtime
