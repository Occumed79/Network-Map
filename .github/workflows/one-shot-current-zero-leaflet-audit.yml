name: One-shot native runtime CI repair

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply targeted native-runtime and CI repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, minimum=1):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count < minimum:
                  raise SystemExit(f"{path}: expected at least {minimum} occurrence(s) of {old!r}, found {count}")
              p.write_text(text.replace(old, new))
              print(f"{path}: replaced {count} occurrence(s)")

          # Native Mapbox initializers run as soon as a map is registered. getStyle()
          # throws before the style has loaded, so readiness guards must use the
          # non-throwing isStyleLoaded() predicate.
          for path in [
              "occu-med-map/src/mapToolsNativeMapRuntime.ts",
              "occu-med-map/src/providerDatasetNativeMapRuntime.ts",
              "occu-med-map/src/providerExplorerNativeMapRuntime.ts",
              "occu-med-map/src/usDiagnosticsNativeMapRuntime.ts",
              "occu-med-map/src/liveFinderNativeMapRuntime.ts",
          ]:
              p = Path(path)
              text = p.read_text()
              text = text.replace("if (!map.getStyle()) return;", "if (!map.isStyleLoaded()) return;")
              text = text.replace("if (!map.getStyle()) continue;", "if (!map.isStyleLoaded()) continue;")
              p.write_text(text)
              if "if (!map.getStyle())" in text:
                  raise SystemExit(f"{path}: unsafe pre-style getStyle guard remains")

          # Runtime ownership smoke must describe the architecture that actually
          # exists after physical Leaflet lifecycle removal.
          replace(
              "occu-med-map/scripts/runtime-ownership-smoke.ts",
              '  "leafletMapLifecycleRuntime.ts": "leaflet-map-lifecycle",\n',
              "",
          )
          replace(
              "occu-med-map/scripts/runtime-ownership-smoke.ts",
              '  "./leafletMapLifecycleRuntime",\n',
              "",
          )

          # The package no longer exposes a Leaflet lifecycle smoke, so the
          # validation workflow must not invoke the deleted test.
          replace(
              ".github/workflows/validate.yml",
              '      - name: Leaflet lifecycle\n        run: pnpm --filter @workspace/occu-med-map test:leaflet-map-lifecycle-hardening\n',
              "",
          )

          # Browser gates were still waiting for a deleted global lifecycle and
          # accepting deleted Leaflet DOM surfaces. Keep them native-Mapbox only.
          replace(
              "occu-med-map/scripts/ci-ui-acceptance.mjs",
              '  "leaflet-map-lifecycle",\n',
              "",
          )
          replace(
              "occu-med-map/scripts/ci-ui-acceptance.mjs",
              ".leaflet-popup,.mapboxgl-popup",
              ".mapboxgl-popup",
          )

          cross = Path("occu-med-map/scripts/ci-cross-browser-acceptance.mjs")
          text = cross.read_text()
          text = text.replace(
              'Boolean(window.__NETWORK_MAP_LEAFLET_LIFECYCLE__)\n      && Boolean(window.__NETWORK_MAP_MAPBOX_LIFECYCLE__)\n      && Boolean(window.__NETWORK_MAP_REQUEST_PIPELINE__)',
              'Boolean(window.__NETWORK_MAP_MAPBOX_LIFECYCLE__)\n      && Boolean(window.__NETWORK_MAP_REQUEST_PIPELINE__)',
          )
          text = text.replace('      leaflet: Boolean(window.__NETWORK_MAP_LEAFLET_LIFECYCLE__),\n', '')
          text = text.replace('      leafletSurface: Boolean(document.querySelector(".leaflet-container")),\n', '')
          text = text.replace('.leaflet-popup,.mapboxgl-popup', '.mapboxgl-popup')
          text = text.replace(',.leaflet-container', '')
          cross.write_text(text)
          if "__NETWORK_MAP_LEAFLET_LIFECYCLE__" in text or ".leaflet-container" in text or ".leaflet-popup" in text:
              raise SystemExit("ci-cross-browser-acceptance.mjs: Leaflet browser assumptions remain")

          probe = Path("occu-med-map/scripts/ci-browser-stage-probe.mjs")
          text = probe.read_text()
          text = text.replace(
              'Boolean(window.__NETWORK_MAP_LEAFLET_LIFECYCLE__)\n  && Boolean(window.__NETWORK_MAP_MAPBOX_LIFECYCLE__)\n  && Boolean(window.__NETWORK_MAP_REQUEST_PIPELINE__)',
              'Boolean(window.__NETWORK_MAP_MAPBOX_LIFECYCLE__)\n  && Boolean(window.__NETWORK_MAP_REQUEST_PIPELINE__)',
          )
          text = text.replace(',.leaflet-container', '')
          probe.write_text(text)
          if "__NETWORK_MAP_LEAFLET_LIFECYCLE__" in text or ".leaflet-container" in text:
              raise SystemExit("ci-browser-stage-probe.mjs: Leaflet browser assumptions remain")

          post_idle = Path("occu-med-map/scripts/ci-post-idle-probe.mjs")
          text = post_idle.read_text().replace('.leaflet-popup,.mapboxgl-popup', '.mapboxgl-popup')
          post_idle.write_text(text)

          # This browser suite is testing the still-live transitional MapScene
          # native overlay renderer. Its old Leaflet-prefixed expectations can
          # never match the current native source/layer IDs.
          native_tools = Path("occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs")
          text = native_tools.read_text().replace('leaflet-compat-', 'map-scene-')
          native_tools.write_text(text)

          PY
      - run: pnpm install --frozen-lockfile
      - name: Frontend typecheck
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Runtime ownership
        run: pnpm --filter @workspace/occu-med-map test:runtime-ownership
      - name: Map synchronization
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: General UI hardening
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Diff safety
        run: git diff --check
      - name: Commit validated repairs
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No repair changes required."
            exit 0
          fi
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/src occu-med-map/scripts .github/workflows/validate.yml
          git commit -m "Repair native Mapbox startup and stale CI ownership gates"
          git push origin HEAD:nuclear/remove-leaflet-compat
