name: Probe Bosnia domestic healthcare extraction

on:
  push:
    branches:
      - international-europe-wave-1
    paths:
      - ".github/workflows/probe-bosnia-domestic-source.yml"
      - "scripts/sync-bosnia-domestic-healthcare.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests pandas xlrd openpyxl
      - name: Run source extraction without database promotion
        run: |
          mkdir -p /tmp/bosnia
          python scripts/sync-bosnia-domestic-healthcare.py --output /tmp/bosnia/provider.tsv
          echo "ROWS=$(( $(wc -l < /tmp/bosnia/provider.tsv) - 1 ))"
          head -n 6 /tmp/bosnia/provider.tsv
      - name: Upload normalized sample
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bosnia-domestic-probe
          path: /tmp/bosnia/*
          if-no-files-found: warn
