name: Sync Brazil CNES healthcare establishments

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-brazil-cnes.yml"
      - "scripts/normalize-cnes-jsonl.mjs"
      - "scripts/official-registry-schema.sql"
      - "scripts/import-official-registry.sh"
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: read

concurrency:
  group: official-provider-registry-sync
  # Keep all country imports pending; the default single slot cancels siblings.
  queue: max
  cancel-in-progress: false

jobs:
  sync:
    name: Download and promote official CNES registry
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_DATABASE_URL: ${{ secrets.BRAZIL_REGISTRY_DATABASE_URL }}
      CNES_JSON_ZIP_URL: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/CNES/cnes_estabelecimentos_json.zip

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install import tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq postgresql-client unzip

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database secret is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null

      - name: Download official CNES bulk JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cnes/raw /tmp/cnes/extracted
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 4 --retry-all-errors \
            "$CNES_JSON_ZIP_URL" \
            --output /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          test -s /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          unzip -tq /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          unzip -q /tmp/cnes/raw/cnes_estabelecimentos_json.zip -d /tmp/cnes/extracted
          find /tmp/cnes/extracted -type f -maxdepth 4 -printf '%p %s bytes\n' | head -30

      - name: Normalize geocoded CNES establishments
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED=/tmp/cnes/cnes-provider.tsv
          mapfile -d '' json_files < <(find /tmp/cnes/extracted -type f -iname '*.json' -print0)
          [[ "${#json_files[@]}" -gt 0 ]] || { echo "CNES archive did not contain JSON files" >&2; exit 1; }

          for file in "${json_files[@]}"; do
            # The current national export uses the legacy uppercase CNES schema
            # (CO_CNES, NO_FANTASIA, NU_LATITUDE, ...). Keep accepting the
            # lowercase API schema as well so either official representation is
            # normalized without silently producing an empty file.
            jq -c '.. | objects | select(.CO_CNES? != null or .codigo_cnes? != null or .cnes? != null)' "$file" \
              | node scripts/normalize-cnes-jsonl.mjs --output "$NORMALIZED"
          done

          test -s "$NORMALIZED"
          header="$(head -n 1 "$NORMALIZED")"
          { printf '%s\n' "$header"; tail -n +2 "$NORMALIZED" | sort -t $'\t' -k1,1 -u; } > /tmp/cnes/cnes-provider-dedup.tsv
          mv /tmp/cnes/cnes-provider-dedup.tsv "$NORMALIZED"

          expected=$(( $(wc -l < "$NORMALIZED") - 1 ))
          distinct_master="$(tail -n +2 "$NORMALIZED" | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 25000 )) || { echo "Only ${expected} geocoded CNES establishments; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 20000 )) || { echo "Only ${distinct_master} CNES canonical locations; refusing promotion" >&2; exit 1; }

          echo "CNES_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "CNES_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"
          echo "CNES geocoded records: ${expected}; canonical locations: ${distinct_master}"

      - name: Import compact dedicated registry
        shell: bash
        env:
          REGISTRY_TSV: /tmp/cnes/cnes-provider.tsv
          REGISTRY_EXPECTED: ${{ env.CNES_EXPECTED }}
          REGISTRY_SOURCE_KEY: br_cnes
          REGISTRY_COUNTRY_CODE: BR
        run: scripts/import-official-registry.sh

      - name: Verify dedicated Brazil CNES registry
        shell: bash
        run: |
          set -euo pipefail
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.official_registry_providers")"
          [[ "$mapped_count" == "$CNES_EXPECTED" ]] || { echo "Registry count mismatch ${mapped_count}" >&2; exit 1; }
          (( mapped_count >= 20000 )) || { echo "Only ${mapped_count} providers map-renderable" >&2; exit 1; }
          echo "Brazil CNES map-renderable providers: ${mapped_count}"
