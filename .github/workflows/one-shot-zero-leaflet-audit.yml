name: One-shot dead scene runtime purge

on:
  push:
    paths:
      - .github/workflows/one-shot-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Prove dead scene runtimes have zero live references
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('occu-med-map')
          targets = [
              root / 'src/mapboxAdvancedControls.ts',
              root / 'src/mapboxProviderRanking.ts',
              root / 'src/providerDensityField.ts',
          ]
          suffixes = {'.ts', '.tsx', '.js', '.jsx', '.mjs', '.cjs'}
          files = [p for p in root.rglob('*') if p.is_file() and p.suffix in suffixes]

          for target in targets:
              if not target.exists():
                  raise SystemExit(f'missing expected runtime: {target}')
              stem = target.stem
              refs = []
              for candidate in files:
                  if candidate == target:
                      continue
                  try:
                      text = candidate.read_text(errors='ignore')
                  except Exception:
                      continue
                  if stem in text:
                      refs.append(str(candidate))
              if refs:
                  raise SystemExit(f'{target} still referenced by: {refs}')

          for target in targets:
              target.unlink()
              print(f'deleted {target}')
          PY
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Native synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: Inventory remaining compatibility
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Commit validated purge
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Delete dead scene compatibility runtimes"
          git push origin HEAD:nuclear/remove-leaflet-compat
