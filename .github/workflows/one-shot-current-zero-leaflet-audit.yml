name: One-shot diagnose U.S. diagnostics seam

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Temporarily bypass only the stateGeoRef self-check
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/scripts/migrate-us-diagnostics-native.py')
          text = path.read_text()
          old = "for forbidden in ['stateGeoRef','cityLayerRef','customPinRef','tzLayerRef','popDensityLayerRef','savedRadiusLayerRef','labelLayerRef','buildStateLabels(']:"
          new = "for forbidden in ['cityLayerRef','customPinRef','tzLayerRef','popDensityLayerRef','savedRadiusLayerRef','labelLayerRef','buildStateLabels(']:"
          if old not in text:
              raise SystemExit('stateGeoRef self-check anchor missing')
          path.write_text(text.replace(old, new, 1))
      - name: Apply migration in disposable workspace
        run: python occu-med-map/scripts/migrate-us-diagnostics-native.py
      - name: Print residual stateGeoRef
        run: grep -n -C 8 'stateGeoRef' occu-med-map/src/App.tsx || true
      - run: pnpm install --frozen-lockfile
      - name: Typecheck transformed frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Audit transformed residue
        if: always()
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts || true
