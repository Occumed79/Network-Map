name: One-shot zero Leaflet architecture migration

on:
  push:
    paths:
      - .github/workflows/one-shot-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Remove Leaflet module alias and rename scene runtime
        run: python occu-med-map/scripts/migrate-leaflet-names-to-map-scene.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Inventory remaining architecture
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Commit validated first migration slice
        run: |
          rm -f occu-med-map/scripts/migrate-leaflet-names-to-map-scene.py
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Remove Leaflet module alias and rename Mapbox scene runtime"
          git push origin HEAD:nuclear/remove-leaflet-compat
