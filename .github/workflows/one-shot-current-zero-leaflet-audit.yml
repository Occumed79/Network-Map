name: One-shot inspect final MapScene call sites

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - name: App mapRef and multi-drop usages
        run: |
          echo '=== mapRef.current ==='
          grep -n -C 5 'mapRef\.current' occu-med-map/src/App.tsx || true
          echo '=== multiDropLayerRef ==='
          grep -n -C 8 'multiDropLayerRef' occu-med-map/src/App.tsx || true
          echo '=== direct MapScene in App ==='
          grep -n -C 5 'MapScene\.' occu-med-map/src/App.tsx || true
      - name: Helper call sites
        run: |
          echo '=== mapLayerHelpers imports/callers ==='
          grep -RIn -E 'mapLayerHelpers|setMapBasemap|clearLayerGroup|safeRemoveLayer|fitMarkers' occu-med-map/src --exclude='mapLayerHelpers.ts' || true
          echo '=== mapServices imports/callers ==='
          grep -RIn -E 'mapServices|createTileLayer|TILE_PROVIDERS|TileProviderKey' occu-med-map/src --exclude='mapServices.ts' || true
      - name: Helper contents
        run: |
          echo '=== mapLayerHelpers.ts ==='
          cat occu-med-map/src/features/networkMap/mapLayerHelpers.ts
          echo '=== mapServices.ts ==='
          cat occu-med-map/src/lib/mapServices.ts
