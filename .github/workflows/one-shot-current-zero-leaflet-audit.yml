name: One-shot land native U.S. diagnostics cleanup

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Disable obsolete migration self-check in disposable workspace
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/scripts/migrate-us-diagnostics-native.py')
          text = path.read_text()
          start = text.index("# No migrated refs/symbols should survive this slice.")
          end = text.index("app.write_text(text)", start)
          text = text[:start] + "# Final CI migration; exact residuals are repaired below before validation.\n\n" + text[end:]
          path.write_text(text)
      - name: Apply native U.S. diagnostics migration
        run: python occu-med-map/scripts/migrate-us-diagnostics-native.py
      - name: Repair diagnosed stale refs and hardening contract
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/src/App.tsx')
          text = path.read_text()
          text = text.replace('      cityLayerRef.current=null;\n', '', 1)
          old = "const usLayerStatus = showUsDiagnostics ? (stateGeoRef.current ? 'Available' : 'Loading U.S. map data…') : 'Enable U.S. Diagnostics first';"
          new = "const usLayerStatus = showUsDiagnostics ? (rawStateFeaturesRef.current.length ? 'Available' : 'Loading U.S. map data…') : 'Enable U.S. Diagnostics first';"
          if old not in text:
              raise SystemExit('U.S. status stale-ref anchor missing')
          text = text.replace(old, new, 1)
          text = text.replace('},[showPopDensity,stateGeoRevision]);', '},[showPopDensity, stateGeoRevision]);', 1)
          path.write_text(text)
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Native synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: General UI hardening
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Zero-compat audit
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Verify migrated U.S. refs are gone
        run: |
          ! grep -n -E 'stateGeoRef|cityLayerRef|customPinRef|tzLayerRef|popDensityLayerRef|savedRadiusLayerRef|labelLayerRef|buildStateLabels' occu-med-map/src/App.tsx
      - name: Commit validated cleanup
        run: |
          rm -f occu-med-map/scripts/migrate-us-diagnostics-native.py
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Finish native U.S. diagnostics cleanup"
          git push origin HEAD:nuclear/remove-leaflet-compat
