name: Probe remaining Europe registry interfaces

on:
  push:
    branches:
      - international-europe-wave-1
    paths:
      - ".github/workflows/probe-remaining-europe-registries.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/registry-probe
          cd /tmp/registry-probe
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Inspect Iceland controls and Armenia facility action
        working-directory: /tmp/registry-probe
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});

            async function probeIceland() {
              const page = await browser.newPage({locale:'is-IS', acceptDownloads:true});
              await page.goto('https://vefkerfi.landlaeknir.is/apex/f?p=2600:7', {waitUntil:'domcontentloaded', timeout:90000});
              await page.waitForTimeout(1500);
              console.log('ICELAND controls=', JSON.stringify(await page.locator('input,select,button').evaluateAll(els => els.map(e => ({
                tag:e.tagName,id:e.id,name:e.name,type:e.type,value:e.value,title:e.title,
                placeholder:e.placeholder,aria:e.getAttribute('aria-label'),text:(e.innerText||'').trim(),
                options:e.tagName==='SELECT'?[...e.options].map(o=>({text:o.text,value:o.value})).slice(0,40):undefined
              })).filter(x => (x.id||'').startsWith('P7_') || x.id==='leita' || /rekstr|vinnu|starf|post|póst|sveitar|land|leit/i.test((x.id||'')+' '+(x.name||'')+' '+(x.title||'')+' '+(x.placeholder||'')+' '+(x.text||''))), null, 2));
              console.log('ICELAND labels=', JSON.stringify(await page.locator('label').evaluateAll(els => els.map(e=>({for:e.htmlFor,text:e.innerText.trim()})).filter(x=>x.text)),null,2));
              console.log('ICELAND P7 items=', await page.locator('[id^="P7_"]').evaluateAll(els => els.map(e=>({tag:e.tagName,id:e.id,text:(e.innerText||'').trim(),value:e.value||'',class:e.className})).slice(0,100)));
              fs.writeFileSync('/tmp/registry-probe/iceland.html', await page.content());
              await page.close();
            }

            async function probeArmenia() {
              const page = await browser.newPage({locale:'en-US'});
              const posts=[];
              page.on('response', async r => {
                const req=r.request();
                if (r.url()==='https://www.uhif.am/en/hospitals' && req.method()==='POST') {
                  let body='';
                  try { body=(await r.body()).toString('utf8').slice(0,30000); } catch(e) { body='BODY_ERROR '+String(e); }
                  posts.push({status:r.status(), requestHeaders:req.headers(), responseHeaders:r.headers(), postData:req.postData(), body});
                }
              });
              await page.goto('https://www.uhif.am/en/hospitals', {waitUntil:'networkidle', timeout:90000});
              await page.waitForTimeout(2500);
              console.log('ARMENIA result=', await page.locator('h2').allTextContents());
              console.log('ARMENIA POST ACTIONS=', JSON.stringify(posts,null,2));
              console.log('ARMENIA buttons=', await page.locator('button').allTextContents());
              console.log('ARMENIA links sample=', await page.locator('a').evaluateAll(as=>as.map(a=>({text:a.innerText.trim(),href:a.href})).filter(x=>x.text).slice(0,100)));
              console.log('ARMENIA phone-like=', await page.locator('body').evaluate(() => [...document.querySelectorAll('body *')].filter(e=>/^\s*(?:\+374|0\d{2})/.test(e.textContent||'') && e.children.length===0).slice(0,30).map(e=>({tag:e.tagName,text:e.textContent.trim(),parent:(e.parentElement?.innerText||'').trim().slice(0,800)}))));
              console.log('ARMENIA address-like=', await page.locator('body').evaluate(() => [...document.querySelectorAll('body *')].filter(e=>/Yerevan|Երևան|Gyumri|Գյումրի|Vanadzor|Վանաձոր/i.test(e.textContent||'') && e.children.length===0).slice(0,30).map(e=>({tag:e.tagName,text:e.textContent.trim(),parent:(e.parentElement?.innerText||'').trim().slice(0,1000)}))));
              let clicks=0;
              while (clicks<80) {
                const load=page.getByRole('button',{name:/load more/i});
                if (!(await load.count()) || !(await load.first().isVisible().catch(()=>false))) break;
                await load.first().click();
                await page.waitForTimeout(300);
                clicks++;
              }
              console.log('ARMENIA loadMoreClicks=', clicks);
              console.log('ARMENIA final text size=', (await page.locator('body').innerText()).length);
              console.log('ARMENIA repeated card candidates=', await page.locator('article,[class*="card" i],[class*="hospital" i]').evaluateAll(els=>els.slice(0,20).map(e=>(e.innerText||'').trim().slice(0,1200))));
              fs.writeFileSync('/tmp/registry-probe/armenia.html', await page.content());
              await page.close();
            }

            await probeIceland().catch(e=>{console.error('ICELAND ERROR',e); process.exitCode=1;});
            await probeArmenia().catch(e=>{console.error('ARMENIA ERROR',e); process.exitCode=1;});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload probe HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-europe-registry-probe
          path: /tmp/registry-probe/*.html
          if-no-files-found: warn
