name: Sync Czechia NRPZS healthcare providers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/actions/resolve-registry-database/action.yml"
      - ".github/workflows/sync-czechia-nrpzs.yml"
      - "scripts/normalize-czechia-nrpzs.py"
      - "scripts/official-registry-schema.sql"
      - "scripts/import-official-registry.sh"
  schedule:
    - cron: "35 10 2 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: czechia-nrpzs-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download and promote official NRPZS registry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NRPZS_CSV_URL: https://datanzis.uzis.gov.cz/data/NR-01-NRPZS/NR-01-06/Otevrena-data-NR-01-06-nrpzs-mista-poskytovani-zdravotnich-sluzeb.csv

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve dedicated registry database
        uses: ./.github/actions/resolve-registry-database
        with:
          source: czechia-nrpzs

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install database client
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl postgresql-client

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database connection is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null

      - name: Download official NRPZS CSV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/nrpzs
          curl --fail --location --connect-timeout 20 --max-time 180 --retry 4 --retry-all-errors "$NRPZS_CSV_URL" --output /tmp/nrpzs/nrpzs.csv
          test -s /tmp/nrpzs/nrpzs.csv
          size="$(stat -c%s /tmp/nrpzs/nrpzs.csv)"
          (( size >= 5000000 )) || { echo "NRPZS download is unexpectedly small: ${size} bytes" >&2; exit 1; }

      - name: Normalize geocoded healthcare locations
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize-czechia-nrpzs.py --input /tmp/nrpzs/nrpzs.csv --output /tmp/nrpzs/provider.tsv
          test -s /tmp/nrpzs/provider.tsv
          expected=$(( $(wc -l < /tmp/nrpzs/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/nrpzs/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 10000 )) || { echo "Only ${expected} geocoded NRPZS locations; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 8000 )) || { echo "Only ${distinct_master} NRPZS canonical locations; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"

      - name: Import compact dedicated registry
        shell: bash
        env:
          REGISTRY_TSV: /tmp/nrpzs/provider.tsv
          REGISTRY_EXPECTED: ${{ env.REGISTRY_EXPECTED }}
          REGISTRY_SOURCE_KEY: cz_nrpzs
          REGISTRY_COUNTRY_CODE: CZ
        run: scripts/import-official-registry.sh

      - name: Verify dedicated Czechia NRPZS registry
        shell: bash
        run: |
          set -euo pipefail
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.official_registry_providers")"
          [[ "$mapped_count" == "$REGISTRY_EXPECTED" ]] || { echo "Registry count mismatch ${mapped_count}" >&2; exit 1; }
          (( mapped_count >= 8000 )) || { echo "Only ${mapped_count} providers map-renderable" >&2; exit 1; }
          echo "Czechia NRPZS map-renderable providers: ${mapped_count}"
