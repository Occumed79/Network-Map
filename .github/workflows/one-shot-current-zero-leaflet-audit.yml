name: One-shot expose full U.S. diagnostics residue

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Disable migration self-check in disposable workspace
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/scripts/migrate-us-diagnostics-native.py')
          text = path.read_text()
          start = text.index("# No migrated refs/symbols should survive this slice.")
          end = text.index("app.write_text(text)", start)
          text = text[:start] + "# Disposable CI diagnosis: permanent self-check remains unchanged on branch.\n\n" + text[end:]
          path.write_text(text)
      - name: Apply migration in disposable workspace
        run: python occu-med-map/scripts/migrate-us-diagnostics-native.py
      - run: pnpm install --frozen-lockfile
      - name: Print all migrated-symbol residue
        run: grep -n -C 3 -E 'stateGeoRef|cityLayerRef|customPinRef|tzLayerRef|popDensityLayerRef|savedRadiusLayerRef|labelLayerRef|buildStateLabels' occu-med-map/src/App.tsx || true
      - name: Typecheck transformed frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build transformed frontend
        if: success()
        run: pnpm --filter @workspace/occu-med-map build
      - name: Audit transformed residue
        if: always()
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts || true
