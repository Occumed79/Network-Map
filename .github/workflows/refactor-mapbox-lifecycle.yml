name: One-time Mapbox lifecycle refactor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refactor-mapbox-lifecycle.yml
      - .github/scripts/refactor-mapbox-lifecycle.mjs
      - occu-med-map/src/mapboxMapLifecycleRuntime.ts
      - occu-med-map/scripts/mapbox-lifecycle-hardening-smoke.ts

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'hardening/unify-mapbox-lifecycle' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply lifecycle refactor
        run: node .github/scripts/refactor-mapbox-lifecycle.mjs

      - name: Commit source refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add occu-med-map/src occu-med-map/package.json
          git diff --cached --stat
          git commit -m "Unify Mapbox map lifecycle ownership"
          git push origin HEAD:${{ github.head_ref }}
