name: One-time Leaflet lifecycle refactor

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/refactor-leaflet-lifecycle.yml
      - .github/scripts/refactor-leaflet-lifecycle.mjs
      - .github/scripts/fix-refactor-generator.mjs

permissions:
  contents: write

jobs:
  refactor:
    if: github.head_ref == 'hardening/unify-leaflet-lifecycle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Correct generator syntax
        run: node .github/scripts/fix-refactor-generator.mjs

      - name: Apply lifecycle refactor
        run: node .github/scripts/refactor-leaflet-lifecycle.mjs

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add occu-med-map/src occu-med-map/scripts occu-med-map/package.json .github/workflows/validate.yml
          git diff --cached --stat
          git commit -m "Unify Leaflet map lifecycle ownership"
          git push origin HEAD:${{ github.head_ref }}
