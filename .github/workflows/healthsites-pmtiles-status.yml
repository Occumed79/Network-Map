name: Report Healthsites PMTiles status

on:
  workflow_run:
    workflows:
      - Build Healthsites PMTiles
    types:
      - requested
      - in_progress
      - completed

permissions:
  contents: read
  issues: write

jobs:
  report:
    name: Publish Healthsites build status
    runs-on: ubuntu-latest
    steps:
      - name: Create or update the run status issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const action = context.payload.action;
            const title = `Healthsites PMTiles build ${run.id}`;
            const marker = `<!-- healthsites-pmtiles-run:${run.id} -->`;
            const conclusion = run.conclusion || "pending";
            const body = [
              marker,
              `**Workflow:** ${run.name}`,
              `**Status:** ${run.status}`,
              `**Conclusion:** ${conclusion}`,
              `**Run:** ${run.html_url}`,
              `**Head SHA:** \`${run.head_sha}\``,
              `**Updated:** ${new Date().toISOString()}`,
            ].join("\n\n");

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100,
            });
            let issue = issues.find((item) => !item.pull_request && item.title === title);

            if (!issue) {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
              });
              issue = created.data;
            } else {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body,
                state: action === "completed" && conclusion === "success" ? "closed" : "open",
                ...(action === "completed" && conclusion === "success" ? { state_reason: "completed" } : {}),
              });
            }

            if (action === "completed") {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: conclusion === "success"
                  ? "PMTiles conversion completed successfully. The workflow verified the R2 outputs."
                  : `PMTiles conversion finished with conclusion: **${conclusion}**.`,
              });
            }
