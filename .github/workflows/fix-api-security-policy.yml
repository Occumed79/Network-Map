name: Fix API security read/admin policies
on:
  push:
    branches: [hardening/api-security-policy]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message || '', '[security-policy-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/api-security-policy
          fetch-depth: 0
      - name: Fix explicit read and admin route policies
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('api-server/src/middleware/apiSecurity.ts')
          s=p.read_text()
          anchor='export const ROUTE_POLICIES: RoutePolicy[] = [\n'
          insert='''export const ROUTE_POLICIES: RoutePolicy[] = [
            { prefix: "/api/provider-sources/search", methods: ["POST"], capability: "read", maxBytes: 512 * 1024, rateLimit: { windowSeconds: 600, max: 80 } },
            { prefix: "/api/provider-sources/npi-custom", methods: ["POST"], capability: "read", maxBytes: 512 * 1024, rateLimit: { windowSeconds: 600, max: 60 } },
            { prefix: "/api/live-finder", methods: ["POST"], capability: "read", maxBytes: 512 * 1024, rateLimit: { windowSeconds: 600, max: 120 } },
            { prefix: "/api/enhanced-search", methods: ["POST"], capability: "read", maxBytes: 512 * 1024, rateLimit: { windowSeconds: 600, max: 80 } },
            { prefix: "/api/diagnostics/export", methods: ["GET"], capability: "admin", rateLimit: { windowSeconds: 600, max: 60 } },
            { prefix: "/api/admin", methods: ["GET", "POST", "PUT", "PATCH", "DELETE"], capability: "admin", rateLimit: { windowSeconds: 600, max: 60 }, idempotent: false },
            { prefix: "/api/provider-uploads", methods: ["GET"], capability: "admin", rateLimit: { windowSeconds: 600, max: 60 } },
          '''
          if 'capability: "read", maxBytes: 512 * 1024' not in s:
              s=s.replace(anchor, insert, 1)
          old='''    const policy = policyFor(req);
              const readLimit = SAFE_METHODS.has(req.method.toUpperCase()) ? readLimitFor(req) : null;
              if (readLimit && !(await distributedRateLimit(req, res, readLimit, `read:${readLimit.prefix}`))) return;

              if (SAFE_METHODS.has(req.method.toUpperCase())) {
                next();
                return;
              }

              if (!policy) {
                if (process.env.NODE_ENV === "production") {
                  res.status(403).json({ error: "This write route has no explicit authorization policy.", code: "route_policy_missing" });
                  return;
                }
                next();
                return;
              }

              const maxBytes = policy.maxBytes || DEFAULT_WRITE_MAX_BYTES;
              const contentLength = Number(req.get("content-length") || 0);
              if (contentLength > maxBytes) {
                res.status(413).json({ error: "Request body is too large for this endpoint.", code: "request_too_large", maxBytes });
                return;
              }

              const expected = tokenFor(policy.capability);'''.replace('              ','')
          new='''    const policy = policyFor(req);
              const safeMethod = SAFE_METHODS.has(req.method.toUpperCase());
              const readLimit = safeMethod && !policy ? readLimitFor(req) : null;
              if (readLimit && !(await distributedRateLimit(req, res, readLimit, `read:${readLimit.prefix}`))) return;

              if (!policy) {
                if (safeMethod) {
                  next();
                  return;
                }
                if (process.env.NODE_ENV === "production") {
                  res.status(403).json({ error: "This write route has no explicit authorization policy.", code: "route_policy_missing" });
                  return;
                }
                next();
                return;
              }

              const maxBytes = policy.maxBytes || DEFAULT_WRITE_MAX_BYTES;
              const contentLength = Number(req.get("content-length") || 0);
              if (contentLength > maxBytes) {
                res.status(413).json({ error: "Request body is too large for this endpoint.", code: "request_too_large", maxBytes });
                return;
              }

              if (policy.rateLimit && !(await distributedRateLimit(req, res, policy.rateLimit, `${policy.capability}:${policy.prefix}`))) return;
              if (policy.capability === "read") {
                next();
                return;
              }

              const expected = tokenFor(policy.capability);'''.replace('              ','')
          if old not in s:
              raise SystemExit('middleware policy block not found')
          s=s.replace(old,new,1)
          s=s.replace('''    if (policy.rateLimit && !(await distributedRateLimit(req, res, policy.rateLimit, `write:${policy.capability}:${policy.prefix}`))) return;
          if (policy.idempotent) {''','''    if (policy.idempotent) {''',1)
          p.write_text(s)

          smoke=Path('api-server/scripts/api-security-smoke.ts')
          t=smoke.read_text()
          needle='assert.match(security, /route_policy_missing/, "unclassified production write routes must fail closed");\n'
          extra='''assert.match(security, /provider-sources\\/search/, "read-like POST provider search must have an explicit read policy");
          assert.match(security, /policy.capability === "read"/, "read policies must bypass write-token authentication after rate/size enforcement");
          assert.match(security, /prefix: "\\/api\\/admin"/, "administrative GET/write routes must have an explicit admin policy");
          '''
          if 'read-like POST provider search' not in t:
              t=t.replace(needle, needle+extra.replace('          ',''),1)
          smoke.write_text(t)
          PY
      - name: Validate security source
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/api-server typecheck
          pnpm --filter @workspace/api-server test:api-security
      - name: Commit correction
        run: |
          rm -f .github/workflows/fix-api-security-policy.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix explicit read and admin API policies [security-policy-fixed]"
          git push origin HEAD:hardening/api-security-policy
