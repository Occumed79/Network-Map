name: Sync live country registries into dedicated databases

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/actions/resolve-registry-database/action.yml"
      - ".github/workflows/sync-live-country-registries.yml"
      - "scripts/sync-live-registry-to-tsv.mjs"
      - "scripts/sync-colombia-reps.py"
      - "scripts/import-official-registry.sh"
      - "scripts/official-registry-schema.sql"
      - "api-server/src/routes/**"
  schedule:
    - cron: "45 12 * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: live-country-registry-sync
  cancel-in-progress: true

jobs:
  sync:
    name: Sync ${{ matrix.country_name }} registry
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { source: germany-klinik-atlas, country: DE, country_name: Germany, source_key: de_klinikatlas }
          - { source: canada-odhf, country: CA, country_name: Canada, source_key: ca_odhf }
          - { source: australia-healthdirect, country: AU, country_name: Australia, source_key: au_healthdirect }
          - { source: croatia-hzzo-primary-care, country: HR, country_name: Croatia, source_key: hr_hzzo_pzz_ckan }
          - { source: chile-minsal, country: CL, country_name: Chile, source_key: cl_minsal_establishments }
          - { source: colombia-reps, country: CO, country_name: Colombia, source_key: co_reps_sispro }
          - { source: ireland-hse-health-centres, country: IE, country_name: Ireland, source_key: ie_hse_health_centres }
          - { source: latvia-medical-facilities, country: LV, country_name: Latvia, source_key: lv_medical_facilities }
          - { source: lithuania-vaspvt, country: LT, country_name: Lithuania, source_key: lt_vaspvt_licensed_facilities }
          - { source: singapore-chas, country: SG, country_name: Singapore, source_key: sg_moh_chas }
          - { source: mexico-clues, country: MX, country_name: Mexico, source_key: mx_clues_2024 }
          - { source: taiwan-nlsc-medical, country: TW, country_name: Taiwan, source_key: tw_nlsc_medical }
          - { source: new-zealand-health-facilities, country: NZ, country_name: New-Zealand, source_key: nz_health_facilities }
          - { source: wales-gp-main-sites, country: GB, country_name: Wales, source_key: gb_wales_gp_sites }
          - { source: scotland-nhs-hospitals, country: GB, country_name: Scotland, source_key: gb_scotland_nhs_hospitals }
          - { source: montenegro-health-facilities, country: ME, country_name: Montenegro, source_key: me_ministry_health_facilities }
          - { source: cyprus-state-hospitals, country: CY, country_name: Cyprus, source_key: cy_moh_state_hospitals }
          - { source: moldova-health-institutions, country: MD, country_name: Moldova, source_key: md_ministry_health_map }
          - { source: gisco-hospitals-albania, country: AL, country_name: Albania, source_key: eu_gisco_hospitals_al }
          - { source: gisco-hospitals-austria, country: AT, country_name: Austria, source_key: eu_gisco_hospitals_at }
          - { source: gisco-hospitals-belgium, country: BE, country_name: Belgium, source_key: eu_gisco_hospitals_be }
          - { source: gisco-hospitals-bulgaria, country: BG, country_name: Bulgaria, source_key: eu_gisco_hospitals_bg }
          - { source: gisco-hospitals-estonia, country: EE, country_name: Estonia, source_key: eu_gisco_hospitals_ee }
          - { source: gisco-hospitals-greece, country: GR, country_name: Greece, source_key: eu_gisco_hospitals_gr }
          - { source: gisco-hospitals-hungary, country: HU, country_name: Hungary, source_key: eu_gisco_hospitals_hu }
          - { source: gisco-hospitals-italy, country: IT, country_name: Italy, source_key: eu_gisco_hospitals_it }
          - { source: gisco-hospitals-luxembourg, country: LU, country_name: Luxembourg, source_key: eu_gisco_hospitals_lu }
          - { source: gisco-hospitals-malta, country: MT, country_name: Malta, source_key: eu_gisco_hospitals_mt }
          - { source: gisco-hospitals-netherlands, country: NL, country_name: Netherlands, source_key: eu_gisco_hospitals_nl }
          - { source: gisco-hospitals-norway, country: NO, country_name: Norway, source_key: eu_gisco_hospitals_no }
          - { source: gisco-hospitals-poland, country: PL, country_name: Poland, source_key: eu_gisco_hospitals_pl }
          - { source: gisco-hospitals-portugal, country: PT, country_name: Portugal, source_key: eu_gisco_hospitals_pt }
          - { source: gisco-hospitals-romania, country: RO, country_name: Romania, source_key: eu_gisco_hospitals_ro }
          - { source: gisco-hospitals-serbia, country: RS, country_name: Serbia, source_key: eu_gisco_hospitals_rs }
          - { source: gisco-hospitals-slovakia, country: SK, country_name: Slovakia, source_key: eu_gisco_hospitals_sk }
          - { source: gisco-hospitals-slovenia, country: SI, country_name: Slovenia, source_key: eu_gisco_hospitals_si }
          - { source: gisco-hospitals-spain, country: ES, country_name: Spain, source_key: eu_gisco_hospitals_es }
          - { source: gisco-hospitals-sweden, country: SE, country_name: Sweden, source_key: eu_gisco_hospitals_se }
          - { source: gisco-hospitals-switzerland, country: CH, country_name: Switzerland, source_key: eu_gisco_hospitals_ch }
    env:
      REGISTRY_API_BASE_URL: https://network-map-v846.onrender.com

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve dedicated registry database
        uses: ./.github/actions/resolve-registry-database
        with:
          source: ${{ matrix.source }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Download and normalize the live official registry
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database connection is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          mkdir -p /tmp/registry
          if [[ "${{ matrix.source }}" == "colombia-reps" ]]; then
          count="$(python scripts/sync-colombia-reps.py --output /tmp/registry/provider.tsv)"
        else
          count="$(node scripts/sync-live-registry-to-tsv.mjs --source "${{ matrix.source }}" --country "${{ matrix.country }}" --output /tmp/registry/provider.tsv)"
        fi
          (( count > 0 )) || { echo "Registry returned no providers" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${count}" >> "$GITHUB_ENV"
      - name: Import compact dedicated registry
        shell: bash
        env:
          REGISTRY_TSV: /tmp/registry/provider.tsv
          REGISTRY_EXPECTED: ${{ env.REGISTRY_EXPECTED }}
          REGISTRY_SOURCE_KEY: ${{ matrix.source_key }}
          REGISTRY_COUNTRY_CODE: ${{ matrix.country }}
        run: scripts/import-official-registry.sh
