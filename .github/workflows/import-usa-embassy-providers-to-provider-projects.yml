name: Import all U.S. Embassy medical providers into provider Neon projects

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type IMPORT_EMBASSY_PROVIDERS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: usa-embassy-provider-neon-import
  cancel-in-progress: false

jobs:
  import:
    name: Import Embassy providers through the canonical provider pipeline
    if: ${{ inputs.confirmation == 'IMPORT_EMBASSY_PROVIDERS' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PROJECT_COUNT: "4"
      USA_EMBASSY_DATABASE_URL: ${{ secrets.USA_EMBASSY_DATABASE_URL }}
      USA_EMBASSY_DATABASE_URL_2: ${{ secrets.USA_EMBASSY_DATABASE_URL_2 }}
      USA_EMBASSY_DATABASE_URL_3: ${{ secrets.USA_EMBASSY_DATABASE_URL_3 }}
      USA_EMBASSY_DATABASE_URL_4: ${{ secrets.USA_EMBASSY_DATABASE_URL_4 }}
      R2_BUCKET: healthsites-data
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_REGION: auto
      RCLONE_CONFIG_R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RCLONE_CONFIG_R2_ACL: private
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"

    steps:
      - name: Check out the provider importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install workbook and database tools
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'openpyxl>=3.1,<4'
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client rclone jq

      - name: Validate provider projects and R2 credentials
        shell: bash
        run: |
          set -euo pipefail
          declare -a urls=(
            "$USA_EMBASSY_DATABASE_URL"
            "$USA_EMBASSY_DATABASE_URL_2"
            "$USA_EMBASSY_DATABASE_URL_3"
            "$USA_EMBASSY_DATABASE_URL_4"
          )
          for i in "${!urls[@]}"; do
            slot=$((i + 1))
            url="${urls[$i]}"
            echo "::add-mask::${url}"
            [[ "$url" == postgres* ]] || { echo "USA Embassy provider database ${slot} is missing" >&2; exit 1; }
            missing="$(psql "$url" -Atqc "
              WITH required(name) AS (VALUES
                ('provider_raw_records'),
                ('provider_stage_records'),
                ('provider_master'),
                ('provider_master_sources'),
                ('provider_master_types'),
                ('provider_type_catalog'),
                ('medical_providers'),
                ('provider_master_map_view')
              )
              SELECT string_agg(name, ', ' ORDER BY name)
              FROM required
              WHERE to_regclass('public.' || name) IS NULL
            ")"
            [[ -z "$missing" ]] || { echo "Embassy provider database ${slot} is not initialized. Missing: ${missing}" >&2; exit 1; }
          done
          [[ -n "$RCLONE_CONFIG_R2_ENDPOINT" ]] || { echo "R2_ENDPOINT is missing" >&2; exit 1; }
          [[ -n "$RCLONE_CONFIG_R2_ACCESS_KEY_ID" ]] || { echo "R2_ACCESS_KEY_ID is missing" >&2; exit 1; }
          [[ -n "$RCLONE_CONFIG_R2_SECRET_ACCESS_KEY" ]] || { echo "R2_SECRET_ACCESS_KEY is missing" >&2; exit 1; }

      - name: Locate and download the three final Embassy workbooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/usa-embassy/source
          inventory=/tmp/usa-embassy/r2-files.txt
          rclone lsf "r2:${R2_BUCKET}" --recursive --files-only --s3-no-check-bucket > "$inventory"

          declare -a basenames=(
            'Embassy_Medical_Providers_Geocoded_Part_1_Rows_00001-05000.xlsx'
            'Embassy_Medical_Providers_Geocoded_Part_2_Rows_05001-10000.xlsx'
            'Embassy_Medical_Providers_Geocoded_Part_3_Rows_10001-14552.xlsx'
          )

          for basename in "${basenames[@]}"; do
            mapfile -t matches < <(awk -v name="$basename" '$0 == name || index($0, "/" name) == length($0) - length(name) {print}' "$inventory")
            if [[ "${#matches[@]}" -eq 0 ]]; then
              echo "Required Embassy workbook is not in R2 bucket ${R2_BUCKET}: ${basename}" >&2
              echo "Expected the exact final workbook previously produced for the 14,552-row Embassy dataset." >&2
              exit 4
            fi
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Multiple R2 objects match ${basename}; refusing an ambiguous import:" >&2
              printf '  %s\n' "${matches[@]}" >&2
              exit 5
            fi
            source_key="${matches[0]}"
            echo "Found ${basename} at ${source_key}"
            rclone copyto \
              "r2:${R2_BUCKET}/${source_key}" \
              "/tmp/usa-embassy/source/${basename}" \
              --s3-no-check-bucket
            test -s "/tmp/usa-embassy/source/${basename}"
          done

      - name: Normalize and validate all 14,552 Embassy providers
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize-usa-embassy-workbooks.py \
            --expected 14552 \
            --output /tmp/usa-embassy/usa-embassy-world.tsv \
            '/tmp/usa-embassy/source/Embassy_Medical_Providers_Geocoded_Part_1_Rows_00001-05000.xlsx' \
            '/tmp/usa-embassy/source/Embassy_Medical_Providers_Geocoded_Part_2_Rows_05001-10000.xlsx' \
            '/tmp/usa-embassy/source/Embassy_Medical_Providers_Geocoded_Part_3_Rows_10001-14552.xlsx'
          rows=$(( $(wc -l < /tmp/usa-embassy/usa-embassy-world.tsv) - 1 ))
          [[ "$rows" == "14552" ]] || { echo "Normalized row count mismatch: ${rows}" >&2; exit 6; }
          echo "Validated ${rows} Embassy providers"

      - name: Allocate whole countries across four Embassy provider projects
        shell: bash
        run: |
          set -euo pipefail
          node scripts/partition-usa-embassy-provider-projects.mjs \
            --input /tmp/usa-embassy/usa-embassy-world.tsv \
            --output-dir /tmp/usa-embassy/provider-projects \
            --project-count 4
          jq . /tmp/usa-embassy/provider-projects/provider-project-allocation.json
          source_rows="$(jq -r '.source_rows' /tmp/usa-embassy/provider-projects/provider-project-allocation.json)"
          [[ "$source_rows" == "14552" ]] || { echo "Allocation source count mismatch: ${source_rows}" >&2; exit 7; }

      - name: Save Embassy country allocation report
        uses: actions/upload-artifact@v4
        with:
          name: usa-embassy-provider-project-allocation
          path: /tmp/usa-embassy/provider-projects/provider-project-allocation.json
          if-no-files-found: error
          retention-days: 30

      - name: Load and promote all four Embassy provider projects in parallel
        shell: bash
        run: |
          set -euo pipefail
          manifest=/tmp/usa-embassy/provider-projects/provider-project-allocation.json
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"

          process_slot() {
            local slot="$1"
            local target_url variable file expected expected_master actual db_bytes

            if [[ "$slot" == "1" ]]; then
              target_url="$USA_EMBASSY_DATABASE_URL"
            else
              variable="USA_EMBASSY_DATABASE_URL_${slot}"
              target_url="${!variable}"
            fi
            echo "::add-mask::${target_url}"

            file="/tmp/usa-embassy/provider-projects/usa_embassy_provider_project_${slot}.tsv"
            expected="$(jq -r ".projects[] | select(.slot == ${slot}) | .rows" "$manifest")"
            expected_master="$(jq -r ".projects[] | select(.slot == ${slot}) | .distinct_master_keys" "$manifest")"
            test -s "$file"

            psql "$target_url" -v ON_ERROR_STOP=1 -c "
              CREATE TABLE IF NOT EXISTS public.source5_import_staging (
                source_record_id text PRIMARY KEY,
                source_url text,
                name text NOT NULL,
                normalized_name text,
                address_line1 text,
                formatted_address text,
                city text,
                state_region text,
                postal_code text,
                country_code text NOT NULL,
                lat double precision NOT NULL,
                lng double precision NOT NULL,
                phone text,
                website text,
                email text,
                primary_provider_type text,
                capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
                quality_score numeric,
                master_key text NOT NULL
              );
              TRUNCATE public.source5_import_staging;
            "

            if ! psql "$target_url" -v ON_ERROR_STOP=1 -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" < "$file"; then
              psql "$target_url" -c 'TRUNCATE public.source5_import_staging' || true
              return 1
            fi

            if ! psql "$target_url" \
              -v ON_ERROR_STOP=1 \
              -v expected="$expected" \
              -v expected_master="$expected_master" \
              -f scripts/promote-usa-embassy-world.sql; then
              psql "$target_url" -c 'TRUNCATE public.source5_import_staging' || true
              return 1
            fi

            actual="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.medical_providers WHERE data_source='U.S. Embassy Medical Provider Lists'")"
            [[ "$actual" == "$expected" ]] || { echo "Embassy project ${slot} verification failed: ${actual} vs ${expected}" >&2; return 1; }
            db_bytes="$(psql "$target_url" -Atqc "SELECT pg_database_size(current_database())")"
            echo "Embassy project ${slot}: promoted ${actual} providers; db_bytes=${db_bytes}"
            printf '%s\n' "- Embassy project ${slot}: ${actual} providers (${db_bytes} bytes)" > "/tmp/usa-embassy/provider-project-${slot}.summary"
          }

          declare -a pids=()
          declare -a slots=()
          for slot in $(seq 1 4); do
            process_slot "$slot" > "/tmp/usa-embassy/provider-project-${slot}.log" 2>&1 &
            pids+=("$!")
            slots+=("$slot")
          done

          failed=0
          for i in "${!pids[@]}"; do
            slot="${slots[$i]}"
            if wait "${pids[$i]}"; then
              cat "/tmp/usa-embassy/provider-project-${slot}.log"
            else
              echo "Embassy project ${slot} promotion failed" >&2
              cat "/tmp/usa-embassy/provider-project-${slot}.log" >&2
              failed=1
            fi
          done
          [[ "$failed" == "0" ]] || exit 1

          for slot in $(seq 1 4); do
            cat "/tmp/usa-embassy/provider-project-${slot}.summary" >> "$GITHUB_STEP_SUMMARY"
          done

          imported="$(jq '[.projects[].rows] | add' "$manifest")"
          source="$(jq '.source_rows' "$manifest")"
          [[ "$imported" == "$source" ]] || { echo "Final Embassy total mismatch: ${imported} vs ${source}" >&2; exit 8; }
          [[ "$source" == "14552" ]] || { echo "Final Embassy source total is not 14,552: ${source}" >&2; exit 9; }
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "All ${source} geocoded U.S. Embassy providers were assigned and promoted through the canonical provider pipeline." >> "$GITHUB_STEP_SUMMARY"
