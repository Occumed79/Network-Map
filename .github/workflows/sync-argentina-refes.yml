name: Sync Argentina REFES healthcare establishments

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/actions/resolve-registry-database/action.yml"
      - ".github/workflows/sync-argentina-refes.yml"
      - "scripts/normalize-argentina-refes.py"
      - "scripts/official-registry-schema.sql"
      - "scripts/import-official-registry.sh"
  schedule:
    - cron: "5 11 6 * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: argentina-refes-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download and promote official REFES registry
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # Query the publishing ministry: the federal mirror is missing 2025/2026.
      REFES_PACKAGE_API: https://datos.salud.gob.ar/api/3/action/package_show?id=listado-establecimientos-de-salud-asentados-en-el-registro-federal-refes

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve dedicated registry database
        uses: ./.github/actions/resolve-registry-database
        with:
          source: argentina-refes

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install import tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq postgresql-client
          python -m pip install --disable-pip-version-check openpyxl

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database connection is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null

      - name: Resolve and download latest official REFES resource
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/refes
          # Public ministry data only; its server currently omits an intermediate TLS certificate.
          curl --fail --location --insecure --connect-timeout 20 --max-time 180 --retry 4 --retry-all-errors "$REFES_PACKAGE_API" --output /tmp/refes/package.json
          jq -e '.success == true and (.result.resources | length > 0)' /tmp/refes/package.json >/dev/null

          resource="$(jq -r '
            [.result.resources[]
             | select((((.format // "") + " " + (.mimetype // "") + " " + (.name // "")) | ascii_downcase)
               | test("xlsx|spreadsheet|excel|csv"))]
            | sort_by(.last_modified // .created // "")
            | last
            | [(.url // ""), (.format // .mimetype // ""), (.name // "")]
            | @tsv
          ' /tmp/refes/package.json)"
          IFS=$'\t' read -r url format name <<< "$resource"
          [[ "$url" == http* ]] || { echo "Could not resolve a downloadable REFES resource" >&2; exit 1; }
          [[ "$url" == http://datos.salud.gob.ar/* || "$url" == https://datos.salud.gob.ar/* ]] || {
            echo "REFES catalog returned an unexpected download host: ${url}" >&2
            exit 1
          }
          case "${format,,} ${url,,}" in
            *csv*) ext=csv ;;
            *) ext=xlsx ;;
          esac
          target="/tmp/refes/refes.${ext}"
          # The download uses the same publishing ministry and known TLS-chain
          # exception as the catalog. Validate schema, coordinates, and counts
          # before allowing any production import.
          curl --fail --location --insecure --connect-timeout 20 --max-time 180 --retry 4 --retry-all-errors "$url" --output "$target"
          test -s "$target"
          size="$(stat -c%s "$target")"
          (( size >= 500000 )) || { echo "REFES download is unexpectedly small: ${size} bytes" >&2; exit 1; }
          echo "REFES_FILE=${target}" >> "$GITHUB_ENV"
          echo "REFES_RESOURCE_NAME=${name}" >> "$GITHUB_ENV"
          echo "Resolved REFES resource: ${name} (${format})"

      - name: Normalize geocoded REFES establishments
        shell: bash
        run: |
          set -euo pipefail
          python scripts/normalize-argentina-refes.py --input "$REFES_FILE" --output /tmp/refes/provider.tsv
          test -s /tmp/refes/provider.tsv
          expected=$(( $(wc -l < /tmp/refes/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/refes/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 5000 )) || { echo "Only ${expected} geocoded REFES establishments; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 4000 )) || { echo "Only ${distinct_master} REFES canonical locations; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"
          echo "REFES geocoded records: ${expected}; canonical locations: ${distinct_master}"

      - name: Import compact dedicated registry
        shell: bash
        env:
          REGISTRY_TSV: /tmp/refes/provider.tsv
          REGISTRY_EXPECTED: ${{ env.REGISTRY_EXPECTED }}
          REGISTRY_SOURCE_KEY: ar_refes
          REGISTRY_COUNTRY_CODE: AR
        run: scripts/import-official-registry.sh

      - name: Verify dedicated Argentina REFES registry
        shell: bash
        run: |
          set -euo pipefail
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.official_registry_providers")"
          [[ "$mapped_count" == "$REGISTRY_EXPECTED" ]] || { echo "Registry count mismatch ${mapped_count}" >&2; exit 1; }
          (( mapped_count >= 4000 )) || { echo "Only ${mapped_count} providers map-renderable" >&2; exit 1; }
          echo "Argentina REFES map-renderable providers: ${mapped_count}"
