name: Generate Source 5 batch 02

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source5-batch-next-six.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE5_CODES: BS,BH,BD,BB,BY,BE
  SOURCE5_MARKER: data/generated/source5-countries/batch-02-BS-BH-BD-BB-BY-BE.json

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'data/international-source-bootstrap'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - name: Check out temporary international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1
      - name: Check batch marker
        id: check
        run: |
          if [ -f "$SOURCE5_MARKER" ]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            echo "Batch 02 is already generated."
          else
            echo "required=true" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: prepare
    if: needs.prepare.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        country: [BS, BH, BD, BB, BY, BE]

    steps:
      - name: Check out temporary international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate ${{ matrix.country }} facilities
        env:
          COUNTRY_CODES: ${{ matrix.country }}
          SQL_CHUNK_SIZE: '200'
        run: |
          set -euo pipefail
          node --check scripts/bootstrap-global-health-facilities.mjs
          node --check scripts/compact-source5-sql.mjs
          node scripts/bootstrap-global-health-facilities.mjs | tee /tmp/source5-${{ matrix.country }}.log
          COMPACT_CHUNK_SIZE=200 node scripts/compact-source5-sql.mjs
          mkdir -p /tmp/source5-output/${{ matrix.country }}
          cp -R data/generated/global-health-facilities/. /tmp/source5-output/${{ matrix.country }}/
          cp /tmp/source5-${{ matrix.country }}.log /tmp/source5-output/${{ matrix.country }}/run.log
          test "$(jq -r '.countries_requested | join(",")' /tmp/source5-output/${{ matrix.country }}/manifest.json)" = "${{ matrix.country }}"

      - name: Upload ${{ matrix.country }} generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: source5-batch02-${{ matrix.country }}
          path: /tmp/source5-output
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && needs.prepare.outputs.required == 'true'
    needs: [prepare, generate]
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out temporary international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Download every successful country dataset
        uses: actions/download-artifact@v4
        with:
          pattern: source5-batch02-*
          path: data/generated/source5-countries
          merge-multiple: true

      - name: Build batch manifest and marker
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'data/generated/source5-countries';
          const requested = process.env.SOURCE5_CODES.split(',');
          const results = requested.flatMap(code => {
            const manifestPath = path.join(root, code, 'manifest.json');
            const compactPath = path.join(root, code, 'compact', 'manifest.json');
            if (!fs.existsSync(manifestPath) || !fs.existsSync(compactPath)) return [];
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            const compact = JSON.parse(fs.readFileSync(compactPath, 'utf8'));
            return [{
              country_code: code,
              generated_at: manifest.generated_at,
              rows: manifest.total_rows,
              compact_files: compact.files.length,
              compact_rows: compact.total_rows,
            }];
          });
          if (results.length !== requested.length) {
            throw new Error(`Only ${results.length}/${requested.length} countries generated`);
          }
          const batch = {
            batch: 2,
            requested,
            completed: results.map(result => result.country_code),
            results,
            generated_at: new Date().toISOString(),
          };
          fs.mkdirSync(path.dirname(process.env.SOURCE5_MARKER), { recursive: true });
          fs.writeFileSync(process.env.SOURCE5_MARKER, JSON.stringify(batch, null, 2) + '\n');
          fs.writeFileSync(path.join(root, 'batch-manifest.json'), JSON.stringify(batch, null, 2) + '\n');
          NODE
          cat "$SOURCE5_MARKER"

      - name: Publish country-specific datasets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/source5-countries
          git commit -m "data: generate Source 5 BS BH BD BB BY BE [skip ci]"
          git push origin HEAD:data/international-source-bootstrap

      - name: Upload consolidated batch
        uses: actions/upload-artifact@v4
        with:
          name: source5-batch-02-consolidated
          path: data/generated/source5-countries
          if-no-files-found: error
          retention-days: 7
