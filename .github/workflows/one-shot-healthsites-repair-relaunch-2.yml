name: One-shot Healthsites hot-path repair and relaunch

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-repair-relaunch-2.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch the confirmed provider source-link bottleneck
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          promote = Path('scripts/promote-healthsites-world.sql')
          text = promote.read_text()
          marker = "INSERT INTO public.provider_master_sources (\n"
          patch = """-- Bulk source linking looks up every staged Healthsites record by source id.\n-- Keep that lookup indexed so a ~144k-row project remains set-scale instead of\n-- repeatedly scanning the entire staging table.\nCREATE INDEX IF NOT EXISTS idx_provider_stage_records_source_record\n  ON public.provider_stage_records(source_key, source_record_id);\n\nANALYZE public.provider_stage_records;\nANALYZE public.provider_raw_records;\n\n"""
          if 'idx_provider_stage_records_source_record' not in text:
              if marker not in text:
                  raise SystemExit('provider_master_sources insertion marker not found')
              promote.write_text(text.replace(marker, patch + marker, 1))

          migration = Path('api-server/src/db/migrations/20260806_database_lifecycle.sql')
          mtext = migration.read_text()
          migration_patch = """-- Required by source promotion lookups on bulk provider datasets.\nCREATE INDEX IF NOT EXISTS idx_provider_stage_records_source_record\n  ON public.provider_stage_records(source_key, source_record_id);"""
          if 'idx_provider_stage_records_source_record' not in mtext:
              migration.write_text(mtext.rstrip() + '\n\n' + migration_patch + '\n')
          PY

          rm -f .github/workflows/one-shot-healthsites-progress-probe.yml
          rm -f .github/workflows/one-shot-healthsites-progress-probe2.yml
          rm -f .github/workflows/one-shot-healthsites-repair-relaunch.yml
          rm -f .github/workflows/one-shot-healthsites-repair-relaunch-2.yml

          git diff --check
          git diff -- scripts/promote-healthsites-world.sql api-server/src/db/migrations/20260806_database_lifecycle.sql

      - name: Commit the permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix Healthsites bulk source-link promotion performance"
          git push origin HEAD:main

      - name: Relaunch all-country Healthsites import from repaired main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-healthsites-archive-to-provider-projects.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f project_count=8 \
            -f confirmation=IMPORT_ALL_COUNTRIES
