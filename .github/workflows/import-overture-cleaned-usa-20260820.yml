name: Overture exact-import preparation

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/import-overture-cleaned-usa-20260820.yml
      - scripts/import-overture-cleaned-usa-20260820.py
      - tmp/overture-exact-patch/**

permissions:
  contents: read

jobs:
  build-overture-candidate-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check duckdb
          sudo apt-get update -qq
          sudo apt-get install --yes -qq zstd

      - name: Patch historical syntax typo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/import-overture-cleaned-usa-20260820.py')
          lines = p.read_text().splitlines()
          lines[120] = '    return {norm(p.strip(" \'\\\"")) for p in re.split(r"[,|;]+", s) if p.strip(" \'\\\"")}'
          p.write_text('\n'.join(lines) + '\n')
          compile(p.read_text(), str(p), 'exec')
          PY

      - name: Build candidate SQLite without Render upload
        run: |
          python - <<'PY'
          import importlib.util
          p='scripts/import-overture-cleaned-usa-20260820.py'
          spec=importlib.util.spec_from_file_location('overture_import',p)
          m=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(m)
          class ExportComplete(Exception): pass
          def stop_after_extract(*args, **kwargs): raise ExportComplete()
          m.post_chunk=stop_after_extract
          try:
              m.main()
          except ExportComplete:
              pass
          PY
          test -s overture_cleaned_usa.sqlite

      - name: Reconstruct and inspect exact patch
        run: |
          set -euo pipefail
          cat tmp/overture-exact-patch/part-*.b64 | base64 --decode > /tmp/overture-exact-patch.zst
          zstd --decompress --stdout /tmp/overture-exact-patch.zst > /tmp/overture-exact-patch
          echo "patch bytes: $(wc -c < /tmp/overture-exact-patch)"
          file /tmp/overture-exact-patch
          python - <<'PY'
          from pathlib import Path
          p=Path('/tmp/overture-exact-patch')
          b=p.read_bytes()[:512]
          print('patch_prefix_hex=', b[:32].hex())
          print('patch_prefix_text=', b.decode('utf-8','replace')[:400].replace('\n','\\n'))
          PY

      - name: Upload candidate SQLite
        uses: actions/upload-artifact@v4
        with:
          name: overture-candidate-sqlite
          path: overture_cleaned_usa.sqlite
          compression-level: 9
          retention-days: 2
