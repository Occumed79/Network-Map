name: One-shot initialize USA Embassy provider projects

on:
  push:
    paths:
      - .github/workflows/one-shot-initialize-usa-embassy-projects.yml

permissions:
  contents: read

concurrency:
  group: one-shot-initialize-usa-embassy-projects
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_DATABASE_URL: ${{ secrets.DATABASE_URL }}
      USA_EMBASSY_DATABASE_URL: ${{ secrets.USA_EMBASSY_DATABASE_URL }}
      USA_EMBASSY_DATABASE_URL_2: ${{ secrets.USA_EMBASSY_DATABASE_URL_2 }}
      USA_EMBASSY_DATABASE_URL_3: ${{ secrets.USA_EMBASSY_DATABASE_URL_3 }}
      USA_EMBASSY_DATABASE_URL_4: ${{ secrets.USA_EMBASSY_DATABASE_URL_4 }}

    steps:
      - name: Install PostgreSQL 18 client
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install --yes -qq ca-certificates curl
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl --fail --show-error --silent \
            --output /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          ubuntu_codename="$(. /etc/os-release && printf '%s' "$VERSION_CODENAME")"
          sudo tee /etc/apt/sources.list.d/pgdg.sources >/dev/null <<EOF
          Types: deb
          URIs: https://apt.postgresql.org/pub/repos/apt
          Suites: ${ubuntu_codename}-pgdg
          Components: main
          Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          EOF
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Validate four independent Embassy targets
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_DATABASE_URL" == postgres* ]] || { echo "DATABASE_URL is missing" >&2; exit 1; }
          declare -a urls=(
            "$USA_EMBASSY_DATABASE_URL"
            "$USA_EMBASSY_DATABASE_URL_2"
            "$USA_EMBASSY_DATABASE_URL_3"
            "$USA_EMBASSY_DATABASE_URL_4"
          )
          for i in "${!urls[@]}"; do
            slot=$((i + 1))
            url="${urls[$i]}"
            echo "::add-mask::${url}"
            [[ "$url" == postgres* ]] || { echo "USA Embassy provider project ${slot} secret is missing" >&2; exit 1; }
            [[ "$url" != "$SOURCE_DATABASE_URL" ]] || { echo "Embassy project ${slot} points at the primary database" >&2; exit 1; }
            for j in "${!urls[@]}"; do
              if (( j < i )) && [[ "$url" == "${urls[$j]}" ]]; then
                echo "Embassy projects ${slot} and $((j + 1)) point at the same database" >&2
                exit 1
              fi
            done
          done

      - name: Prepare canonical schema dump
        shell: bash
        run: |
          set -euo pipefail
          pg_dump "$SOURCE_DATABASE_URL" \
            --schema-only \
            --no-owner \
            --no-privileges \
            --file=/tmp/provider-schema.sql

      - name: Initialize or repair all four Embassy projects
        shell: bash
        run: |
          set -euo pipefail
          declare -a urls=(
            "$USA_EMBASSY_DATABASE_URL"
            "$USA_EMBASSY_DATABASE_URL_2"
            "$USA_EMBASSY_DATABASE_URL_3"
            "$USA_EMBASSY_DATABASE_URL_4"
          )

          for i in "${!urls[@]}"; do
            slot=$((i + 1))
            target_url="${urls[$i]}"
            echo "===== USA EMBASSY PROJECT ${slot} ====="

            table_count="$(psql "$target_url" -Atqc "SELECT count(*) FROM pg_catalog.pg_tables WHERE schemaname='public'")"
            if [[ "$table_count" == "0" ]]; then
              echo "Project ${slot}: empty target; cloning canonical provider schema"
              psql "$target_url" -v ON_ERROR_STOP=1 -f /tmp/provider-schema.sql >/tmp/embassy-schema-${slot}.log

              for table in provider_schema_state schema_migration_versions provider_type_catalog; do
                if psql "$SOURCE_DATABASE_URL" -Atqc "SELECT to_regclass('public.${table}') IS NOT NULL" | grep -qx t; then
                  pg_dump "$SOURCE_DATABASE_URL" \
                    --data-only \
                    --inserts \
                    --no-owner \
                    --no-privileges \
                    --table="public.${table}" \
                  | psql "$target_url" -v ON_ERROR_STOP=1 >/tmp/embassy-reference-${slot}-${table}.log
                fi
              done
            else
              echo "Project ${slot}: already contains ${table_count} public tables; validating/repairing in place"
            fi

            psql "$target_url" -v ON_ERROR_STOP=1 <<'SQL'
            INSERT INTO public.provider_type_catalog
              (type_key, display_name, description, active)
            VALUES
              ('urgent_care','Urgent Care','Urgent care and walk-in clinic locations',true),
              ('dot_provider','DOT Provider','DOT exam or CDL medical examiner capable provider',true),
              ('faa_provider','FAA Provider','FAA aviation medical examiner or aviation medical clinic',true),
              ('lab','Lab','Lab, toxicology, specimen collection, drug screen, or diagnostics location',true),
              ('general_practitioner','General Practitioner','Primary care, family medicine, internal medicine, or general practice provider',true),
              ('occupational_health_clinic','Occupational Health Clinic','Occupational medicine, employee health, workers comp, fit-for-duty, or employer services clinic',true),
              ('dental','Dental','Dental provider or DD 2813 capable clinic',true),
              ('imaging','Imaging','X-ray, radiology, mammogram, MRI, CT, ultrasound, or imaging center',true),
              ('pharmacy_vaccination','Pharmacy / Vaccination','Pharmacy, immunization, vaccination, or travel medicine provider',true),
              ('hospital','Hospital','Hospital, medical center, or emergency facility',true),
              ('specialist','Specialist','Specialty physician or specialist clinic',true),
              ('unknown','Unknown','Unclassified provider',true)
            ON CONFLICT (type_key) DO UPDATE SET
              display_name = EXCLUDED.display_name,
              description = EXCLUDED.description,
              active = EXCLUDED.active;

            DO $$
            DECLARE relation_name text;
            DECLARE canonical_type_count integer;
            BEGIN
              FOREACH relation_name IN ARRAY ARRAY[
                'provider_raw_records',
                'provider_stage_records',
                'provider_master',
                'provider_master_sources',
                'provider_master_types',
                'provider_type_catalog',
                'medical_providers',
                'provider_master_map_view'
              ] LOOP
                IF to_regclass('public.' || relation_name) IS NULL THEN
                  RAISE EXCEPTION 'Required provider relation is missing: %', relation_name;
                END IF;
              END LOOP;

              SELECT count(*) INTO canonical_type_count
              FROM public.provider_type_catalog
              WHERE active
                AND type_key IN (
                  'urgent_care','dot_provider','faa_provider','lab',
                  'general_practitioner','occupational_health_clinic','dental',
                  'imaging','pharmacy_vaccination','hospital','specialist','unknown'
                );

              IF canonical_type_count <> 12 THEN
                RAISE EXCEPTION 'Canonical provider type catalog incomplete: %', canonical_type_count;
              END IF;
            END $$;
            SQL

            provider_rows="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.provider_master")"
            catalog_rows="$(psql "$target_url" -Atqc "SELECT count(*) FROM public.provider_type_catalog WHERE active")"
            db_bytes="$(psql "$target_url" -Atqc "SELECT pg_database_size(current_database())")"
            echo "Project ${slot}: provider_rows=${provider_rows} active_types=${catalog_rows} db_bytes=${db_bytes}"
            printf '%s\n' "- Embassy project ${slot}: ready (${provider_rows} providers; ${catalog_rows} active types; ${db_bytes} bytes)" >> "$GITHUB_STEP_SUMMARY"
          done
