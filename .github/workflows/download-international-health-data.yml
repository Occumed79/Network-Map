name: Download international health data

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/bootstrap-world-bank-health-data.mjs
      - .github/workflows/download-international-health-data.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/bootstrap-world-bank-health-data.mjs
      - .github/workflows/download-international-health-data.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-normalize:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'data/international-source-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download World Bank health baseline
        run: |
          mkdir -p data/generated/international
          set +e
          node scripts/bootstrap-world-bank-health-data.mjs > data/generated/international/download.log 2>&1
          status=$?
          echo "$status" > data/generated/international/download.exit-code
          cat data/generated/international/download.log
          exit 0

      - name: Upload generated data and diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: international-health-baseline
          path: data/generated/international
          if-no-files-found: error
          retention-days: 7
