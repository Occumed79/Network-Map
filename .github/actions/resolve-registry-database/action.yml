name: Resolve dedicated registry database
description: Obtain the dedicated Neon connection string from the deployed app using GitHub Actions OIDC.
inputs:
  source:
    description: Registry source id
    required: true
runs:
  using: composite
  steps:
    - name: Resolve database connection
      shell: bash
      env:
        REGISTRY_SOURCE: ${{ inputs.source }}
        REGISTRY_BROKER_BASE_URL: https://network-map-v846.onrender.com
      run: |
        set -euo pipefail
        [[ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" && -n "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]] || {
          echo "GitHub OIDC is unavailable; workflow requires permissions: id-token: write" >&2
          exit 1
        }

        oidc_response="$(curl --fail --silent --show-error \
          -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
          "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=network-map-registry-sync")"
        oidc_token="$(jq -r '.value // empty' <<<"$oidc_response")"
        [[ -n "$oidc_token" ]] || { echo "GitHub OIDC token was empty" >&2; exit 1; }
        echo "::add-mask::${oidc_token}"

        response=""
        for attempt in $(seq 1 36); do
          if response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${oidc_token}" \
            "${REGISTRY_BROKER_BASE_URL}/api/registry-sync/connection/${REGISTRY_SOURCE}" 2>/tmp/registry-broker.err)"; then
            break
          fi
          if (( attempt == 36 )); then
            cat /tmp/registry-broker.err >&2 || true
            echo "Registry database broker did not become ready" >&2
            exit 1
          fi
          sleep 10
        done

        database_url="$(jq -r '.connectionString // empty' <<<"$response")"
        [[ "$database_url" == postgres* ]] || { echo "Registry broker returned no PostgreSQL connection" >&2; exit 1; }
        echo "::add-mask::${database_url}"
        echo "TARGET_DATABASE_URL=${database_url}" >> "$GITHUB_ENV"
