services:
  - type: web
    name: network-map-tool-mqib
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/occu-med-map build && pnpm --filter @workspace/api-server build
    startCommand: node --enable-source-maps ./api-server/dist/index.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://network-map-tool-mqib.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLED
        sync: false
      - key: OVERPASS_DATABASE_URL
        sync: false
      - key: WRITE_API_TOKEN
        sync: false
      - key: PGPOOL_MAX
        value: 4
      - key: PGPOOL_CONNECTION_TIMEOUT_MS
        value: 8000
      - key: PGPOOL_IDLE_TIMEOUT_MS
        value: 30000
      - key: PGAPPNAME
        value: network-map-api
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GEOCODIO_TOKEN
        sync: false
      - key: GEOCODIO_SECONDARY_TOKEN
        sync: false
      - key: GEOCODIO_TERTIARY_TOKEN
        sync: false
      - key: GEOCODIO_QUATERNARY_TOKEN
        sync: false
      - key: BROWSE_AI_API_KEY
        sync: false
