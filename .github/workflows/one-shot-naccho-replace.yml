name: One-shot enriched NACCHO replacement

on:
  push:
    branches:
      - tmp/naccho-enriched-replacement-20260816
    paths:
      - .github/workflows/one-shot-naccho-replace.yml

permissions:
  contents: read

jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct replacement CSV
        shell: node {0}
        run: |
          const fs = require('fs');
          const z = require('zlib');
          const files = fs.readdirSync('tmp')
            .filter((name) => /^naccho_payload\.part\d+$/.test(name))
            .sort();
          if (!files.length) throw new Error('No NACCHO payload parts found');
          const encodedParts = files.map((name) => fs.readFileSync(`tmp/${name}`, 'utf8').trim());
          const transforms = [
            ['identity', (value) => value],
            ['brotli', z.brotliDecompressSync],
            ['gunzip', z.gunzipSync],
            ['inflate', z.inflateSync],
            ['inflateRaw', z.inflateRawSync],
            ['unzip', z.unzipSync],
          ];
          const decodeOne = (text, index) => {
            const seeds = [];
            const add = (label, value) => {
              if (Buffer.isBuffer(value) && value.length) seeds.push([label, value]);
            };
            add('utf8', Buffer.from(text, 'utf8'));
            try { add('base64', Buffer.from(text, 'base64')); } catch {}
            try { add('base64url', Buffer.from(text, 'base64url')); } catch {}
            for (const [label, seed] of seeds) {
              for (const [name, fn] of transforms) {
                try {
                  const out = fn(seed);
                  const printable = out.toString('utf8');
                  if (printable.includes(',') && printable.includes('\n')) {
                    console.log(`Decoded part ${index} via ${label}->${name}: ${out.length} bytes`);
                    return out;
                  }
                } catch {}
              }
            }
            throw new Error(`Unable to decode payload part ${index}`);
          };
          const decodedParts = encodedParts.map(decodeOne);
          const combined = Buffer.concat(decodedParts);
          const text = combined.toString('utf8').replace(/^\uFEFF/, '');
          const header = 'lhd_id,name,agency_type,address,city,state_code,postal_code,lat,lng,phone,website,source_url,public_health_services,raw_data';
          if (!text.startsWith(header)) {
            throw new Error(`Decoded payload does not start with expected CSV header; starts with ${JSON.stringify(text.slice(0, 120))}`);
          }
          fs.writeFileSync('/tmp/naccho_replacement.csv', combined);
          console.log(`Reconstructed NACCHO CSV from ${files.length} independently decoded parts; ${combined.length} bytes`);

      - name: Validate replacement CSV
        shell: python
        run: |
          import csv
          path = '/tmp/naccho_replacement.csv'
          with open(path, newline='', encoding='utf-8') as handle:
              rows = list(csv.DictReader(handle))
          if len(rows) != 3410:
              raise SystemExit(f'Expected 3410 rows, found {len(rows)}')
          ids = set()
          for index, row in enumerate(rows, start=2):
              if not row.get('lhd_id') or row['lhd_id'] in ids:
                  raise SystemExit(f'Invalid or duplicate lhd_id at CSV row {index}')
              ids.add(row['lhd_id'])
              try:
                  lat = float(row['lat']); lng = float(row['lng'])
              except Exception:
                  raise SystemExit(f'Missing/invalid coordinates at CSV row {index}')
              if not (-90 <= lat <= 90 and -180 <= lng <= 180):
                  raise SystemExit(f'Out-of-range coordinates at CSV row {index}')
              if not row.get('name') or not row.get('state_code'):
                  raise SystemExit(f'Missing required name/state at CSV row {index}')
          print(f'Validated {len(rows)} NACCHO rows; all {len(rows)} have coordinates and unique IDs')

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client

      - name: Stage enriched NACCHO data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP TABLE IF EXISTS public.naccho_lhd_replacement_stage;
          CREATE TABLE public.naccho_lhd_replacement_stage (
            lhd_id text,
            name text,
            agency_type text,
            address text,
            city text,
            state_code text,
            postal_code text,
            lat text,
            lng text,
            phone text,
            website text,
            source_url text,
            public_health_services text,
            raw_data text
          );
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "\copy public.naccho_lhd_replacement_stage (lhd_id,name,agency_type,address,city,state_code,postal_code,lat,lng,phone,website,source_url,public_health_services,raw_data) FROM '/tmp/naccho_replacement.csv' WITH (FORMAT csv, HEADER true)"

      - name: Atomically replace live NACCHO data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          DO $$
          DECLARE staged_count integer; coordinate_count integer; distinct_ids integer;
          BEGIN
            SELECT count(*), count(*) FILTER (WHERE nullif(lat,'') IS NOT NULL AND nullif(lng,'') IS NOT NULL), count(DISTINCT lhd_id)
              INTO staged_count, coordinate_count, distinct_ids
            FROM public.naccho_lhd_replacement_stage;
            IF staged_count <> 3410 OR coordinate_count <> 3410 OR distinct_ids <> 3410 THEN
              RAISE EXCEPTION 'NACCHO staging validation failed: rows %, coords %, ids %', staged_count, coordinate_count, distinct_ids;
            END IF;
          END $$;

          DELETE FROM public.naccho_lhd;
          INSERT INTO public.naccho_lhd (
            id, lhd_id, name, agency_type, address, city, state_code, postal_code,
            lat, lng, phone, website, source_url, public_health_services, raw_data,
            imported_at, updated_at
          )
          SELECT
            gen_random_uuid(), lhd_id, name, nullif(agency_type,''), nullif(address,''), nullif(city,''), state_code,
            nullif(postal_code,''), lat::double precision, lng::double precision, nullif(phone,''), nullif(website,''),
            nullif(source_url,''), COALESCE(NULLIF(public_health_services,''), '{}')::text[],
            COALESCE(NULLIF(raw_data,''), '{}')::jsonb, now(), now()
          FROM public.naccho_lhd_replacement_stage;

          DELETE FROM public.naccho_geocode_job;
          INSERT INTO public.naccho_geocode_job (
            job_key, status, total_rows, verified_rows, rejected_rows, invalid_rows, error_rows, pending_rows,
            details, started_at, completed_at, updated_at
          ) VALUES (
            'geocodio-enriched-replacement-20260816', 'completed', 3410, 3410, 0, 0, 0, 0,
            jsonb_build_object('source','County_Health_Departments_ALL_ENRICHED.xlsx','method','geocodio_enriched','replacement',true),
            now(), now(), now()
          );

          DELETE FROM public.naccho_import_log;
          INSERT INTO public.naccho_import_log (
            import_key, status, source_rows, database_rows, details, started_at, completed_at, updated_at
          ) VALUES (
            'geocodio-enriched-replacement-20260816', 'completed', 3410, 3410,
            jsonb_build_object('source','County_Health_Departments_ALL_ENRICHED.xlsx','geocoded_rows',3410,'replacement',true),
            now(), now(), now()
          );

          DO $$
          DECLARE live_count integer; coordinate_count integer; verified_count integer;
          BEGIN
            SELECT count(*), count(*) FILTER (WHERE lat IS NOT NULL AND lng IS NOT NULL),
                   count(*) FILTER (WHERE raw_data->>'geocode_status' = 'verified')
              INTO live_count, coordinate_count, verified_count
            FROM public.naccho_lhd;
            IF live_count <> 3410 OR coordinate_count <> 3410 OR verified_count <> 3410 THEN
              RAISE EXCEPTION 'NACCHO live validation failed: rows %, coords %, verified %', live_count, coordinate_count, verified_count;
            END IF;
          END $$;
          DROP TABLE public.naccho_lhd_replacement_stage;
          COMMIT;
          SQL

      - name: Final NACCHO verification
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -P pager=off -c "SELECT count(*) AS total_rows, count(*) FILTER (WHERE lat IS NOT NULL AND lng IS NOT NULL) AS geocoded_rows, count(*) FILTER (WHERE raw_data->>'geocode_status'='verified') AS verified_rows, count(DISTINCT state_code) AS states_and_territories FROM public.naccho_lhd;"
