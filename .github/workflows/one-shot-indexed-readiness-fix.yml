name: One-shot Indexed Providers readiness proof fix

on:
  push:
    paths:
      - .github/workflows/one-shot-indexed-readiness-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply readiness proof fix
        run: python occu-med-map/scripts/apply-indexed-provider-readiness-proof-fix.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated readiness fix
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs
          git commit -m "Fix Indexed Providers native readiness assertion"
          git push origin HEAD:nuclear/mapbox-native-runtime
