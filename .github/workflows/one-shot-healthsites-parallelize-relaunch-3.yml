name: One-shot safely parallelize Healthsites promotions

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-parallelize-relaunch-3.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel serial import run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/31861298076/cancel" || true
          for attempt in $(seq 1 30); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31861298076" --jq .status)"
            echo "Serial import status: ${status}"
            [[ "$status" == "completed" ]] && break
            sleep 2
          done

      - name: Patch workflow for parallel provider projects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          from pathlib import Path
          encoded = ''
          parallel = base64.b64decode(encoded).decode()
          path = Path('.github/workflows/import-healthsites-archive-to-provider-projects.yml')
          text = path.read_text()
          step_anchor = '      - name: Load and promote every provider project\n'
          anchor_pos = text.index(step_anchor)
          start = text.index('          for slot in $(seq 1 "$PROJECT_COUNT"); do\n', anchor_pos)
          end = text.index('          imported="$(jq \'[.projects[].rows] | add\' "$manifest")"\n', start)
          path.write_text(text[:start] + parallel + text[end:])
          PY
          rm -f .github/workflows/one-shot-healthsites-parallelize-relaunch.yml
          rm -f .github/workflows/one-shot-healthsites-parallelize-relaunch-3.yml
          git diff --check
          grep -n "process_slot\|declare -a pids\|promotion failed" .github/workflows/import-healthsites-archive-to-provider-projects.yml

      - name: Commit optimized workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Parallelize Healthsites provider project promotions"
          git push origin HEAD:main

      - name: Relaunch optimized all-country import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-healthsites-archive-to-provider-projects.yml --repo "$GITHUB_REPOSITORY" --ref main -f project_count=8 -f confirmation=IMPORT_ALL_COUNTRIES
