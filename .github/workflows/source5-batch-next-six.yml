name: Generate next six Source 5 countries

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - .github/workflows/source5-batch-next-six.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  SOURCE5_CODES: AG,AR,AM,AU,AT,AZ

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        country: [AG, AR, AM, AU, AT, AZ]

    steps:
      - name: Check out temporary international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate ${{ matrix.country }} facilities
        env:
          COUNTRY_CODES: ${{ matrix.country }}
          SQL_CHUNK_SIZE: '200'
        run: |
          set -euo pipefail
          node --check scripts/bootstrap-global-health-facilities.mjs
          node --check scripts/compact-source5-sql.mjs
          node scripts/bootstrap-global-health-facilities.mjs | tee /tmp/source5-${{ matrix.country }}.log
          COMPACT_CHUNK_SIZE=200 node scripts/compact-source5-sql.mjs
          mkdir -p /tmp/source5-output/${{ matrix.country }}
          cp -R data/generated/global-health-facilities/. /tmp/source5-output/${{ matrix.country }}/
          cp /tmp/source5-${{ matrix.country }}.log /tmp/source5-output/${{ matrix.country }}/run.log
          test "$(jq -r '.countries_requested | join(",")' /tmp/source5-output/${{ matrix.country }}/manifest.json)" = "${{ matrix.country }}"

      - name: Upload ${{ matrix.country }} generated dataset
        uses: actions/upload-artifact@v4
        with:
          name: source5-country-${{ matrix.country }}
          path: /tmp/source5-output
          if-no-files-found: error
          retention-days: 7

  publish:
    if: always() && github.actor != 'github-actions[bot]'
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out temporary international data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Download every successful country dataset
        uses: actions/download-artifact@v4
        with:
          pattern: source5-country-*
          path: data/generated/source5-countries
          merge-multiple: true

      - name: Build batch manifest
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'data/generated/source5-countries';
          const countries = fs.existsSync(root)
            ? fs.readdirSync(root).filter(code => fs.existsSync(path.join(root, code, 'manifest.json'))).sort()
            : [];
          const results = countries.map(code => {
            const manifest = JSON.parse(fs.readFileSync(path.join(root, code, 'manifest.json'), 'utf8'));
            const compact = JSON.parse(fs.readFileSync(path.join(root, code, 'compact', 'manifest.json'), 'utf8'));
            return {
              country_code: code,
              generated_at: manifest.generated_at,
              rows: manifest.total_rows,
              compact_files: compact.files.length,
              compact_rows: compact.total_rows,
            };
          });
          fs.writeFileSync(path.join(root, 'batch-manifest.json'), JSON.stringify({
            requested: process.env.SOURCE5_CODES.split(','),
            completed: countries,
            results,
            generated_at: new Date().toISOString(),
          }, null, 2) + '\n');
          NODE
          cat data/generated/source5-countries/batch-manifest.json

      - name: Publish country-specific datasets
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/generated/source5-countries
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: generate Source 5 AG AR AM AU AT AZ [skip ci]"
          git push origin HEAD:data/international-source-bootstrap

      - name: Upload consolidated batch
        uses: actions/upload-artifact@v4
        with:
          name: source5-next-six-consolidated
          path: data/generated/source5-countries
          if-no-files-found: error
          retention-days: 7
