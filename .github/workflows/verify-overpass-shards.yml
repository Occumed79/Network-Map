name: Verify Overture Neon Shards

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/verify-overpass-shards.yml

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OVERPASS_DATABASE_URL: ${{ secrets.OVERPASS_DATABASE_URL }}
      OVERPASS_DATABASE_URL_2: ${{ secrets.OVERPASS_DATABASE_URL_2 }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client library
        run: npm install --no-save pg@8
      - name: Verify both Overture shards read-only
        shell: bash
        run: |
          node <<'NODE'
          const { Client } = require('pg');

          async function inspect(label, connectionString, expectedCount) {
            if (!connectionString) throw new Error(`${label}: GitHub Actions secret is missing`);
            const client = new Client({ connectionString, application_name: 'network-map-overpass-verifier' });
            await client.connect();
            try {
              const schema = await client.query(`
                SELECT
                  to_regclass('public.provider_master_map_view') IS NOT NULL AS has_map_view,
                  to_regclass('public.medical_providers') IS NOT NULL AS has_medical_providers,
                  to_regclass('public.provider_schema_state') IS NOT NULL AS has_schema_state
              `);
              const hasMapView = schema.rows[0]?.has_map_view === true;
              const hasMedicalProviders = schema.rows[0]?.has_medical_providers === true;
              if (!hasMapView) throw new Error(`${label}: provider_master_map_view is missing`);
              if (!hasMedicalProviders) throw new Error(`${label}: medical_providers is missing`);

              const counts = await client.query(`
                SELECT
                  (SELECT count(*)::bigint FROM public.provider_master_map_view) AS canonical_total,
                  (SELECT count(*)::bigint FROM public.medical_providers) AS legacy_total,
                  (SELECT count(*)::bigint FROM public.provider_master_map_view WHERE lower(COALESCE(source_key, '')) = 'overture') AS overture_total
              `);
              const canonicalTotal = Number(counts.rows[0]?.canonical_total || 0);
              const legacyTotal = Number(counts.rows[0]?.legacy_total || 0);
              const overtureTotal = Number(counts.rows[0]?.overture_total || 0);
              if (canonicalTotal !== expectedCount) throw new Error(`${label}: expected ${expectedCount} canonical rows, got ${canonicalTotal}`);
              if (legacyTotal !== 0) throw new Error(`${label}: legacy medical_providers unexpectedly contains ${legacyTotal} rows`);
              if (overtureTotal !== canonicalTotal) throw new Error(`${label}: canonical view is not Overture-only (${overtureTotal}/${canonicalTotal})`);

              console.log(JSON.stringify({
                shard: label,
                connected: true,
                hasMapView,
                hasMedicalProviders,
                hasSchemaState: schema.rows[0]?.has_schema_state === true,
                canonicalTotal,
                legacyTotal,
                overtureTotal,
              }));
              return canonicalTotal;
            } finally {
              await client.end();
            }
          }

          (async () => {
            const first = await inspect('overpass-project-1', process.env.OVERPASS_DATABASE_URL, 335000);
            const second = await inspect('overpass-project-2', process.env.OVERPASS_DATABASE_URL_2, 148736);
            const combined = first + second;
            console.log(JSON.stringify({ combinedProviderMasterMapViewCount: combined }));
            if (combined !== 483736) throw new Error(`Combined Overture count changed: expected 483736, got ${combined}`);
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
