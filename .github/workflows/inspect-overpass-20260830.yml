name: Inspect OVERPASS Neon

on:
  push:
    branches:
      - overture-exact-import-20260830
    paths:
      - .github/workflows/inspect-overpass-20260830.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.OVERPASS_DATABASE_URL }}
    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes -qq postgresql-client
      - name: Inspect database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DATABASE_URL" == postgres* ]] || { echo 'OVERPASS_DATABASE_URL missing' >&2; exit 1; }
          echo "::add-mask::$DATABASE_URL"
          psql "$DATABASE_URL" -Atqc "SELECT 'db_size='||pg_size_pretty(pg_database_size(current_database()));"
          psql "$DATABASE_URL" -Atqc "SELECT 'provider_master='||count(*) FROM public.provider_master;"
          psql "$DATABASE_URL" -Atqc "SELECT 'overture_sources='||count(*) FROM public.provider_master_sources WHERE source_key='overture';"
          psql "$DATABASE_URL" -Atqc "SELECT 'provider_types='||count(*) FROM public.provider_master_types;"
          psql "$DATABASE_URL" -Atqc "SELECT relname||'='||pg_size_pretty(pg_total_relation_size(oid)) FROM pg_class WHERE relnamespace='public'::regnamespace AND relkind IN ('r','m') ORDER BY pg_total_relation_size(oid) DESC LIMIT 15;"
          psql "$DATABASE_URL" -Atqc "SELECT indexname||'='||indexdef FROM pg_indexes WHERE schemaname='public' AND tablename IN ('provider_master','provider_master_sources','provider_master_types') ORDER BY tablename,indexname;"
