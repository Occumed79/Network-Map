name: One-shot Mapbox native browser acceptance

on:
  push:
    paths:
      - .github/workflows/one-shot-mapbox-native-browser.yml

permissions:
  contents: read

jobs:
  browser:
    name: ${{ matrix.browser }} / ${{ matrix.route }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        route: [standard, p2]
    env:
      VITE_MAPBOX_TOKEN: pk.ci-network-map-placeholder
      VITE_MAPBOX_TOKEN_2: pk.ci-network-map-placeholder
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Install browser
        run: pnpm --filter @workspace/occu-med-map exec playwright install --with-deps ${{ matrix.browser }}
      - name: Start deterministic preview
        run: |
          pnpm --filter @workspace/occu-med-map exec vite preview --config vite.config.ts --host 127.0.0.1 --port 4173 > /tmp/network-map-preview.log 2>&1 &
          echo $! > /tmp/network-map-preview.pid
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 0.5
          done
          cat /tmp/network-map-preview.log
          exit 1
      - name: Run Mapbox-native browser acceptance
        env:
          NETWORK_MAP_BROWSER: ${{ matrix.browser }}
          NETWORK_MAP_ROUTE: ${{ matrix.route }}
          NETWORK_MAP_VIEWPORT: desktop
          NETWORK_MAP_CI_UI_URL: http://127.0.0.1:4173
        shell: bash
        run: timeout --signal=TERM --kill-after=10s 110s pnpm --filter @workspace/occu-med-map exec node scripts/ci-cross-browser-acceptance.mjs
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mapbox-native-${{ matrix.browser }}-${{ matrix.route }}
          path: |
            occu-med-map/test-results/hardening-browser
            /tmp/network-map-preview.log
          if-no-files-found: ignore
          retention-days: 7
