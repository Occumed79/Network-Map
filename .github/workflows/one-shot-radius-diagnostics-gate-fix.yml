name: One-shot Radius diagnostics visibility fix

on:
  push:
    paths:
      - .github/workflows/one-shot-radius-diagnostics-gate-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Fix Radius visibility gate
        run: python occu-med-map/scripts/apply-radius-diagnostics-gate-fix.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: General UI hardening
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Map synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Build frontend
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated Radius visibility fix
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/src/App.tsx occu-med-map/src/us-diagnostics-gate.css
          git commit -m "Keep Radius controls visible outside US diagnostics"
          git push origin HEAD:nuclear/mapbox-native-runtime
