name: One-shot remove Leaflet packages

on:
  push:
    paths:
      - .github/workflows/one-shot-remove-leaflet.yml

permissions:
  contents: write

jobs:
  remove-leaflet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/mapbox-native-runtime
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fix Mapbox native facade for Vite and remove stale Leaflet stylesheet
        shell: python
        run: |
          from pathlib import Path

          compat = Path('occu-med-map/src/mapboxNativeCompat.ts')
          text = compat.read_text()
          replacements = {
            'setView(center: LatLngExpression, zoom = this.zoom, options: Record<string, any> = {}): this {\n      this.center = normalizeLatLng(center); this.zoom = Number(zoom);': 'setView(center: LatLngExpression, zoom?: number, options: Record<string, any> = {}): this {\n      const resolvedZoom = zoom ?? this.zoom;\n      this.center = normalizeLatLng(center); this.zoom = Number(resolvedZoom);',
            'flyTo(center: LatLngExpression, zoom = this.zoom, options: Record<string, any> = {}): this {\n      this.center = normalizeLatLng(center); this.zoom = Number(zoom);': 'flyTo(center: LatLngExpression, zoom?: number, options: Record<string, any> = {}): this {\n      const resolvedZoom = zoom ?? this.zoom;\n      this.center = normalizeLatLng(center); this.zoom = Number(resolvedZoom);',
            'project(value: LatLngExpression, zoom = this.getZoom()): Point {\n      const p = normalizeLatLng(value); const native = activeNativeMap();\n      if (native && Math.abs(native.getZoom() - zoom) < 0.05)': 'project(value: LatLngExpression, zoom?: number): Point {\n      const resolvedZoom = zoom ?? this.getZoom();\n      const p = normalizeLatLng(value); const native = activeNativeMap();\n      if (native && Math.abs(native.getZoom() - resolvedZoom) < 0.05)',
            'const scale = 256 * Math.pow(2, zoom);': 'const scale = 256 * Math.pow(2, resolvedZoom);',
            'unproject(value: Point | PointTuple, zoom = this.getZoom()): LatLng {\n      const p = value instanceof Point ? value : new Point(Number(value[0]), Number(value[1])); const native = activeNativeMap();\n      if (native && Math.abs(native.getZoom() - zoom) < 0.05)': 'unproject(value: Point | PointTuple, zoom?: number): LatLng {\n      const resolvedZoom = zoom ?? this.getZoom();\n      const p = value instanceof Point ? value : new Point(Number(value[0]), Number(value[1])); const native = activeNativeMap();\n      if (native && Math.abs(native.getZoom() - resolvedZoom) < 0.05)',
          }
          for old, new in replacements.items():
            if old not in text:
              raise SystemExit(f'missing facade build patch target: {old[:80]}')
            text = text.replace(old, new, 1)
          compat.write_text(text)

          css = Path('occu-med-map/src/index.css')
          text = css.read_text()
          text = text.replace("@import 'leaflet/dist/leaflet.css';\n\n", "")
          text = text.replace('@import "leaflet/dist/leaflet.css";\n\n', '')
          css.write_text(text)
      - name: Remove Leaflet runtime and React bindings
        working-directory: occu-med-map
        run: pnpm remove leaflet react-leaflet @types/leaflet
      - name: Verify no installed Leaflet dependency or stylesheet remains
        run: |
          node -e "const p=require('./occu-med-map/package.json'); const all={...(p.dependencies||{}),...(p.devDependencies||{})}; for (const n of ['leaflet','react-leaflet','@types/leaflet']) if (all[n]) process.exit(1)"
          if grep -R -n -E "leaflet/dist/leaflet\.css|react-leaflet" occu-med-map/src; then echo 'Leaflet runtime/CSS reference remains' >&2; exit 1; fi
      - name: Typecheck frontend without Leaflet
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Build frontend without Leaflet
        run: pnpm --filter @workspace/occu-med-map build
      - name: Commit validated Leaflet removal
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/src/mapboxNativeCompat.ts occu-med-map/src/index.css occu-med-map/package.json pnpm-lock.yaml
          git commit -m "Remove Leaflet runtime dependencies"
          git push origin HEAD:nuclear/mapbox-native-runtime
