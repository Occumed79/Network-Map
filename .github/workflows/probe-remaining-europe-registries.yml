name: Probe remaining Europe registry interfaces

on:
  push:
    branches:
      - international-europe-wave-1
    paths:
      - ".github/workflows/probe-remaining-europe-registries.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/registry-probe
          cd /tmp/registry-probe
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Probe Armenia pagination and Iceland CSV export
        working-directory: /tmp/registry-probe
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');

          const countMatches = (text, needle) => (text.match(new RegExp(needle, 'g')) || []).length;

          (async () => {
            const browser = await chromium.launch({ headless: true });

            async function probeArmenia() {
              const page = await browser.newPage({ locale: 'en-US' });
              let facilityRequest = null;

              page.on('request', req => {
                if (req.url() !== 'https://www.uhif.am/en/hospitals' || req.method() !== 'POST') return;
                const body = req.postData() || '';
                if (/^\[\{\"page\":1,\"search\":\"\",\"region\":\"\",\"serviceId\":\"\",\"serviceGroupId\":\"\",\"lang\":\"en\"\}\]$/.test(body)) {
                  facilityRequest = { headers: req.headers(), body };
                }
              });

              await page.goto('https://www.uhif.am/en/hospitals', { waitUntil: 'networkidle', timeout: 90000 });
              await page.waitForTimeout(1500);
              console.log('ARMENIA HEADING=', await page.locator('h2').allTextContents());
              if (!facilityRequest) throw new Error('Could not capture UHIF facility server action');

              const headers = facilityRequest.headers;
              const action = headers['next-action'];
              const routerState = headers['next-router-state-tree'];
              if (!action) throw new Error('UHIF facility request did not expose next-action');
              console.log('ARMENIA ACTION=', action);

              for (const pageNum of [1, 2, 10, 56, 57, 58]) {
                const response = await page.evaluate(async ({ pageNum, action, routerState }) => {
                  const requestHeaders = {
                    'accept': 'text/x-component',
                    'content-type': 'text/plain;charset=UTF-8',
                    'next-action': action,
                  };
                  if (routerState) requestHeaders['next-router-state-tree'] = routerState;
                  const r = await fetch('/en/hospitals', {
                    method: 'POST',
                    headers: requestHeaders,
                    body: JSON.stringify([{ page: pageNum, search: '', region: '', serviceId: '', serviceGroupId: '', lang: 'en' }]),
                  });
                  return { status: r.status, text: await r.text() };
                }, { pageNum, action, routerState });
                const hospitalCount = countMatches(response.text, '\\"type\\":\\"hospital\\"');
                const coordinateCount = countMatches(response.text, '\\"lat\\":');
                console.log(`ARMENIA PAGE ${pageNum} status=${response.status} bytes=${response.text.length} hospitals=${hospitalCount} coords=${coordinateCount}`);
                fs.writeFileSync(`/tmp/registry-probe/armenia-page-${pageNum}.txt`, response.text);
              }

              fs.writeFileSync('/tmp/registry-probe/armenia.html', await page.content());
              await page.close();
            }

            async function probeIceland() {
              const page = await browser.newPage({ locale: 'is-IS', acceptDownloads: true });
              await page.goto('https://vefkerfi.landlaeknir.is/apex/f?p=2600:7', { waitUntil: 'domcontentloaded', timeout: 90000 });
              await page.waitForTimeout(1000);

              await Promise.all([
                page.waitForNavigation({ waitUntil: 'domcontentloaded', timeout: 90000 }),
                page.click('#leita'),
              ]);
              await page.waitForTimeout(1500);

              const body = await page.locator('body').innerText();
              const tables = await page.locator('table').count();
              const rows = await page.locator('table tr').count();
              const cells = await page.locator('td').count();
              console.log(`ICELAND SEARCH tables=${tables} rows=${rows} cells=${cells} bodyBytes=${body.length}`);
              console.log('ICELAND TABLE SAMPLE=', (await page.locator('table').allTextContents()).slice(0, 4));

              const controls = await page.locator('button,a,input').evaluateAll(els => els.map(e => ({
                tag: e.tagName,
                id: e.id,
                type: e.type || '',
                title: e.title || '',
                text: (e.innerText || e.value || '').trim(),
                href: e.href || '',
                onclick: e.getAttribute('onclick') || '',
              })).filter(x => /csv|hlaða|niður|download/i.test(`${x.id} ${x.title} ${x.text} ${x.href} ${x.onclick}`)));
              console.log('ICELAND DOWNLOAD CONTROLS=', JSON.stringify(controls, null, 2));

              const html = await page.content();
              fs.writeFileSync('/tmp/registry-probe/iceland-search.html', html);

              const candidates = page.locator('button,a').filter({ hasText: /Hlaða niður/i });
              const titleCandidates = page.locator('[title*="csv" i], [aria-label*="csv" i], [title*="Hlaða" i], [aria-label*="Hlaða" i]');
              let target = null;
              if (await candidates.count()) target = candidates.first();
              else if (await titleCandidates.count()) target = titleCandidates.first();

              if (target) {
                console.log('ICELAND DOWNLOAD TARGET=', await target.evaluate(e => ({ tag:e.tagName,id:e.id,title:e.title,text:(e.innerText||'').trim(),href:e.href||'',onclick:e.getAttribute('onclick')||'' })));
                try {
                  const downloadPromise = page.waitForEvent('download', { timeout: 30000 });
                  await target.click();
                  const download = await downloadPromise;
                  const filePath = '/tmp/registry-probe/' + (download.suggestedFilename() || 'iceland.csv');
                  await download.saveAs(filePath);
                  console.log('ICELAND DOWNLOADED=', filePath);
                  const sample = fs.readFileSync(filePath).toString('utf8').slice(0, 5000);
                  console.log('ICELAND CSV SAMPLE=', sample);
                } catch (e) {
                  console.log('ICELAND DOWNLOAD CLICK FAILED=', String(e));
                }
              } else {
                console.log('ICELAND DOWNLOAD TARGET=none');
              }

              await page.close();
            }

            await probeArmenia().catch(e => { console.error('ARMENIA ERROR', e); process.exitCode = 1; });
            await probeIceland().catch(e => { console.error('ICELAND ERROR', e); process.exitCode = 1; });
            await browser.close();
          })().catch(e => { console.error(e); process.exit(1); });
          NODE
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-europe-registry-probe
          path: /tmp/registry-probe/*
          if-no-files-found: warn
