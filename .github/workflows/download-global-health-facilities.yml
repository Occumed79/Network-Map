name: Verify Source 5 production repair deployment

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/download-global-health-facilities.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-production-deploy:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'data/international-source-bootstrap'
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Wait for production API to deploy repair commit
        shell: bash
        run: |
          set -euo pipefail
          expected="6cfd39339f0be8d4d59427ca3ae7829fae598f8b"
          mkdir -p source5-production-health
          for attempt in $(seq 1 40); do
            if curl --fail --silent --show-error --max-time 30 \
              https://network-map-tool-mqib.onrender.com/api/health \
              -o source5-production-health/health.json; then
              cat source5-production-health/health.json
              commit="$(jq -r '.commit // empty' source5-production-health/health.json)"
              if [ "$commit" = "$expected" ]; then
                echo "DEPLOYED" | tee source5-production-health/status.txt
                exit 0
              fi
              echo "Attempt $attempt: production commit is $commit; waiting for $expected"
            else
              echo "Attempt $attempt: health endpoint unavailable"
            fi
            sleep 15
          done
          echo "TIMED_OUT" | tee source5-production-health/status.txt
          exit 1

      - name: Upload production health result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source5-production-health
          path: source5-production-health
          if-no-files-found: warn
          retention-days: 1
