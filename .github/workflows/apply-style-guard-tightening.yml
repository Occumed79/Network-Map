name: Apply style guard tightening

on:
  push:
    branches:
      - hardening/ui-ownership-consolidation-v2

permissions:
  contents: write

concurrency:
  group: style-guard-tightening
  cancel-in-progress: true

jobs:
  tighten-and-validate:
    if: ${{ !contains(github.event.head_commit.message || '', '[style-guard-tightened]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out consolidation branch
        uses: actions/checkout@v4
        with:
          ref: hardening/ui-ownership-consolidation-v2
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tighten style ownership guard
        working-directory: occu-med-map
        run: node scripts/apply-style-guard-tightening.mjs

      - name: Validate tightened style ownership
        run: |
          node occu-med-map/scripts/ui-style-ownership-smoke.ts
          pnpm --filter @workspace/occu-med-map typecheck
          pnpm --filter @workspace/occu-med-map test:runtime-ownership
          pnpm --filter @workspace/occu-med-map test:sidebar-workspace-hardening
          pnpm --filter @workspace/occu-med-map test:general-ui-hardening
          pnpm --filter @workspace/occu-med-map build

      - name: Commit validated style guard
        shell: bash
        run: |
          rm -f occu-med-map/scripts/apply-style-guard-tightening.mjs
          rm -f .github/workflows/apply-style-guard-tightening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Tighten UI stylesheet ownership guard [style-guard-tightened]"
          git push origin HEAD:hardening/ui-ownership-consolidation-v2
