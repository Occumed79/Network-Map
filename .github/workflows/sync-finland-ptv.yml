name: Sync Finland Suomi.fi healthcare service locations

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-finland-ptv.yml"
      - "scripts/sync-finland-ptv.mjs"
      - "scripts/ptv-service-channel.mjs"
      - "scripts/official-registry-schema.sql"
      - "scripts/import-official-registry.sh"
  schedule:
    - cron: "15 11 * * 1,4"

permissions:
  contents: read
  id-token: write

concurrency:
  group: finland-ptv-registry-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and promote official Suomi.fi healthcare locations
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env: {}

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Resolve dedicated registry database
        uses: ./.github/actions/resolve-registry-database
        with:
          source: finland-ptv-healthcare

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "Dedicated registry database connection is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -Atqc "SELECT 1" >/dev/null

      - name: Fetch and normalize Finland healthcare service locations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/finland-ptv
          node scripts/sync-finland-ptv.mjs --output /tmp/finland-ptv/provider.tsv
          test -s /tmp/finland-ptv/provider.tsv
          expected=$(( $(wc -l < /tmp/finland-ptv/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/finland-ptv/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 500 )) || { echo "Only ${expected} geocoded Finland healthcare locations; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 400 )) || { echo "Only ${distinct_master} Finland canonical locations; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"
          echo "Finland healthcare service locations: ${expected}; canonical locations: ${distinct_master}"

      - name: Protect against an unexpected registry collapse
        shell: bash
        run: |
          set -euo pipefail
          previous="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.official_registry_providers" || echo 0)"
          previous="${previous:-0}"
          if (( previous >= 500 )); then
            minimum=$(( previous * 60 / 100 ))
            (( REGISTRY_EXPECTED >= minimum )) || {
              echo "Finland PTV source shrank from ${previous} to ${REGISTRY_EXPECTED}; refusing automatic replacement" >&2
              exit 1
            }
          fi

      - name: Import compact dedicated registry
        shell: bash
        env:
          REGISTRY_TSV: /tmp/finland-ptv/provider.tsv
          REGISTRY_EXPECTED: ${{ env.REGISTRY_EXPECTED }}
          REGISTRY_SOURCE_KEY: fi_ptv_healthcare
          REGISTRY_COUNTRY_CODE: FI
        run: scripts/import-official-registry.sh

      - name: Verify dedicated Finland PTV registry
        shell: bash
        run: |
          set -euo pipefail
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.official_registry_providers")"
          [[ "$mapped_count" == "$REGISTRY_EXPECTED" ]] || { echo "Registry count mismatch ${mapped_count}" >&2; exit 1; }
          (( mapped_count >= 400 )) || { echo "Only ${mapped_count} providers map-renderable" >&2; exit 1; }
          echo "Finland PTV map-renderable providers: ${mapped_count}"
