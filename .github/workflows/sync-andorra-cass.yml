name: Sync Andorra CASS healthcare providers

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-andorra-cass.yml"
      - "scripts/sync-andorra-cass.py"
      - "scripts/promote-staged-government-registry.sql"
  schedule:
    - cron: "35 11 * * 3"

permissions:
  contents: read

concurrency:
  group: andorra-cass-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Fetch and promote official Andorra CASS healthcare providers
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper and PostgreSQL client
        run: |
          python -m pip install --disable-pip-version-check beautifulsoup4
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "HEALTHSITES_DATABASE_URL is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          test "$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT to_regclass('public.provider_master_map_view') IS NOT NULL")" = "t"

      - name: Fetch and normalize CASS providers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/andorra-cass
          python scripts/sync-andorra-cass.py --output /tmp/andorra-cass/provider.tsv
          test -s /tmp/andorra-cass/provider.tsv
          expected=$(( $(wc -l < /tmp/andorra-cass/provider.tsv) - 1 ))
          distinct_master="$(tail -n +2 /tmp/andorra-cass/provider.tsv | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 120 )) || { echo "Only ${expected} Andorra CASS providers; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 100 )) || { echo "Only ${distinct_master} Andorra canonical providers; refusing promotion" >&2; exit 1; }
          echo "REGISTRY_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "REGISTRY_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"

      - name: Protect against unexpected registry collapse
        shell: bash
        run: |
          set -euo pipefail
          previous="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='ad_cass_healthcare'" || echo 0)"
          previous="${previous:-0}"
          if (( previous >= 120 )); then
            minimum=$(( previous * 60 / 100 ))
            (( REGISTRY_EXPECTED >= minimum )) || {
              echo "Andorra CASS source shrank from ${previous} to ${REGISTRY_EXPECTED}; refusing automatic replacement" >&2
              exit 1
            }
          fi

      - name: Stage normalized Andorra rows
        shell: bash
        run: |
          set -euo pipefail
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS public.source5_import_staging (
              source_record_id text PRIMARY KEY,
              source_url text,
              name text NOT NULL,
              normalized_name text,
              address_line1 text,
              formatted_address text,
              city text,
              state_region text,
              postal_code text,
              country_code text NOT NULL,
              lat double precision NOT NULL,
              lng double precision NOT NULL,
              phone text,
              website text,
              email text,
              primary_provider_type text,
              capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
              quality_score numeric,
              master_key text NOT NULL
            );
            TRUNCATE public.source5_import_staging;
          "
          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" \
            < /tmp/andorra-cass/provider.tsv
          actual="$(psql "$TARGET_DATABASE_URL" -Atqc 'SELECT count(*) FROM public.source5_import_staging')"
          [[ "$actual" == "$REGISTRY_EXPECTED" ]] || { echo "Staging mismatch ${actual} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }

      - name: Promote Andorra into canonical registry
        shell: bash
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v expected="$REGISTRY_EXPECTED" \
            -v expected_master="$REGISTRY_EXPECTED_MASTER" \
            -v source_key="ad_cass_healthcare" \
            -v country_code="AD" \
            -v source_prefix_pattern="ad-cass:%" \
            -v source_display_name="Andorra CASS — Contracted Healthcare Providers" \
            -v data_source_name="Andorra CASS Healthcare" \
            -v source_notes="Official Caixa Andorrana de Seguretat Social directory of healthcare professionals and contracted providers, including specialties, professional addresses, parishes and phone numbers" \
            -f scripts/promote-staged-government-registry.sql

      - name: Verify production Andorra source
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='ad_cass_healthcare'")"
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_map_view WHERE source_key='ad_cass_healthcare' AND country_code='AD' AND lat IS NOT NULL AND lng IS NOT NULL")"
          [[ "$source_count" == "$REGISTRY_EXPECTED" ]] || { echo "Andorra lineage mismatch ${source_count} vs ${REGISTRY_EXPECTED}" >&2; exit 1; }
          (( mapped_count >= 100 )) || { echo "Only ${mapped_count} Andorra providers map-renderable" >&2; exit 1; }
          echo "Andorra CASS source records: ${source_count}"
          echo "Andorra CASS map-renderable providers: ${mapped_count}"
