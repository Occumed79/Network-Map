name: Sync frontend manifest
on:
  push:
    branches: [hardening/provider-coordinate-integrity]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message || '', '[manifest-synced]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/provider-coordinate-integrity
          fetch-depth: 0
      - name: Restore lockfile-compatible canonical frontend manifest
        run: |
          git fetch origin hardening/provider-search-authority
          git show FETCH_HEAD:occu-med-map/package.json > occu-med-map/package.json
      - name: Commit
        run: |
          rm -f .github/workflows/sync-frontend-manifest.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Sync frontend manifest to frozen lockfile [manifest-synced]"
          git push origin HEAD:hardening/provider-coordinate-integrity
