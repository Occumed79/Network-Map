name: Complete Phase 2 clean repair

on:
  push:
    branches:
      - agent/phase2-clean-repair
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase2-clean-repair

      - name: Apply clean architectural repair
        run: python .github/scripts/phase2_clean_repair.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused regression suites
        run: |
          pnpm --filter @workspace/api-server test:provider-explorer
          pnpm --filter @workspace/occu-med-map test:p2-map

      - name: Typecheck and build
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/occu-med-map build
          pnpm --filter @workspace/api-server build

      - name: Commit verified repair
        shell: bash
        run: |
          rm -f .github/workflows/phase2-clean-repair.yml .github/scripts/phase2_clean_repair.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete and verify Phase 2 clean repair"
          git push origin HEAD:agent/phase2-clean-repair
