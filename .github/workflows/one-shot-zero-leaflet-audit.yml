name: One-shot native provider dataset migration

on:
  push:
    paths:
      - .github/workflows/one-shot-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Migrate persistent provider datasets to native Mapbox
        run: python occu-med-map/scripts/migrate-provider-datasets-native.py
      - name: Fix upload-function section boundary
        shell: python
        run: |
          from pathlib import Path
          path = Path('occu-med-map/src/App.tsx')
          text = path.read_text()
          broken = '  async function uploadClinicChunk  async function uploadClinicChunk'
          if broken not in text:
              raise SystemExit('expected duplicated uploadClinicChunk boundary was not found')
          path.write_text(text.replace(broken, '  async function uploadClinicChunk', 1))
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Native synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: Inventory remaining compatibility
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Commit validated provider dataset migration
        run: |
          rm -f occu-med-map/scripts/migrate-provider-datasets-native.py
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Render persistent provider datasets with native Mapbox"
          git push origin HEAD:nuclear/remove-leaflet-compat
