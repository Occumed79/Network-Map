name: Production Browser Smoke

on:
  pull_request:
    branches:
      - main
    paths:
      - occu-med-map/scripts/production-ui-smoke.mjs
      - .github/workflows/production-browser-smoke.yml
  workflow_dispatch:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-browser-smoke-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: true

jobs:
  verify-production:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Capture Render deployment identity
        id: deployment
        env:
          NETWORK_MAP_URL: https://network-map-tool-mqib.onrender.com
          EXPECTED_COMMIT: ${{ github.event.pull_request.base.sha || github.event.workflow_run.head_sha || github.sha }}
        run: |
          mkdir -p test-results/production-smoke
          cache_buster="$(date +%s)-${GITHUB_RUN_ATTEMPT}"
          curl --fail-with-body --location --silent --show-error \
            --dump-header test-results/production-smoke/root-headers.txt \
            --output test-results/production-smoke/root.html \
            "${NETWORK_MAP_URL}/?deployment-identity=${cache_buster}" || true
          curl --fail-with-body --location --silent --show-error \
            --dump-header test-results/production-smoke/health-headers.txt \
            --output test-results/production-smoke/health.json \
            "${NETWORK_MAP_URL}/api/health?deployment-identity=${cache_buster}" || true
          node --input-type=module <<'NODE'
          import { appendFile, readFile, writeFile } from 'node:fs/promises';

          async function optional(path) {
            try { return await readFile(path, 'utf8'); } catch { return ''; }
          }

          const rootHtml = await optional('test-results/production-smoke/root.html');
          const healthText = await optional('test-results/production-smoke/health.json');
          let health = null;
          try { health = healthText ? JSON.parse(healthText) : null; } catch {}

          const expectedCommit = process.env.EXPECTED_COMMIT || '';
          const deployedCommit = health?.commit || '';
          const title = rootHtml.match(/<title>([^<]*)<\/title>/i)?.[1] || '';
          const expectedTitlePresent = rootHtml.includes('Occu-Med Network Management Map');
          const commitMatches = Boolean(expectedCommit && deployedCommit === expectedCommit);
          const ready = Boolean(
            health?.ok === true
            && health?.service === 'network-map'
            && expectedTitlePresent
            && commitMatches,
          );
          const identity = {
            ready,
            expectedCommit,
            deployedCommit: deployedCommit || null,
            commitMatches,
            health,
            title,
            expectedTitlePresent,
            tanStackStarterPresent: rootHtml.includes('TanStack Start Starter'),
            networkMapNotFoundPresent: rootHtml.includes('Network Map — Page Not Found'),
            rootBytes: Buffer.byteLength(rootHtml),
          };
          await writeFile(
            'test-results/production-smoke/deployment-identity.json',
            `${JSON.stringify(identity, null, 2)}\n`,
          );
          await appendFile(process.env.GITHUB_OUTPUT, `ready=${ready}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `expected_commit=${expectedCommit}\n`);
          await appendFile(process.env.GITHUB_OUTPUT, `deployed_commit=${deployedCommit}\n`);
          console.log(JSON.stringify(identity, null, 2));
          NODE

      - name: Reject stale or incorrect Render deployment
        if: steps.deployment.outputs.ready != 'true'
        run: |
          echo "Render is not serving the expected Network Map commit."
          echo "Expected: ${{ steps.deployment.outputs.expected_commit }}"
          echo "Deployed: ${{ steps.deployment.outputs.deployed_commit || 'unknown' }}"
          echo "Open the Render service settings, confirm Branch is main and Auto-Deploy is enabled, then deploy the latest commit."
          exit 1

      - name: Install Chromium
        if: steps.deployment.outputs.ready == 'true'
        run: pnpm --filter @workspace/occu-med-map exec playwright install --with-deps chromium

      - name: Verify deployed Network Map
        if: steps.deployment.outputs.ready == 'true'
        env:
          NETWORK_MAP_SMOKE_URL: https://network-map-tool-mqib.onrender.com
          NETWORK_MAP_EXPECT_HARDENING: "1"
          NETWORK_MAP_EXPECTED_COMMIT: ${{ steps.deployment.outputs.expected_commit }}
          NETWORK_MAP_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/test-results/production-smoke
        run: pnpm --filter @workspace/occu-med-map test:ui-production

      - name: Upload production browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-evidence-${{ github.run_id }}
          path: test-results/production-smoke
          if-no-files-found: ignore
          retention-days: 7
