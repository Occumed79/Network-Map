name: One-shot native Map Tools migration

on:
  push:
    paths:
      - .github/workflows/one-shot-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Repair U.S. diagnostics channel typing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('occu-med-map/src/usDiagnosticsNativeMapRuntime.ts')
          text = path.read_text()
          old = '''const collections: Record<Channel, GeoJSON.FeatureCollection> = Object.fromEntries(\n  CHANNELS.map((channel) => [channel, { type: "FeatureCollection", features: [] }]),\n) as Record<Channel, GeoJSON.FeatureCollection>;'''
          new = '''const collections: Record<Channel, GeoJSON.FeatureCollection> = {\n  states: { type: "FeatureCollection", features: [] },\n  population: { type: "FeatureCollection", features: [] },\n  cities: { type: "FeatureCollection", features: [] },\n  timezones: { type: "FeatureCollection", features: [] },\n  saved: { type: "FeatureCollection", features: [] },\n  address: { type: "FeatureCollection", features: [] },\n};'''
          if old not in text:
              raise SystemExit('U.S. diagnostics typing anchor missing or already changed')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Migrate Map Tools and From-To routing to native Mapbox
        run: python occu-med-map/scripts/migrate-map-tools-native.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Native synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: General UI hardening
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Inventory remaining compatibility
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Commit validated native Map Tools migration
        run: |
          rm -f occu-med-map/scripts/migrate-map-tools-native.py
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Run Map Tools directly on native Mapbox"
          git push origin HEAD:nuclear/remove-leaflet-compat
