name: Resolve Map Neon host

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - .github/workflows/download-who-hidr-healthcare.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Resolve Map production Neon host
        run: |
          set -euo pipefail
          mkdir -p data/status
          host="ep-autumn-hill-atgvqg3e-pooler.c-9.us-east-1.aws.neon.tech"
          {
            echo "[$host]"
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u
          } > data/status/map-neon-host-ips.txt
          cat data/status/map-neon-host-ips.txt

      - name: Publish resolved addresses
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/map-neon-host-ips.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: publish Map Neon host addresses [skip ci]"
          git push origin HEAD:data/international-source-bootstrap
