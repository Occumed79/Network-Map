name: One-shot final MapScene root removal

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - name: Apply final MapScene root migration
        run: python occu-med-map/scripts/migrate-final-mapscene-root.py
      - run: pnpm install --frozen-lockfile
      - name: Typecheck frontend
        run: pnpm --filter @workspace/occu-med-map typecheck
      - name: Production build
        run: pnpm --filter @workspace/occu-med-map build
      - name: Native synchronization hardening
        run: pnpm --filter @workspace/occu-med-map test:map-synchronization-hardening
      - name: Provider Explorer hardening
        run: pnpm --filter @workspace/occu-med-map test:provider-explorer-hardening
      - name: General UI hardening
        run: pnpm --filter @workspace/occu-med-map test:general-ui-hardening
      - name: Zero-compat audit
        working-directory: occu-med-map
        run: pnpm exec tsx scripts/zero-leaflet-architecture-audit.ts
      - name: Verify runtime compatibility is physically gone
        run: |
          test ! -e occu-med-map/src/mapSceneRuntime.ts
          test ! -e occu-med-map/src/features/networkMap/mapLayerHelpers.ts
          ! grep -RInE 'from ["'"'].*mapSceneRuntime["'"']|MapScene\.|mapRef\.current|multiDropLayerRef' occu-med-map/src
      - name: Commit validated removal
        run: |
          rm -f occu-med-map/scripts/migrate-final-mapscene-root.py
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add -A
          git commit -m "Remove final MapScene runtime ownership"
          git push origin HEAD:nuclear/remove-leaflet-compat
