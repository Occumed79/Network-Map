name: Complete Phase 2 clean repair

on:
  push:
    branches:
      - agent/phase2-clean-repair
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  repair-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: agent/phase2-clean-repair

      - name: Apply clean architectural repair
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one match in {path}, found {count}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          shell_path = 'occu-med-map/src/PhaseTwoShell.tsx'
          retitle_block = '''function retitleLegacyMapTools(): void {
            document.querySelectorAll<HTMLElement>('.occumed-map-tools-panel .occumed-basemap-title').forEach((node) => {
              node.textContent = 'Navigation & Routing';
              node.closest('.occumed-map-tools-panel')?.classList.add('p2-navigation-tools');
            });

            const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT);
            let current = walker.nextNode();
            while (current) {
              const element = current as HTMLElement;
              const text = element.children.length === 0 ? (element.textContent || '').trim() : '';
              if (/map tools/i.test(text) && /hover\\s*\\/\\s*focus/i.test(text)) {
                element.textContent = 'Navigation & routing';
                element.classList.add('p2-repurposed-map-tools-label');
              }
              current = walker.nextNode();
            }
          }

          '''
          observer_effect = '''  useEffect(() => {
            retitleLegacyMapTools();
            const observer = new MutationObserver(() => retitleLegacyMapTools());
            observer.observe(document.body, { childList: true, subtree: true });
            const timeout = window.setTimeout(() => observer.disconnect(), 10_000);
            return () => {
              window.clearTimeout(timeout);
              observer.disconnect();
            };
          }, []);

          '''
          replace_once(shell_path, retitle_block, '')
          replace_once(shell_path, observer_effect, '')

          replace_once(
              'occu-med-map/src/main.tsx',
              '    import("./phaseTwoPreviewIsolation"),\n',
              '',
          )
          replace_once(
              'occu-med-map/src/phaseTwoLayerModel.ts',
              "    p2: '1',\n",
              '',
          )
          replace_once(
              'api-server/src/routes/index.ts',
              'import providerExplorerP2ReadRouter from "./providerExplorerP2Read";\n',
              '',
          )
          replace_once(
              'api-server/src/routes/index.ts',
              'router.use(providerExplorerP2ReadRouter);\n',
              '',
          )

          provider_path = Path('api-server/src/routes/providerExplorer.ts')
          provider = provider_path.read_text()
          if 'mp.created_at AS imported_at' in provider:
              raise SystemExit('Legacy provider projection still references mp.created_at')
          required_projection = 'COALESCE(mp.scraped_at, mp.updated_at) AS imported_at'
          if required_projection not in provider:
              raise SystemExit('Correct legacy imported_at projection is missing')
          if 'export function legacyProviderSelectForTest' not in provider:
              marker = '\nfunction addSharedFilters('
              if provider.count(marker) != 1:
                  raise SystemExit('Could not locate addSharedFilters insertion point')
              provider = provider.replace(
                  marker,
                  '\nexport function legacyProviderSelectForTest(): string { return selectSql("legacy"); }\n\nfunction addSharedFilters(',
                  1,
              )
              provider_path.write_text(provider)

          smoke_path = Path('api-server/scripts/provider-explorer-smoke.ts')
          smoke = smoke_path.read_text()
          smoke = smoke.replace(
              "import { buildLiveCacheKeyForTest, buildStoredWhereForTest } from '../src/routes/providerExplorer';",
              "import { buildLiveCacheKeyForTest, buildStoredWhereForTest, legacyProviderSelectForTest } from '../src/routes/providerExplorer';",
          )
          smoke = smoke.replace("import { p2LegacyProviderSelectForTest } from '../src/routes/providerExplorerP2Read';\n", '')
          smoke = smoke.replace('p2LegacyProviderSelectForTest()', 'legacyProviderSelectForTest()')
          if 'providerExplorerP2Read' in smoke or 'p2LegacyProviderSelectForTest' in smoke:
              raise SystemExit('Provider Explorer smoke test still references the deleted compatibility route')
          smoke_path.write_text(smoke)

          p2_smoke_path = Path('occu-med-map/scripts/phase-two-map-smoke.ts')
          p2_smoke = p2_smoke_path.read_text()
          p2_smoke = p2_smoke.replace("assert.equal(params.get('p2'), '1');", "assert.equal(params.get('p2'), null);")
          preview_block = '''
          const previewIsolation = readFileSync(resolve(here, '../src/phaseTwoPreviewIsolation.ts'), 'utf8');
          assert.match(previewIsolation, /p2-preview/);
          assert.match(previewIsolation, /\\/api\\/provider-layers\\//);
          assert.match(previewIsolation, /url\\.searchParams\\.get\\('p2'\\) !== '1'/);
          assert.match(previewIsolation, /PreviewNoopMutationObserver/);
          assert.match(previewIsolation, /window as Window & \\{ MutationObserver/);
          assert.match(previewIsolation, /disablePreviewMutationObservers\\(\\)/);
          assert.doesNotMatch(previewIsolation, /document\\.querySelector/);
          '''
          if preview_block not in p2_smoke:
              raise SystemExit('Could not locate obsolete preview-isolation smoke block')
          p2_smoke = p2_smoke.replace(preview_block, '\n')
          p2_smoke = p2_smoke.replace(
              'assert.match(main, /import\\("\\.\\/phaseTwoPreviewIsolation"\\)/);',
              'assert.doesNotMatch(main, /phaseTwoPreviewIsolation/);',
          )
          shell_guard_marker = 'assert.doesNotMatch(shell, /visibleCapped:\\s*true/);\n'
          shell_guards = '''assert.doesNotMatch(shell, /visibleCapped:\\s*true/);
          assert.doesNotMatch(shell, /retitleLegacyMapTools/);
          assert.doesNotMatch(shell, /createTreeWalker/);
          assert.doesNotMatch(shell, /new MutationObserver/);
          assert.doesNotMatch(shell, /document\\.body/);
          '''
          if shell_guard_marker not in p2_smoke:
              raise SystemExit('Could not locate Phase Two shell guard insertion point')
          p2_smoke = p2_smoke.replace(shell_guard_marker, shell_guards, 1)
          backend_guard_marker = "const diagnosticsGate = readFileSync(resolve(here, '../src/usDiagnosticsGate.ts'), 'utf8');"
          backend_guards = '''const routeIndex = readFileSync(resolve(here, '../../api-server/src/routes/index.ts'), 'utf8');
          assert.doesNotMatch(routeIndex, /providerExplorerP2Read/);

          const providerExplorer = readFileSync(resolve(here, '../../api-server/src/routes/providerExplorer.ts'), 'utf8');
          assert.match(providerExplorer, /COALESCE\\(mp\\.scraped_at, mp\\.updated_at\\) AS imported_at/);
          assert.doesNotMatch(providerExplorer, /mp\\.created_at AS imported_at/);

          const diagnosticsGate = readFileSync(resolve(here, '../src/usDiagnosticsGate.ts'), 'utf8');'''
          if backend_guard_marker not in p2_smoke:
              raise SystemExit('Could not locate backend guard insertion point')
          p2_smoke = p2_smoke.replace(backend_guard_marker, backend_guards, 1)
          p2_smoke = p2_smoke.replace(
              "console.log('P2 preview toggle is explicit, aborted loading clears, paging remains uncapped, and stable production boot is unchanged');",
              "console.log('P2 preview uses the unified provider route, avoids global runtime patches, and keeps loading and pagination stable');",
          )
          p2_smoke_path.write_text(p2_smoke)

          for obsolete in [
              Path('occu-med-map/src/phaseTwoPreviewIsolation.ts'),
              Path('api-server/src/routes/providerExplorerP2Read.ts'),
          ]:
              if obsolete.exists():
                  obsolete.unlink()

          workflow = Path('.github/workflows/phase2-clean-repair.yml')
          if workflow.exists():
              workflow.unlink()

          forbidden = {
              'occu-med-map/src/PhaseTwoShell.tsx': ['retitleLegacyMapTools', 'createTreeWalker', 'new MutationObserver'],
              'occu-med-map/src/main.tsx': ['phaseTwoPreviewIsolation'],
              'api-server/src/routes/index.ts': ['providerExplorerP2Read'],
          }
          for path, patterns in forbidden.items():
              text = Path(path).read_text()
              for pattern in patterns:
                  if pattern in text:
                      raise SystemExit(f'Forbidden pattern {pattern!r} remains in {path}')
          PY

          if grep -R --line-number --exclude-dir=node_modules --exclude-dir=.git -E 'phaseTwoPreviewIsolation|providerExplorerP2Read|mp\.created_at AS imported_at' occu-med-map api-server; then
            echo "Obsolete repair shims or broken SQL references remain" >&2
            exit 1
          fi

      - name: Set up Node and pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run focused regression suites
        run: |
          pnpm --filter @workspace/api-server test:provider-explorer
          pnpm --filter @workspace/occu-med-map test:p2-map

      - name: Typecheck and build
        run: |
          pnpm run typecheck
          pnpm --filter @workspace/occu-med-map build
          pnpm --filter @workspace/api-server build

      - name: Commit verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete and verify Phase 2 clean repair"
          git push origin HEAD:agent/phase2-clean-repair
