name: Import WHO HIDR healthcare inequality data

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/import-who-hidr-healthcare.py
      - .github/workflows/download-who-hidr-healthcare.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install importer dependencies
        run: python -m pip install --disable-pip-version-check requests openpyxl "psycopg[binary]"

      - name: Download, normalize, and import official WHO HIDR healthcare datasets
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          POSTGRES_DATABASE_URL: ${{ secrets.POSTGRES_DATABASE_URL }}
        run: python scripts/import-who-hidr-healthcare.py

      - name: Publish verified import status
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/status/who-hidr-healthcare-import-summary.json data/status/who-hidr-healthcare-import-status.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "data: publish WHO HIDR healthcare import status [skip ci]"
          git push origin HEAD:data/international-source-bootstrap

      - name: Upload WHO HIDR healthcare import diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-hidr-healthcare-import
          path: data/generated/who-hidr-healthcare
          if-no-files-found: warn
          retention-days: 7
