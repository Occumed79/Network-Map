name: Temporary Production Verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe-production:
    name: Probe deployed Render identity
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe legacy and current deployment identity endpoints
        env:
          NETWORK_MAP_PRODUCTION_URL: https://network-map-tool-mqib.onrender.com
          EXPECTED_GIT_SHA: f1f13bb537e7b6075d4064bca8c356e8ea7649e4
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production-probe
          printf '%s\n' "$EXPECTED_GIT_SHA" > production-probe/expected-sha.txt
          for endpoint in health revision ready; do
            curl --location --silent --show-error \
              --dump-header "production-probe/${endpoint}-headers.txt" \
              --output "production-probe/${endpoint}-body.txt" \
              "${NETWORK_MAP_PRODUCTION_URL}/api/${endpoint}?probe=${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true
          done
          echo 'Expected main:' "$EXPECTED_GIT_SHA"
          echo '--- /api/health ---'
          cat production-probe/health-body.txt || true
          echo
          echo '--- /api/revision ---'
          head -c 500 production-probe/revision-body.txt || true
          echo
          echo '--- /api/ready ---'
          head -c 500 production-probe/ready-body.txt || true
          echo
      - name: Upload production probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporary-production-probe
          path: production-probe
          if-no-files-found: ignore
          retention-days: 7
