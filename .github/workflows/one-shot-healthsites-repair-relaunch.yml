name: One-shot repair and relaunch Healthsites import

on:
  push:
    paths:
      - '.github/workflows/one-shot-healthsites-repair-relaunch.yml'

permissions:
  actions: write
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cancel the stuck import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/runs/31857225869/cancel" || true
          for attempt in $(seq 1 30); do
            status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/31857225869" --jq .status)"
            echo "Old import status: ${status}"
            [[ "$status" == "completed" ]] && break
            sleep 2
          done

      - name: Patch the bulk promotion hot path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          promote = Path('scripts/promote-healthsites-world.sql')
          text = promote.read_text()
          marker = "INSERT INTO public.provider_master_sources (\n"
          patch = """-- The source-link promotion performs one lookup per staged facility.  The\n-- canonical schema previously lacked this lookup index, turning a ~144k-row\n-- project into billions of stage-table comparisons.  Create it after the\n-- stage/master load and refresh planner statistics before linking sources.\nCREATE INDEX IF NOT EXISTS idx_provider_stage_records_source_record\n  ON public.provider_stage_records(source_key, source_record_id);\n\nANALYZE public.provider_stage_records;\nANALYZE public.provider_raw_records;\n\n"""
          if 'idx_provider_stage_records_source_record' not in text:
              if marker not in text:
                  raise SystemExit('provider_master_sources insertion marker not found')
              text = text.replace(marker, patch + marker, 1)
              promote.write_text(text)

          migration = Path('api-server/src/db/migrations/20260806_database_lifecycle.sql')
          mtext = migration.read_text()
          migration_patch = """\n-- Required by source promotion lookups on bulk provider datasets.\nCREATE INDEX IF NOT EXISTS idx_provider_stage_records_source_record\n  ON public.provider_stage_records(source_key, source_record_id);\n"""
          if 'idx_provider_stage_records_source_record' not in mtext:
              migration.write_text(mtext.rstrip() + migration_patch + '\n')
          PY

          rm -f .github/workflows/one-shot-healthsites-progress-probe.yml
          rm -f .github/workflows/one-shot-healthsites-progress-probe2.yml
          rm -f .github/workflows/one-shot-healthsites-repair-relaunch.yml

          git diff --check
          git diff -- scripts/promote-healthsites-world.sql api-server/src/db/migrations/20260806_database_lifecycle.sql

      - name: Commit the permanent repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Repair already present"
          else
            git commit -m "Fix Healthsites bulk source-link promotion performance"
            git push origin HEAD:main
          fi

      - name: Relaunch all-country Healthsites import
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run import-healthsites-archive-to-provider-projects.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f project_count=8 \
            -f confirmation=IMPORT_ALL_COUNTRIES
