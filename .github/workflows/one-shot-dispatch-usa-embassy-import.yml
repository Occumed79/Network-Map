name: One-shot dispatch USA Embassy provider import

on:
  push:
    paths:
      - .github/workflows/one-shot-dispatch-usa-embassy-import.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch permanent Embassy importer
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Trigger the permanent importer after the provider-type dedup fix.
          curl --fail-with-body \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/import-usa-embassy-providers-to-provider-projects.yml/dispatches" \
            --data '{"ref":"main","inputs":{"confirmation":"IMPORT_EMBASSY_PROVIDERS"}}'
          echo "Permanent Embassy import dispatched."
