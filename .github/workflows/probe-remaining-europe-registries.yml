name: Probe remaining Europe registry interfaces

on:
  push:
    branches:
      - international-europe-wave-1
    paths:
      - ".github/workflows/probe-remaining-europe-registries.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          mkdir -p /tmp/registry-probe
          cd /tmp/registry-probe
          npm init -y >/dev/null
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Trace Iceland export and Armenia facility API
        working-directory: /tmp/registry-probe
        run: |
          node <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch({headless:true});

            async function probeIceland() {
              const page = await browser.newPage({locale:'is-IS', acceptDownloads:true});
              const network = [];
              page.on('response', async r => {
                if (r.url().includes('landlaeknir.is') && ['xhr','fetch','document'].includes(r.request().resourceType())) {
                  network.push({status:r.status(), type:r.request().resourceType(), method:r.request().method(), url:r.url()});
                }
              });
              await page.goto('https://vefkerfi.landlaeknir.is/apex/f?p=2600:7', {waitUntil:'domcontentloaded', timeout:90000});
              await page.waitForTimeout(1500);
              fs.writeFileSync('/tmp/registry-probe/iceland-before.html', await page.content());
              console.log('ICELAND initial title=', await page.title());
              console.log('ICELAND initial buttons=', await page.locator('button').evaluateAll(els => els.map(e => ({id:e.id,title:e.title,aria:e.getAttribute('aria-label'),text:(e.innerText||'').trim(),onclick:e.getAttribute('onclick')}))));
              console.log('ICELAND initial hidden=', await page.locator('input[type=hidden]').evaluateAll(els => els.filter(e=>/^P7_/.test(e.id)).map(e=>({id:e.id,value:e.value})).filter(x=>/TAKKI|ROWS|TUNGUMAL/.test(x.id))));
              await page.locator('#leita').click();
              await page.waitForLoadState('domcontentloaded');
              await page.waitForTimeout(1800);
              console.log('ICELAND result url=', page.url());
              console.log('ICELAND result title=', await page.title());
              console.log('ICELAND result tables=', await page.locator('table').count(), 'rows=', await page.locator('table tr').count());
              console.log('ICELAND first rows=', await page.locator('table tr').evaluateAll(rows => rows.slice(0,8).map(r => [...r.querySelectorAll('th,td')].map(c => c.innerText.trim()))));
              console.log('ICELAND result buttons=', await page.locator('button').evaluateAll(els => els.map(e => ({id:e.id,title:e.title,aria:e.getAttribute('aria-label'),text:(e.innerText||'').trim(),onclick:e.getAttribute('onclick')}))));
              console.log('ICELAND csv-ish links=', await page.locator('a').evaluateAll(as => as.map(a=>({text:(a.innerText||'').trim(),href:a.href,title:a.title})).filter(x=>/csv|hlaða|download/i.test((x.text||'')+(x.href||'')+(x.title||'')))));
              const downloadCandidates = page.locator('button,a').filter({hasText:/Hlaða niður|Download/i});
              console.log('ICELAND download text candidates=', await downloadCandidates.count());
              for (const selector of ['button[title*="Hlaða"]','button[aria-label*="Hlaða"]','a[title*="Hlaða"]','button[title*="csv" i]','a[href*="csv" i]']) {
                const loc = page.locator(selector);
                if (await loc.count()) {
                  console.log('ICELAND trying download selector=', selector);
                  try {
                    const [download] = await Promise.all([page.waitForEvent('download',{timeout:10000}), loc.first().click()]);
                    const save='/tmp/registry-probe/iceland.csv';
                    await download.saveAs(save);
                    console.log('ICELAND DOWNLOAD success filename=', download.suggestedFilename(), 'bytes=', fs.statSync(save).size);
                    console.log('ICELAND CSV HEAD=', fs.readFileSync(save,'utf8').slice(0,2500));
                    break;
                  } catch (e) { console.log('ICELAND download attempt failed=', selector, String(e)); }
                }
              }
              console.log('ICELAND network=', network);
              fs.writeFileSync('/tmp/registry-probe/iceland-after.html', await page.content());
              await page.close();
            }

            async function probeArmenia() {
              const page = await browser.newPage({locale:'en-US'});
              const traffic=[];
              page.on('response', async r => {
                if (!r.url().includes('uhif.am')) return;
                const type=r.request().resourceType();
                if (!['xhr','fetch','document'].includes(type)) return;
                const item={status:r.status(),type,method:r.request().method(),url:r.url(),requestPostData:r.request().postData()};
                const ct=r.headers()['content-type']||'';
                if (/json|text/.test(ct)) {
                  try { item.body=(await r.text()).slice(0,5000); } catch {}
                }
                traffic.push(item);
              });
              await page.goto('https://www.uhif.am/en/hospitals', {waitUntil:'networkidle', timeout:90000});
              await page.waitForTimeout(2500);
              console.log('ARMENIA title=', await page.title());
              console.log('ARMENIA result=', await page.locator('h2').allTextContents());
              console.log('ARMENIA inputs=', await page.locator('input,select').evaluateAll(els=>els.map(e=>({tag:e.tagName,id:e.id,name:e.name,type:e.type,value:e.value,placeholder:e.placeholder}))));
              console.log('ARMENIA traffic=', JSON.stringify(traffic,null,2));
              fs.writeFileSync('/tmp/registry-probe/armenia.html', await page.content());
              await page.close();
            }

            await probeIceland().catch(e=>{console.error('ICELAND ERROR',e); process.exitCode=1;});
            await probeArmenia().catch(e=>{console.error('ARMENIA ERROR',e); process.exitCode=1;});
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Upload probe artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remaining-europe-registry-probe
          path: /tmp/registry-probe/*
          if-no-files-found: warn
