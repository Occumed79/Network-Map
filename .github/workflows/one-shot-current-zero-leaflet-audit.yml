name: One-shot rendered-feature acceptance repair

on:
  push:
    paths:
      - .github/workflows/one-shot-current-zero-leaflet-audit.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: nuclear/remove-leaflet-compat
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Replace source-cache assertions with rendered-feature assertions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs")
          text = path.read_text()

          def sub_once(pattern, replacement, label, flags=re.M):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{label}: replacement count={count}")

          helper_pattern = r'async function nativeSourceFeatureCount\(page, sourceId, mode = "2d"\) \{.*?\n\}\n\nasync function nativePopupFeaturePoint\(page, needle\) \{.*?\n\}\n\n(?=async function waitForMode)'
          helper_replacement = '''async function nativeSourceFeatureCount(page, sourceId, mode = "2d") {
            return page.evaluate(({ requestedSourceId, requestedMode }) => {
              const maps = window.__NETWORK_MAP_MAPBOX_LIFECYCLE__?.getMaps?.() || [];
              const selector = requestedMode === "3d" ? ".mapbox-globe-host" : ".mapbox-2d-host";
              const map = maps.find((candidate) => Boolean(candidate.getContainer().closest(selector)));
              if (!map || !map.getSource(requestedSourceId)) return 0;
              const layers = (map.getStyle()?.layers || [])
                .filter((layer) => layer.source === requestedSourceId && layer.type !== "heatmap")
                .map((layer) => layer.id);
              if (!layers.length) return 0;
              const canvas = map.getCanvas();
              try { return map.queryRenderedFeatures([[0, 0], [canvas.clientWidth, canvas.clientHeight]], { layers }).length; }
              catch { return 0; }
            }, { requestedSourceId: sourceId, requestedMode: mode });
          }

          async function nativePopupFeaturePoint(page, needle) {
            return page.evaluate((popupNeedle) => {
              const maps = window.__NETWORK_MAP_MAPBOX_LIFECYCLE__?.getMaps?.() || [];
              const map = maps.find((candidate) => Boolean(candidate.getContainer().closest(".mapbox-2d-host")));
              if (!map) throw new Error("2D Mapbox map not available");
              const layers = (map.getStyle()?.layers || [])
                .filter((layer) => layer.type === "circle" && (
                  String(layer.source || "").startsWith("provider-explorer-native-")
                  || String(layer.source || "").startsWith("provider-dataset-native-")
                ))
                .map((layer) => layer.id);
              const canvas = map.getCanvas();
              let features = [];
              try { features = layers.length ? map.queryRenderedFeatures([[0, 0], [canvas.clientWidth, canvas.clientHeight]], { layers }) : []; }
              catch {}
              const diagnostics = [{ layers, count: features.length, popupPreviews: features.map((feature) => String(feature.properties?.popupHtml || "").slice(0, 120)) }];
              const feature = features.find((candidate) => String(candidate.properties?.popupHtml || "").includes(popupNeedle));
              if (!feature || feature.geometry?.type !== "Point") return { x: null, y: null, sourceId: null, coordinates: null, diagnostics };
              const coordinates = feature.geometry.coordinates;
              const point = map.project(coordinates);
              const rect = map.getCanvas().getBoundingClientRect();
              return { x: rect.left + point.x, y: rect.top + point.y, sourceId: String(feature.source || ""), coordinates, diagnostics };
            }, needle);
          }

          '''
          sub_once(helper_pattern, lambda _: helper_replacement, "native helpers", flags=re.S)

          def rendered_return(match, layer_expr, comparison):
              i = match.group('i')
              return f'{i}const canvas = map.getCanvas();\n{i}try {{ return map.queryRenderedFeatures([[0, 0], [canvas.clientWidth, canvas.clientHeight]], {{ layers: {layer_expr} }}).length {comparison}; }} catch {{ return false; }}'

          pattern = r'(?P<i>^[ \t]*)try \{ return \(map\.querySourceFeatures\("provider-dataset-native-indexed"\) \|\| \[\]\)\.length >= 2; \} catch \{ return false; \}'
          sub_once(pattern, lambda m: rendered_return(m, '["provider-dataset-native-indexed-points"]', '>= 2'), "indexed readiness")

          diag_pattern = r'(?P<i>^[ \t]*)const sourceId = "provider-dataset-native-indexed";\n(?P=i)let sourceFeatures = \[\];\n(?P=i)try \{ sourceFeatures = map\.querySourceFeatures\(sourceId\) \|\| \[\]; \} catch \{\}'
          def diag_repl(m):
              i = m.group('i')
              return f'''{i}const sourceId = "provider-dataset-native-indexed";
          {i}const layerId = "provider-dataset-native-indexed-points";
          {i}let sourceFeatures = [];
          {i}try {{
          {i}  const canvas = map.getCanvas();
          {i}  sourceFeatures = map.getLayer(layerId) ? map.queryRenderedFeatures([[0, 0], [canvas.clientWidth, canvas.clientHeight]], {{ layers: [layerId] }}) : [];
          {i}}} catch {{}}'''.replace('\n          ', '\n')
          sub_once(diag_pattern, diag_repl, "indexed diagnostics")

          pattern = r'(?P<i>^[ \t]*)try \{ return \(map\.querySourceFeatures\("radius-extractor-native"\) \|\| \[\]\)\.length > before; \} catch \{ return false; \}'
          sub_once(pattern, lambda m: rendered_return(m, '["radius-extractor-native-fill", "radius-extractor-native-line", "radius-extractor-native-center"].filter((id) => Boolean(map.getLayer(id)))', '> before'), "2D radius")

          pattern = r'(?P<i>^[ \t]*)try \{ return \(map\.querySourceFeatures\("radius-extractor-native"\) \|\| \[\]\)\.length > 0; \} catch \{ return false; \}'
          sub_once(pattern, lambda m: rendered_return(m, '["radius-extractor-native-fill", "radius-extractor-native-line", "radius-extractor-native-center"].filter((id) => Boolean(map.getLayer(id)))', '> 0'), "3D radius")

          pattern = r'(?P<i>^[ \t]*)try \{ return \(map\.querySourceFeatures\("provider-explorer-native-aggregate"\) \|\| \[\]\)\.length === 2; \} catch \{ return false; \}'
          sub_once(pattern, lambda m: rendered_return(m, '["provider-explorer-native-density"]', '=== 2'), "density")

          hex_pattern = r'(?P<i>^[ \t]*)const features = map\.querySourceFeatures\("provider-explorer-native-aggregate"\) \|\| \[\];\n(?P=i)return features\.length === 2 && features\.every\(\(feature\) => feature\.geometry\?\.type === "Polygon"\);'
          def hex_repl(m):
              i = m.group('i')
              return f'{i}const canvas = map.getCanvas();\n{i}const features = map.queryRenderedFeatures([[0, 0], [canvas.clientWidth, canvas.clientHeight]], {{ layers: ["provider-explorer-native-hex-fill"] }});\n{i}return features.length === 2 && features.every((feature) => feature.geometry?.type === "Polygon");'
          sub_once(hex_pattern, hex_repl, "hex")

          if "querySourceFeatures(" in text:
              raise SystemExit("querySourceFeatures remains in native critical-tools acceptance")
          path.write_text(text)
          PY
      - name: Syntax check
        run: node --check occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs
      - name: Commit repair
        shell: bash
        run: |
          git config user.name "Occumed79"
          git config user.email "Occumed79@users.noreply.github.com"
          git add occu-med-map/scripts/ci-mapbox-native-tools-acceptance.mjs
          git commit -m "Assert rendered native Mapbox features in browser acceptance"
          git fetch origin nuclear/remove-leaflet-compat
          git rebase origin/nuclear/remove-leaflet-compat
          git push origin HEAD:nuclear/remove-leaflet-compat
