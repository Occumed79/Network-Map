name: Download WHO UHC service coverage

on:
  push:
    branches:
      - data/international-source-bootstrap
    paths:
      - scripts/bootstrap-who-uhc-data.mjs
      - scripts/discover-who-hhfa-sara-reports.mjs
      - .github/workflows/download-who-uhc.yml
  pull_request:
    branches:
      - main
    paths:
      - scripts/bootstrap-who-uhc-data.mjs
      - scripts/discover-who-hhfa-sara-reports.mjs
      - .github/workflows/download-who-uhc.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'data/international-source-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download and normalize WHO UHC service coverage data
        run: |
          set +e
          node scripts/bootstrap-who-uhc-data.mjs > /tmp/who-uhc-download.log 2>&1
          status=$?
          mkdir -p data/generated/who-uhc
          cp /tmp/who-uhc-download.log data/generated/who-uhc/download.log
          echo "$status" > data/generated/who-uhc/download.exit-code
          cat /tmp/who-uhc-download.log
          exit 0

      - name: Resolve verified Neon endpoint hosts
        run: |
          mkdir -p data/generated/who-uhc
          for host in \
            ep-autumn-hill-atgvqg3e-pooler.c-9.us-east-1.aws.neon.tech \
            ep-autumn-hill-atgvqg3e.c-9.us-east-1.aws.neon.tech; do
            echo "[$host]" >> data/generated/who-uhc/neon-host-ips.txt
            getent ahostsv4 "$host" | awk '{print $1}' | sort -u >> data/generated/who-uhc/neon-host-ips.txt || true
          done
          cat data/generated/who-uhc/neon-host-ips.txt

      - name: Upload WHO UHC dataset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-uhc-service-coverage
          path: data/generated/who-uhc
          if-no-files-found: error
          retention-days: 7

  discover-hhfa-sara:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.head_ref == 'data/international-source-bootstrap')
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: data/international-source-bootstrap
          fetch-depth: 1

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install PDF text tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Inventory WHO HHFA and SARA archive
        run: |
          set +e
          node scripts/discover-who-hhfa-sara-reports.mjs > /tmp/hhfa-sara.log 2>&1
          status=$?
          mkdir -p data/generated/who-hhfa-sara
          cp /tmp/hhfa-sara.log data/generated/who-hhfa-sara/run.log
          echo "$status" > data/generated/who-hhfa-sara/run.exit-code
          cat /tmp/hhfa-sara.log
          exit 0

      - name: Upload WHO HHFA and SARA discovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: who-hhfa-sara-discovery
          path: data/generated/who-hhfa-sara
          if-no-files-found: error
          retention-days: 7
