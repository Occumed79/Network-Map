name: Sync Brazil CNES healthcare establishments

on:
  workflow_dispatch:
  schedule:
    - cron: "20 9 * * *"

permissions:
  contents: read

concurrency:
  group: brazil-cnes-provider-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Download and promote official CNES registry
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TARGET_DATABASE_URL: ${{ secrets.HEALTHSITES_DATABASE_URL }}
      CNES_JSON_ZIP_URL: https://s3.sa-east-1.amazonaws.com/ckan.saude.gov.br/CNES/cnes_estabelecimentos_json.zip

    steps:
      - name: Check out importer
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install import tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq postgresql-client unzip

      - name: Validate provider database
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_DATABASE_URL" == postgres* ]] || { echo "HEALTHSITES_DATABASE_URL is missing" >&2; exit 1; }
          echo "::add-mask::${TARGET_DATABASE_URL}"
          test "$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT to_regclass('public.provider_master_map_view') IS NOT NULL")" = "t"

      - name: Download official CNES bulk JSON
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/cnes/raw /tmp/cnes/extracted
          curl --fail --location --retry 4 --retry-all-errors \
            "$CNES_JSON_ZIP_URL" \
            --output /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          test -s /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          unzip -tq /tmp/cnes/raw/cnes_estabelecimentos_json.zip
          unzip -q /tmp/cnes/raw/cnes_estabelecimentos_json.zip -d /tmp/cnes/extracted
          find /tmp/cnes/extracted -type f -maxdepth 4 -printf '%p %s bytes\n' | head -30

      - name: Normalize geocoded CNES establishments
        shell: bash
        run: |
          set -euo pipefail
          NORMALIZED=/tmp/cnes/cnes-provider.tsv
          mapfile -d '' json_files < <(find /tmp/cnes/extracted -type f -iname '*.json' -print0)
          [[ "${#json_files[@]}" -gt 0 ]] || { echo "CNES archive did not contain JSON files" >&2; exit 1; }

          for file in "${json_files[@]}"; do
            jq -c '.. | objects | select(.codigo_cnes? != null)' "$file" \
              | node scripts/normalize-cnes-jsonl.mjs --output "$NORMALIZED"
          done

          test -s "$NORMALIZED"
          header="$(head -n 1 "$NORMALIZED")"
          { printf '%s\n' "$header"; tail -n +2 "$NORMALIZED" | sort -t $'\t' -k1,1 -u; } > /tmp/cnes/cnes-provider-dedup.tsv
          mv /tmp/cnes/cnes-provider-dedup.tsv "$NORMALIZED"

          expected=$(( $(wc -l < "$NORMALIZED") - 1 ))
          distinct_master="$(tail -n +2 "$NORMALIZED" | cut -f19 | sort -u | wc -l | tr -d ' ')"
          (( expected >= 25000 )) || { echo "Only ${expected} geocoded CNES establishments; refusing promotion" >&2; exit 1; }
          (( distinct_master >= 20000 )) || { echo "Only ${distinct_master} CNES canonical locations; refusing promotion" >&2; exit 1; }

          echo "CNES_EXPECTED=${expected}" >> "$GITHUB_ENV"
          echo "CNES_EXPECTED_MASTER=${distinct_master}" >> "$GITHUB_ENV"
          echo "CNES geocoded records: ${expected}; canonical locations: ${distinct_master}"

      - name: Stage normalized CNES rows
        shell: bash
        run: |
          set -euo pipefail
          columns="source_record_id,source_url,name,normalized_name,address_line1,formatted_address,city,state_region,postal_code,country_code,lat,lng,phone,website,email,primary_provider_type,capability_tags,quality_score,master_key"

          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 -c "
            CREATE TABLE IF NOT EXISTS public.source5_import_staging (
              source_record_id text PRIMARY KEY,
              source_url text,
              name text NOT NULL,
              normalized_name text,
              address_line1 text,
              formatted_address text,
              city text,
              state_region text,
              postal_code text,
              country_code text NOT NULL,
              lat double precision NOT NULL,
              lng double precision NOT NULL,
              phone text,
              website text,
              email text,
              primary_provider_type text,
              capability_tags text[] NOT NULL DEFAULT ARRAY[]::text[],
              quality_score numeric,
              master_key text NOT NULL
            );
            TRUNCATE public.source5_import_staging;
          "

          psql "$TARGET_DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "\\copy public.source5_import_staging (${columns}) FROM STDIN WITH (FORMAT csv, HEADER true, DELIMITER E'\\t', NULL '\\N', QUOTE '\"', ESCAPE '\"')" \
            < /tmp/cnes/cnes-provider.tsv

          actual="$(psql "$TARGET_DATABASE_URL" -Atqc 'SELECT count(*) FROM public.source5_import_staging')"
          [[ "$actual" == "$CNES_EXPECTED" ]] || { echo "Staging mismatch ${actual} vs ${CNES_EXPECTED}" >&2; exit 1; }

      - name: Promote CNES into canonical registry
        shell: bash
        run: |
          set -euo pipefail
          psql "$TARGET_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -v expected="$CNES_EXPECTED" \
            -v expected_master="$CNES_EXPECTED_MASTER" \
            -f scripts/promote-brazil-cnes.sql

      - name: Verify production Brazil source
        shell: bash
        run: |
          set -euo pipefail
          source_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_sources WHERE source_key='br_cnes'")"
          mapped_count="$(psql "$TARGET_DATABASE_URL" -Atqc "SELECT count(*) FROM public.provider_master_map_view WHERE source_key='br_cnes' AND country_code='BR' AND lat IS NOT NULL AND lng IS NOT NULL")"
          [[ "$source_count" == "$CNES_EXPECTED" ]] || { echo "CNES lineage mismatch ${source_count} vs ${CNES_EXPECTED}" >&2; exit 1; }
          (( mapped_count >= 20000 )) || { echo "Only ${mapped_count} CNES providers map-renderable" >&2; exit 1; }
          echo "Brazil CNES source records: ${source_count}"
          echo "Brazil CNES map-renderable providers: ${mapped_count}"
